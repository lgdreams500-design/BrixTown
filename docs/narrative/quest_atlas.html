d": ["!home:owned", "money:15000"]}, {"text": "(Lose your nerve. Order a tea.)", "next": "q_tea"}]}, "q_again2": {"who": "mei", "mood": "happy", "say": "Then it's the same answer. Yes, and not yet. A door of our own, with a key that nobody else has. A hundred and fifty brix put by, in a book I can look at. Then ask me again.", "options": [{"text": "A door and a hundred and fifty brix.", "next": null, "act": ["stage:home"]}]}, "q_again2h": {"who": "mei", "mood": "happy", "say": "Then it's the same answer. Yes, and not yet. You've the door; I have walked past it. A hundred and fifty brix put by, in a book I can look at. Then ask me in the hall.", "options": [{"text": "A hundred and fifty brix.", "next": null, "act": ["stage:savings"]}]}, "q_again2m": {"who": "mei", "mood": "happy", "say": "Then it's the same answer. Yes, and not yet. You've the money put by; I asked at the bank. A door of our own, with a key that nobody else has. Then ask me again.", "options": [{"text": "A door.", "next": null, "act": ["stage:home"]}]}, "q_ready_again": {"who": "mei", "mood": "surprised", "say": "You've a face on again. And a key in your hand. And that's a bank book. You went and got it sorted. Ask me, then. Properly.", "options": [{"text": "Marry me, Mei.", "next": "q_yes"}]}, "q1": {"who": "mei", "mood": "thinking", "say": "You've a face on. The face people have when they come in to ask somebody something and order a tea they don't want. Go on. I'm sitting down for it.", "options": [{"text": "Marry me, Mei.", "next": "q2"}, {"text": "(Lose your nerve. Order a tea.)", "next": "q_tea"}]}, "q_tea": {"who": "mei", "mood": "happy", "say": "One tea. I'll be here when it's a question.", "options": [{"text": "(Drink the tea.)", "next": null}]}, "q2": {"who": "mei", "mood": "happy", "say": "Yes. Obviously yes. I've been telling people yes for a week; I was only waiting for you to ask. But not yet. Listen. For once I'm going to say a thing to you and nobody else.", "options": [{"text": "I'm listening.", "next": "q3", "need": ["!home:owned"]}, {"text": "I'm listening.", "next": "q3_home", "need": ["home:owned"]}]}, "q3": {"who": "mei", "mood": "thinking", "say": "I've lived my whole life behind walls thin enough to hear the tram timetable through, and I share a flat even now. I'm not starting a marriage in a rented room off a shared stair. I want a door. Ours. With a key that nobody else has.", "options": [{"text": "A door. What else?", "next": "q4", "need": ["!money:15000"]}, {"text": "A door. What else?", "next": "q4_money", "need": ["money:15000"]}]}, "q3_home": {"who": "mei", "mood": "thinking", "say": "You've a door already. I know; I have walked past it, and told myself not to count on it. So it's only the one thing.", "options": [{"text": "What one thing?", "next": "q4_home"}]}, "q4_home": {"who": "mei", "mood": "neutral", "say": "Something put by. A hundred and fifty brix, in a bank book I can look at. Not for a wedding. For the day the tram stops, or the oven cracks, or one of us is ill. My mother married on love and a Tuesday wage. I watched how that goes.", "options": [{"text": "A hundred and fifty brix. Then I'll ask again.", "next": null, "act": ["stage:savings"]}, {"text": "A hundred and fifty brix is a lot to ask of a baker.", "next": "q5"}]}, "q4_money": {"who": "mei", "mood": "happy", "say": "And something put by, which I'm told you have. I asked at the bank. I'm not proud of it. So it's only the door.", "options": [{"text": "A door. Then I'll ask again.", "next": null, "act": ["stage:home"]}]}, "q4": {"who": "mei", "mood": "neutral", "say": "Something put by. A hundred and fifty brix, in a bank book I can look at. Not for a wedding. For the day the tram stops, or the oven cracks, or one of us is ill. My mother married on love and a Tuesday wage. I watched how that goes.", "options": [{"text": "A door and a hundred and fifty brix. Then I'll ask again.", "next": null, "act": ["stage:home"]}, {"text": "A hundred and fifty brix is a lot to ask of a baker.", "next": "q5"}]}, "q5": {"who": "mei", "mood": "happy", "say": "It is. I'm worth a lot. Ask anybody. I'll have told them.", "options": [{"text": "Then that is what I'll bring you.", "next": null, "need": ["!home:owned"], "act": ["stage:home"]}, {"text": "Then that is what I'll bring you.", "next": null, "need": ["home:owned"], "act": ["stage:savings"]}, {"text": "Then perhaps we should wait.", "next": "q_wait"}]}, "q_wait": {"who": "mei", "mood": "sad", "say": "Perhaps we should. I'd rather wait than marry a maybe. You know where the counter is.", "options": [{"text": "(Go.)", "next": null, "act": ["end:not_yet"]}]}, "q_already": {"who": "mei", "mood": "surprised", "say": "Before you say it. I was going to make a speech. A door of our own, and a hundred and fifty brix put by, and not before. I've rehearsed it at the till. Don't. I can see it in your face. You've a house. And a bank book. You did it before you asked? Who does it in that order?", "options": [{"text": "A baker. We prove things first.", "next": "q_already2"}]}, "q_already2": {"who": "mei", "mood": "happy", "say": "That's the best thing you've ever said, and I'm stealing it. Ask me, then. Properly.", "options": [{"text": "Marry me, Mei.", "next": "q_yes"}]}, "q_yes": {"who": "mei", "mood": "happy", "say": "Yes. Yes, and I'm telling everyone, and you can't stop me. I'm starting with Noor.", "options": [{"text": "(Let her tell the town.)", "next": null, "act": ["end:yes"]}]}}}, {"id": "home", "title": "A door", "kind": "home", "goal": "Own a home of your own", "log": "Buy a home: through an estate agent, or from the board over any door with a home for sale. A mortgage from Linden Bank counts. A rented room does not.", "sim": ["home:owned"], "then": "stage:savings"}, {"id": "savings", "title": "Something put by", "kind": "money", "goal": "Have 150 Bx put by", "log": "Put by 150 Bx, in cash and accounts together. A savings account at Linden Bank grows a little every day.", "sim": ["pay:15000"], "then": "stage:door"}, {"id": "door", "title": "The key", "kind": "talk", "with": "mei", "goal": "Bring Mei to the door", "log": "You have the door, and the book. Bring Mei to see them.", "scene": "You give her the key on the step. She looks at it for a while before she uses it.", "start": "r1", "nodes": {"r1": {"who": "mei", "mood": "surprised", "dir": "She tries the key twice, as though it might be a joke.", "say": "It turns. There's a hall. We'd have a hall. I've never had anywhere to put a coat that wasn't a chair.", "options": [{"text": "And the bank book.", "next": "r2"}]}, "r2": {"who": "mei", "mood": "happy", "say": "A hundred and fifty. In a book. You've put my name in it. Before I'd said yes?", "options": [{"text": "You said yes the day I asked. You told the tram.", "next": "r3"}]}, "r3": {"who": "mei", "mood": "happy", "say": "I did tell the tram. Ask me again. Here, in the hall. I want to remember that it had an echo.", "options": [{"text": "Marry me, Mei.", "next": "r_yes"}]}, "r_yes": {"who": "mei", "mood": "happy", "say": "Yes. Yes, and I'm telling everyone, and you can't stop me. I'm starting with Noor.", "options": [{"text": "(Let her tell the town.)", "next": null, "act": ["end:yes"]}]}}}], "endings": [{"id": "yes", "title": "Yes, and she's telling everyone", "log": "Mei said yes. By the first tram, the whole line knew.", "pay": 0, "rep": {"mei": 20, "noor": 5, "eli": 5}, "flags": ["engaged"], "ripples": ["Eli has had the wedding form filled in since the lunch.", "Noor announces that a baker does not bake their own wedding loaf, and that this one is hers.", "The home you bought is where Mei moves to, out of the flat she shares at Lantern Court."], "unlocks": "Engaged to Mei. The wedding."}, {"id": "not_yet", "retake": true, "title": "Not a maybe", "log": "“I'd rather wait than marry a maybe.” The counter is where it always was.", "pay": 0, "rep": {"mei": -10}, "flags": [], "ripples": ["You are still walking out. The question can be asked again when her regard is back at 75."], "unlocks": "Nothing yet."}]}, {"id": "the_wedding", "group": "romance", "act": "W", "title": "The Wedding", "rank": "The wedding", "giver": "eli", "needs": ["done:question_mei:yes"], "hook": "Once Mei has said yes. Eli has had the form filled in since the lunch.", "summary": "A market day by the fountain, Eli's rope line holding back most of Old Town, and a loaf under a clean cloth that you did not bake, because a baker does not bake their own wedding bread. Noor bakes it. Who stands up with you and who is in the crowd depend on how you lived the career. It ends at your own door, with one last question: what do we do first?", "theme": "The end of the quest line, and the first evening of everything after.", "start": "clipboard", "stages": [{"id": "clipboard", "title": "The form", "kind": "talk", "with": "eli", "goal": "See Eli on Market Square", "log": "Eli is organising your wedding, whether or not anybody asked him to. He needs two things.", "start": "e1", "starts": [{"need": ["!done:own_stall:*", "!done:market_day:*"], "node": "e1_new"}], "nodes": {"e1_new": {"who": "eli", "mood": "happy", "say": "You'll not know me. Eli. I run the market, and anything else in this town that needs a rope. A wedding! Mei told me, so I've had the form filled in since the lunch. I need two things from you. Where, and who stands up with you.", "options": [{"text": "By the fountain. Where everybody can see.", "next": "e2", "act": ["flag:wed_fountain"]}, {"text": "At the Long Table, with the Town Oven lit.", "next": "e2", "need": ["flag:end_long_table"], "act": ["flag:wed_table"]}]}, "e1": {"who": "eli", "mood": "happy", "say": "A wedding! I've had the form filled in since the lunch. Market day, with a rope line for the aunts. I need two things from you. Where, and who stands up with you.", "options": [{"text": "By the fountain. Where everybody can see.", "next": "e2", "act": ["flag:wed_fountain"]}, {"text": "At the Long Table, with the Town Oven lit.", "next": "e2", "need": ["flag:end_long_table"], "act": ["flag:wed_table"]}]}, "e2": {"who": "eli", "mood": "thinking", "say": "And who stands up with you? Somebody has to hold the ring and tell you when to breathe.", "options": [{"text": "Pip.", "next": "e3", "need": ["!flag:pip_leaves", "rep:pip:0"], "act": ["flag:best_pip", "rep:pip:+10"]}, {"text": "Abe. He gave me work when I was new in town.", "next": "e3", "need": ["done:errand_runner:delivered"], "act": ["flag:best_abe", "rep:abe:+10"]}, {"text": "Tam.", "next": "e3", "need": ["flag:end_long_table"], "act": ["flag:best_tam", "rep:tam:+10"]}, {"text": "Tam.", "next": "e3", "need": ["flag:end_homecoming"], "act": ["flag:best_tam", "rep:tam:+10"]}, {"text": "Olu. He'll say he introduced us whether I ask him or not.", "next": "e3", "act": ["flag:best_olu", "rep:olu:+10"]}]}, "e3": {"who": "eli", "mood": "happy", "say": "Written down. In ink. Now go away and be nervous somewhere else. I've a rope to measure.", "options": [{"text": "(Go and be nervous.)", "next": null, "act": ["stage:loaf"]}]}}}, {"id": "loaf", "title": "The wedding loaf", "kind": "talk", "with": "noor", "goal": "Four in the morning at the Stone Oven, on the day", "log": "The morning of the wedding. A baker does not bake their own wedding loaf. Somebody else is at the oven.", "start": "l_noor", "starts": [{"need": ["flag:end_crumb"], "node": "l_noor_crumb"}, {"need": ["done:name_on_the_door:*"], "node": "l_noor_hands"}], "nodes": {"l_noor": {"who": "noor", "mood": "neutral", "say": "A baker doesn't bake their own wedding loaf. It's bad luck, and worse manners. This one's mine. Go and find a clean shirt.", "options": [{"text": "What will you bake?", "next": "l_noor2"}, {"text": "Thank you, Noor.", "next": null, "act": ["stage:square"]}]}, "l_noor_hands": {"who": "noor", "mood": "neutral", "say": "A baker doesn't bake their own wedding loaf. It's bad luck, and worse manners. This one's mine. I can't shape it any more, so it will be shaped under my e <script>
"use strict";

const KIND = {talk: "Talk", near: "Be there", go: "Go there", moment: "A moment", have: "Have an item", bank: "At the bank",
  money: "Have the money", home: "Own a home", stall: "Rent a stall", stall_sold: "Sell from your stall"};
const ui = {quest: baker[0].id, mode: "tree", zoom: 1};

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(3)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
const pretty = s => s.replace(/_/g, " ");
const bx = chips => (chips % 100 ? (chips / 100).toFixed(2) : String(chips / 100)) + " Bx";
const signed = n => (n > 0 ? "+" : "−") + Math.abs(n);
const flagLabel = f => (threads[f] ? threads[f].label : pretty(f));
const endingOf = (q, id) => q.endings.find(e => e.id === id);
const stageOf = (q, id) => q.stages.find(s => s.id === id);

function rich(str) {
  return str.split(/(\{\w+\})/).map(part => /^\{\w+\}$/.test(part) ? h("span", {class: "var", text: part}) : part);
}
function ava(id) {
  const p = people[id];
  return h("span", {class: "ava", style: `background:${p ? p.color : "var(--m-neutral)"}`, text: p ? p.name[0] : "?", "aria-hidden": "true"});
}
function chip(cls, text, title) { return h("span", {class: "chip " + cls, text, title}); }

function needText(need) {
  const neg = need.startsWith("!"), raw = neg ? need.slice(1) : need;
  const i = raw.indexOf(":"), kind = raw.slice(0, i), rest = raw.slice(i + 1);
  if (kind === "flag") return (neg ? "unless: " : "if: ") + flagLabel(rest);
  if (kind === "have") return (neg ? "not carrying: " : "carrying: ") + pretty(rest);
  if (kind === "money") return "has " + bx(+rest);
  if (kind === "home") return neg ? "has no home of their own" : "owns a home";
  if (kind === "again") return neg ? "first time of asking" : "taken before";
  if (kind === "rep") { const [who, n] = rest.split(":"); return `${people[who].name}'s regard ${n}+`; }
  if (kind === "done") {
    const [qid, ends] = rest.split(":"), q = quests[qid];
    const which = ends === "*" ? "finished" : ends.split("|").map(e => endingOf(q, e).title).join(" or ");
    return (neg ? "unless " : "") + `${q.title}: ${which}`;
  }
  return need;
}
function needChips(needs) { return (needs || []).map(n => chip("need", needText(n), n)); }

function scrollFlash(el) {
  if (!el) return;
  for (let p = el.parentElement; p; p = p.parentElement) if (p.classList.contains("kids")) { p.hidden = false; }
  el.scrollIntoView({block: "center", behavior: "smooth"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
}
function actChips(acts, q, clickable) {
  return (acts || []).map(act => {
    const i = act.indexOf(":"), kind = act.slice(0, i), rest = act.slice(i + 1);
    if (kind === "flag") return chip("gain", "⚑ " + flagLabel(rest), "sets " + rest);
    if (kind === "unflag") return chip("lose", "clears: " + flagLabel(rest));
    if (kind === "give") return chip("gain", "+ " + pretty(rest));
    if (kind === "take") return chip("lose", "− " + pretty(rest));
    if (kind === "pay") return chip("gain", "+" + bx(+rest));
    if (kind === "charge") return chip("lose", "−" + bx(+rest));
    if (kind === "home") return chip("gain", "+ a home of your own");
    if (kind === "rep") { const [who, n] = rest.split(":"); return chip(+n >= 0 ? "gain" : "lose", `${people[who].name} ${signed(+n)}`); }
    if (kind === "stage") {
      const s = stageOf(q, rest), c = chip("goto", "→ " + s.title, "goes on to this stage");
      if (clickable) c.addEventListener("click", ev => { ev.stopPropagation(); scrollFlash($(`s-${q.id}-${rest}`)); });
      return c;
    }
    if (kind === "end") {
      const c = chip("end", "◆ " + endingOf(q, rest).title, "ends the quest line");
      if (clickable) { c.style.cursor = "pointer"; c.addEventListener("click", ev => { ev.stopPropagation(); scrollFlash($(`e-${q.id}-${rest}`)); }); }
      return c;
    }
    return chip("", act);
  });
}

/* ---------- tabs ---------- */
function show(tab) {
  if (!TABS.some(t => t[0] === tab)) tab = "quests";
  for (const [id] of TABS) {
    $("v-" + id).classList.toggle("on", id === tab);
    $("t-" + id).classList.toggle("on", id === tab);
    $("t-" + id).setAttribute("aria-selected", id === tab);
  }
  if (location.hash.slice(1) !== tab) { try { history.replaceState(null, "", "#" + tab); } catch (e) { location.hash = tab; } }
  window.scrollTo(0, 0);
  if (tab === "quests") relayoutTrees();
}
function openQuest(id, mode) {
  ui.quest = id;

}

        h("button", {class: "btn", text: "Mei: Twenty Minutes", onclick: () => openQuest("lunch_mei", "tree")}),
        h("button", {class: "btn", text: "The Wedding", onclick: () => openQuest("the_wedding", "tree")}))),
    h("div", {class: "grid g2", style: "margin-top:26px"},
      h("div", {class: "card"},
        h("h3", {style: "margin-top:0", text: "How to read this"}),
        h("ul", {class: "plain"},
          h("li", {}, h("b", {text: "Dialogue trees"}), " is the writing itself. Pick a quest on the left. The quest map shows its stages and where they branch; under it every conversation is drawn as a tree, read left to right. Script shows the same lines as plain indented text. Play lets you make the choices and watch the path light up."),
          h("li", {}, h("b", {text: "Cast"}), " has the seven new residents and the six from the slice that this career draws in."),
          h("li", {}, h("b", {text: "Connections"}), " shows who is tied to whom, and who speaks in which quest."),
          h("li", {}, h("b", {text: "Consequences"}), " follows each decision forward to where it lands, sometimes three quests later."),
          h("li", {}, "The four starter quests that are in the slice today are included unchanged, so you can see where the new career hooks into them."))),
      h("div", {class: "card"},
        h("h3", {style: "margin-top:0", text: "Where this stands"}),
        h("ul", {class: "plain"},
          h("li", {text: "Approved by the owner on 25 November 2026: the Baker career and courting Mei, as shown here."}),
          h("li", {text: "Decided along the way: no seasons, each player's own story, Jai at the museum, the town is Old Town, Noor is 58 and is not courted."}),

    h("h3", {text: "What it would need from the game"}),

    h("div", {class: "card"}, h("dl", {class: "adds"}, A.world.additions.map(a => [h("dt", {text: a.what}), h("dd", {text: a.why})]))),
    h("p", {class: "small", style: "margin-top:16px", text:
      `Checked before building: every reply leads to a real line, every stage and ending can be reached, and ${s.play_throughs.toLocaleString()} random play-throughs of the whole career found no place where the player is left without a reply. Rewards are placeholders until balanced.`})
  );
  $("pills").replaceChildren(

    h("p", {class: "lead", text: "Seven new residents, each with a trade, a want and something they are hiding. Then the six people already in the slice, with what this career adds to them."}),
    h("h3", {text: "New for the Baker"}), h("div", {class: "grid g2"}, fresh.map(card)),
    h("h3", {text: "Already in the slice"}), h("div", {class: "grid g2"}, old.map(card)));
}

/* ---------- connections ---------- */
const EDGE = {family: ["var(--m-happy)", ""], rift: ["var(--m-angry)", "7 5"], secret: ["var(--m-surprised)", "2 5"], friend: ["var(--m-sad)", ""],
  work: ["var(--soft)", ""], trade: ["var(--line)", ""], quest: ["var(--m-thinking)", "7 5"]};
const EDGE_NAME = {family: "Family", rift: "Estranged", secret: "Secret", friend: "Friends", work: "Work", trade: "Trade", quest: "Tied by a quest"};
function svg(tag, attrs, ...kids) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) if (k === "text") e.textContent = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  e.append(...kids.flat());
  return e;
}
function renderWeb() {
  const pos = A.cast.map, pairs = new Map();
  for (const p of A.cast.people) for (const [to, kind, label] of p.ties) {
    const key = [p.id, to].sort().join("|");
    if (!pairs.has(key)) pairs.set(key, {key, a: p.id, b: to, kind, said: []});
    pairs.get(key).said.push(`${p.name}: ${label}`);
  }
  const edges = [], labels = [], nodes = [];
  for (const e of pairs.values()) {
    const [x1, y1] = pos[e.a], [x2, y2] = pos[e.b], [col, dash] = EDGE[e.kind], short = A.cast.edge_labels[e.key];
    edges.push(svg("line", {x1, y1, x2, y2, style: `stroke:${col}`, "stroke-width": e.kind === "trade" ? 2 : 2.5, "stroke-dasharray": dash, "stroke-linecap": "round"},
      svg("title", {text: e.said.join(" / ")})));
    if (short) labels.push(svg("text", {x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 6, "text-anchor": "middle", "font-size": 11.5,
      style: "fill:var(--soft);stroke:var(--panel);stroke-width:5px;paint-order:stroke", text: short}));
  }
  const tieRows = [...pairs.values()].map(e => h("tr", {},
    h("td", {style: "white-space:nowrap"}, h("b", {text: `${people[e.a].name} and ${people[e.b].name}`})),
    h("td", {}, h("span", {class: "chip", text: EDGE_NAME[e.kind]})),
    h("td", {class: "small", text: e.said.join("  ·  ")})));
  for (const p of A.cast.people) {
    const [x, y] = pos[p.id];
    nodes.push(svg("g", {style: "cursor:pointer", onclick: () => openPerson(p.id), role: "link", "aria-label": p.name},
      p.status === "new" ? svg("circle", {cx: x, cy: y, r: 27, fill: "none", style: "stroke:var(--brass)", "stroke-width": 2}) : [],
      svg("circle", {cx: x, cy: y, r: 22, fill: p.color}),
      svg("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15, "font-weight": 750, fill: "#fff", text: p.name[0]}),
      svg("text", {x, y: y + 44, "text-anchor": "middle", "font-size": 13.5, "font-weight": 700, style: "fill:var(--ink);stroke:var(--panel);stroke-width:4px;paint-order:stroke", text: p.name})));
  }
  const cols = [["Before", live.map(q => q.id)], ...baker.map(q => [q.act, [q.id]]), ["Courting", romance.map(q => q.id)]];
  const rows = A.cast.people.map(p => h("tr", {},
    h("td", {}, h("a", {href: "#cast", text: p.name, onclick: ev => { ev.preventDefault(); openPerson(p.id); }}), p.status === "new" ? h("span", {class: "tag new", text: "new"}) : null),
    cols.map(([, ids]) => { const n = ids.reduce((sum, id) => sum + ((speaks[p.id] || {})[id] || 0), 0); return h("td", {class: "c", style: "font-variant-numeric:tabular-nums", text: n || ""}); })));
  $("v-web").replaceChildren(
    h("h2", {text: "Connections"}),
    h("p", {class: "lead", text: "Who is tied to whom. A brass ring marks the seven new residents. Select anyone to open their card."}),
    h("div", {class: "legend"}, Object.keys(EDGE).map(k => h("span", {}, h("i", {style: `border-top-color:${EDGE[k][0]};border-top-style:${EDGE[k][1] ? (k === "secret" ? "dotted" : "dashed") : "solid"}`}), EDGE_NAME[k]))),
    h("div", {class: "figure"}, svg("svg", {viewBox: "0 0 940 670", role: "img", "aria-label": "Relationship map of the cast"}, edges, labels, nodes)),
    h("h3", {text: "Every tie, in words"}),
    h("div", {class: "tablewrap"}, h("table", {}, h("tbody", {}, tieRows))),
    h("h3", {text: "Who speaks where"}),
    h("p", {class: "lead", text: "Lines spoken by each person in the starter quests and in each of the Baker's five quests."}),
    h("div", {class: "tablewrap"}, h("table", {}, h("thead", {}, h("tr", {}, h("th", {text: "Person"}), cols.map(([name]) => h("th", {class: "c", text: name})))), h("tbody", {}, rows))));
}

/* ---------- consequences ---------- */
function threadPlaces(t) {
  const out = [], isDone = t.id.startsWith("done:");
  const [, dq, dends] = isDone ? t.id.split(":") : [];
  const reads = need => {
    const raw = need.replace(/^!/, "");
    if (!isDone) return raw === "flag:" + t.id;
    if (!raw.startsWith(`done:${dq}:`)) return false;
    const ends = raw.split(":")[2];
    return dends === "*" || (ends !== "*" && ends.split("|").some(e => dends.split("|").includes(e)));
  };
  if (isDone) out.push({q: quests[dq], type: "set", text: dends === "*" ? "Finishing the quest line" : "Ending: " + dends.split("|").map(e => endingOf(quests[dq], e).title).join(" or ")});
  for (const q of A.quests) {
    if ((q.needs || []).some(reads)) out.push({q, type: "read", text: "Needed to start the quest line"});
    for (const s of q.stages) {
      for (const alt of s.starts || []) if (alt.need.some(reads)) out.push({q, s, nid: alt.node, type: "read", text: `${s.title}: the stage opens on a different line`});
      for (const [nid, n] of Object.entries(s.nodes || {})) for (const o of n.options) {
        if ((o.need || []).some(reads)) out.push({q, s, nid, type: "read", text: `${s.title}: ${(o.need || []).some(x => x.startsWith("!") && reads(x)) ? "closes" : "opens"} the reply “${o.text}”`});
        if (!isDone && (o.act || []).includes("flag:" + t.id)) out.push({q, s, nid, type: "set", text: `${s.title}: “${o.text}”`});
      }
    }
    if (!isDone) for (const e of q.endings) if ((e.flags || []).includes(t.id)) out.push({q, type: "set", text: "Ending: " + e.title});
  }
  return out;
}
function renderConsequences() {
  const cols = [["Before", live.map(q => q.id)], ...baker.map(q => [q.act, [q.id]]), ["Courting", romance.map(q => q.id)]];
  const detail = h("div", {class: "where card", hidden: true});
  const showWhere = (t, places) => {
    detail.hidden = false;
    detail.replaceChildren(h("b", {text: t.label}), h("span", {class: "small", text: "  " + t.what}),
      h("ul", {class: "plain"}, places.map(p => h("li", {},
        chip(p.type === "set" ? "end" : "goto", p.type === "set" ? "set" : "read"), " ",
        h("a", {href: "#quests", text: p.q.title, onclick: ev => { ev.preventDefault(); openQuest(p.q.id, "tree"); if (p.s && p.nid) setTimeout(() => scrollFlash($(`t-${p.q.id}-${p.s.id}-${p.nid}`)), 80); }}),
        " · " + p.text))));
    detail.scrollIntoView({block: "nearest", behavior: "smooth"});
  };
  const rows = A.world.threads.map(t => {
    const places = threadPlaces(t);
    return h("tr", {}, h("td", {}, h("b", {text: t.label}), h("div", {class: "small", text: t.what})),
      cols.map(([, ids]) => {
        const here = places.filter(p => ids.includes(p.q.id)), set = here.some(p => p.type === "set"), read = here.some(p => p.type === "read");
        if (!set && !read) return h("td", {class: "c"});
        const what = set && read ? "both" : set ? "set" : "read";
        return h("td", {class: "c"}, h("button", {class: "cellbtn", title: what === "both" ? "set and read here" : what + " here", "aria-label": `${t.label}: ${what} here`, onclick: () => showWhere(t, here)}, h("span", {class: "dot " + what})));
      }));
  });
  $("v-consequences").replaceChildren(
    h("h2", {text: "Consequences"}),
    h("p", {class: "lead", text: "Each row is something the game remembers. A filled token marks where a choice sets it; a ring marks where a later line, reply or ending depends on it. Select a mark to see the exact places."}),
    h("div", {class: "legend"}, h("span", {}, h("span", {class: "dot set"}), "set here"), h("span", {}, h("span", {class: "dot read"}), "read here"), h("span", {}, h("span", {class: "dot both"}), "both")),
    h("div", {class: "tablewrap"}, h("table", {}, h("thead", {}, h("tr", {}, h("th", {text: "Thread"}), cols.map(([name]) => h("th", {class: "c", text: name})))), h("tbody", {}, rows))),
    detail,
    h("h2", {style: "margin-top:44px", text: "The big decisions"}),
    h("p", {class: "lead", text: "The choices that shape the career and the courting, with what each answer does at once and what it does later."}),
    A.world.decisions.map(d => h("div", {class: "decision"},
      h("div", {class: "wh"}, d.where),
      h("h3", {}, d.title),
      h("p", {class: "ask", text: d.ask}),
      h("div", {class: "grid " + (d.options.length >= 3 ? "g3" : "g2")}, d.options.map(o => h("div", {class: "card opt"},
        h("h4", {text: o.pick}), h("p", {class: "now", text: o.now}), h("ul", {}, o.later.map(l => h("li", {text: l})))))),
      h("p", {style: "margin-top:10px"}, h("button", {class: "btn", text: "Read this quest", onclick: () => openQuest(d.quest, "read")}))))
  );
}

/* ---------- lore, careers ahead ---------- */
function renderLore() {
  $("v-lore").replaceChildren(
    h("h2", {text: "Lore"}),
    h("p", {class: "lead", text: "The history the career stands on. It is written to fit what is already on the map: the street names, the taken-down wall, Mill Fields, Brook Farm, the fountain."}),
    h("div", {class: "lore"}, A.world.lore.map(l => h("article", {}, h("h3", {text: l.title}), l.text.map(t => h("p", {text: t})), h("div", {class: "used", text: "Where it is used: " + l.used})))));
}

  $("v-careers").replaceChildren(

    h("div", {class: "grid g2 ahead"}, A.world.careers_ahead.map(c => h("div", {class: "card"},

}

/* ---------- start ---------- */
$("tabs").replaceChildren(...TABS.map(([id, name]) => h("button", {class: "tab", id: "t-" + id, role: "tab", text: name, onclick: () => show(id)})));
renderOverview(); renderQuests(); renderCast(); renderWeb(); renderConsequences(); renderLore(); renderCareers(); renderEndgame();
show(location.hash.slice(1) || "quests");

if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayoutTrees);
let resizeTimer = 0;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(relayoutTrees, 150); });
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

function renderEndgame() {
  $("v-careers").append(
    h("h2", {style: "margin-top:44px", text: "After the wedding: the end game"}),
    h("p", {class: "lead", text: "The wedding ends the quest line. What follows is open-ended play, not more quests. These four threads are sketched only; each is a feature to be picked and built in its own right."}),
