<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brix Town Quest Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&display=swap">
<style>
/* Layout: a script reader. Sticky tabs; the quest view is a list rail plus one reading column.
   Speech is set in a book face, everything that is apparatus in a grotesque. Brass is kept for ranks and tokens. */
:root{
  --bg:#f2f3f1; --panel:#ffffff; --sunk:#e8eae7; --ink:#1e2225; --soft:#5d656b; --line:#d7dbd8;
  --brass:#8f6212; --brass-bg:#f3e8cf; --link:#3c5f9e;
  --m-neutral:#727a80; --m-happy:#2f7a4c; --m-sad:#3f6aa8; --m-angry:#b3432f; --m-surprised:#a86b0c; --m-thinking:#7551a8;
  --need:#8b3f63; --gain:#2f6f62; --shadow:0 1px 2px rgba(20,25,30,.05),0 6px 18px rgba(20,25,30,.06);
  --display:"Bricolage Grotesque",system-ui,"Segoe UI",Arial,sans-serif;
  --book:"Literata",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171a; --panel:#1c2024; --sunk:#111315; --ink:#e7e9e6; --soft:#98a1a6; --line:#2e3439;
    --brass:#d9a441; --brass-bg:#2c2412; --link:#8fb0ea;
    --m-neutral:#99a2a8; --m-happy:#62b683; --m-sad:#7aa3de; --m-angry:#e28672; --m-surprised:#dba545; --m-thinking:#aa8be0;
    --need:#d58bab; --gain:#74bcae; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171a; --panel:#1c2024; --sunk:#111315; --ink:#e7e9e6; --soft:#98a1a6; --line:#2e3439;
  --brass:#d9a441; --brass-bg:#2c2412; --link:#8fb0ea;
  --m-neutral:#99a2a8; --m-happy:#62b683; --m-sad:#7aa3de; --m-angry:#e28672; --m-surprised:#dba545; --m-thinking:#aa8be0;
  --need:#d58bab; --gain:#74bcae; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
a{color:var(--link)}

header.top{padding-block:26px 6px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--brass)}
h1{font-size:clamp(30px,5vw,46px);line-height:1;margin:6px 0 0;font-weight:750;letter-spacing:-.02em}
.sub{color:var(--soft);max-width:62ch;margin:10px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:12px;color:var(--soft);background:var(--panel);max-width:100%}
.pills .pill{white-space:nowrap}
.pill b{color:var(--ink);font-weight:650}
.pill.flagged{border-color:var(--brass);color:var(--brass);background:var(--brass-bg)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;gap:2px;overflow-x:auto;padding-block:10px 8px;border-bottom:1px solid var(--line);margin-bottom:24px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px;font-weight:600;font-size:14px;color:var(--soft);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--brass)}
section.view{display:none}section.view.on{display:block}

h2{font-size:26px;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:18px;line-height:1.2;margin:30px 0 8px;font-weight:700;text-wrap:balance}
.lead{color:var(--soft);max-width:68ch;margin:0 0 18px}
.prose{max-width:68ch}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
@media(min-width:780px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.small{font-size:12.5px;color:var(--soft)}
.token{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:750;font-size:13px;color:var(--brass);background:var(--brass-bg);border:1.5px solid var(--brass);box-shadow:inset 0 0 0 2px var(--panel)}
.token.sm{width:24px;height:24px;font-size:10.5px;box-shadow:none}
.token.plain{color:var(--soft);border-color:var(--line);background:var(--sunk)}

/* overview arc */
.arc{display:grid;gap:10px}
@media(min-width:900px){.arc{grid-template-columns:repeat(5,1fr)}}
.arc button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.arc button:hover{border-color:var(--brass)}
.arc .rk{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);font-weight:700}
.arc .tt{font-weight:700;font-size:16px;line-height:1.2}
.arc .th{font-family:var(--book);font-style:italic;font-size:13.5px;color:var(--soft)}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:5px 0}
dl.adds{margin:0;display:grid;gap:10px}
dl.adds dt{font-weight:650}dl.adds dd{margin:0;color:var(--soft);font-size:13.5px}

/* quest layout: a strip of quests across the top, so the tree gets the full width */
.qlayout{display:block}
.qrail{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center;margin-bottom:22px;min-width:0}
.qrail .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-right:4px}
.qrail .brk{flex-basis:100%;height:0}
.qb{display:flex;gap:8px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 11px 5px 7px;cursor:pointer}
.qb:hover{border-color:var(--brass)}
.qb.on{border-color:var(--brass);box-shadow:0 0 0 1.5px var(--brass)}
.qb .n{font-weight:650;line-height:1.2;font-size:13.5px}.qb .r{font-size:11.5px;color:var(--soft)}
@media(max-width:700px){.qrail{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.qrail .grp,.qrail .brk{display:none}.qb{flex:0 0 auto}}
.qhead{display:flex;gap:14px;align-items:flex-start}
.qhead h2{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.theme{font-family:var(--book);font-style:italic;font-size:17px;color:var(--soft);margin:12px 0 0;max-width:60ch}
.modebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 6px;padding-block:10px;border-block:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--soft)}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--brass)}
.btn.go{background:var(--brass);border-color:var(--brass);color:var(--panel)}
.spacer{flex:1}

/* stages and the dialogue tree */
.stage{margin:26px 0 0}
.stagehead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stagehead .no{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700}
.stagehead h3{margin:0;font-size:19px}
.goal{font-size:13px;color:var(--soft);margin-top:2px}
.logline{font-size:13px;color:var(--soft);border-left:2px solid var(--brass);padding-left:10px;margin:8px 0}
.logline b{font-weight:650;color:var(--brass);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.scene{font-family:var(--book);font-style:italic;color:var(--soft);font-size:15px;max-width:64ch;margin:10px 0}
.variant{font-size:12px;font-weight:650;color:var(--soft);margin:16px 0 2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tree{margin-top:6px}
.node{margin:8px 0 0}
.line{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--m-neutral);border-radius:6px;padding:9px 13px;max-width:70ch;scroll-margin-top:120px}
.line.flash{box-shadow:0 0 0 3px var(--brass-bg),0 0 0 4px var(--brass)}
.line .who{display:flex;gap:7px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
.ava{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:750;color:#fff}
.who .nm{font-weight:700;font-size:13px}
.mood{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nid{font-family:var(--mono);font-size:10px;color:var(--soft);margin-left:auto;opacity:.7}
.dir{font-family:var(--book);font-style:italic;font-size:13.5px;color:var(--soft);margin:2px 0}
.say{font-family:var(--book);font-size:16.5px;line-height:1.5}
.narr{border-left:3px double var(--line);padding:4px 0 4px 13px;max-width:68ch;font-family:var(--book);font-style:italic;font-size:15.5px;color:var(--soft);scroll-margin-top:120px}
.narr.flash{background:var(--brass-bg)}
.var{font-family:var(--mono);font-style:normal;font-size:.8em;color:var(--brass)}
ul.replies{list-style:none;margin:4px 0 0;padding:0 0 0 14px;border-left:1px dashed var(--line)}
@media(max-width:600px){ul.replies{padding-left:8px}}
ul.replies>li{margin:5px 0 0}
.reply{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:3px 4px;border-radius:5px;cursor:pointer}
.reply:hover{background:var(--sunk)}
.reply .car{flex:0 0 auto;width:12px;color:var(--soft);font-size:11px}
.reply .tx{font-weight:600;min-width:0}
.reply.leaf{cursor:default}.reply.leaf:hover{background:none}
.kids[hidden]{display:none}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--soft);max-width:100%;overflow-wrap:anywhere}
.chip.need{color:var(--need);border-color:var(--need)}
.chip.gain{color:var(--gain);border-color:var(--gain)}
.chip.lose{color:var(--m-angry);border-color:var(--m-angry)}
.chip.end{color:var(--brass);border-color:var(--brass);background:var(--brass-bg)}
.chip.goto{color:var(--link);border-color:var(--link);cursor:pointer;background:none}
.jump{font-size:12.5px;color:var(--link);background:none;border:0;padding:2px 4px;cursor:pointer;text-align:left}
.endgrid{display:grid;gap:12px;margin-top:10px}
@media(min-width:760px){.endgrid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}}
.ending{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:6px;padding:13px 15px;scroll-margin-top:120px}
.ending.flash{box-shadow:0 0 0 3px var(--brass)}
.ending h4{margin:0 0 4px;font-size:16px}
.ending .lg{font-family:var(--book);font-style:italic;color:var(--soft);font-size:14px;margin:0 0 8px}
.ending ul{margin:8px 0 0;padding-left:16px;font-size:13px;color:var(--soft)}
.ending li{margin:4px 0}
.ending .un{font-size:12.5px;margin-top:8px}

/* play mode */
.play{display:grid;gap:18px}
@media(min-width:1040px){.play{grid-template-columns:minmax(0,1fr) 290px;align-items:start}}
.talk{display:flex;flex-direction:column;gap:8px;min-width:0}
.you{align-self:flex-end;max-width:60ch;background:var(--sunk);border-radius:6px;padding:7px 12px;font-weight:600}
.fx{font-size:12px;color:var(--soft);display:flex;flex-wrap:wrap;gap:5px}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.choice{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.choice:hover{border-color:var(--brass)}
.choice[disabled]{opacity:.55;cursor:not-allowed}
.statebox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:13px;display:flex;flex-direction:column;gap:12px}
.statebox h4{margin:0 0 4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.bar{display:grid;grid-template-columns:54px 1fr 34px;gap:6px;align-items:center;font-size:12px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.bar i b{position:absolute;top:0;bottom:0;background:var(--m-happy)}
.bar i b.neg{background:var(--m-angry)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* cast */
.person{display:flex;flex-direction:column;gap:8px;scroll-margin-top:120px}
.person .hd{display:flex;gap:12px;align-items:center}
.person .ava{width:42px;height:42px;font-size:17px}
.person h4{margin:0;font-size:19px}
.person .job{font-size:12.5px;color:var(--soft)}
.tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--soft);vertical-align:2px;margin-left:6px}
.tag.new{color:var(--brass);border-color:var(--brass);background:var(--brass-bg)}
.quote{font-family:var(--book);font-style:italic;font-size:16px;border-left:3px solid var(--brass);padding-left:11px;margin:0}
.person p{margin:0;font-size:13.5px}
.kv{font-size:13px}.kv b{font-weight:650}
.ties{font-size:12.5px;color:var(--soft);display:flex;flex-direction:column;gap:3px}

/* web */
.figure{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow-x:auto}
.figure svg{display:block;min-width:760px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--soft);margin:10px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:24px;border-top:2.5px solid var(--soft)}
svg text{font-family:var(--display)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
.dot.set{background:var(--brass)}
.dot.read{border:2px solid var(--link)}
.dot.both{background:var(--brass);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--link)}
.cellbtn{background:none;border:0;padding:4px;cursor:pointer;border-radius:4px}
.cellbtn:hover{background:var(--sunk)}
.where{margin-top:12px;font-size:13px}
.where li{margin:4px 0}

/* decisions, lore, careers */
.decision{border-top:1px solid var(--line);padding-top:18px;margin-top:22px}
.decision .wh{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);font-weight:700}
.decision h3{margin:2px 0 4px}
.decision .ask{font-family:var(--book);font-style:italic;color:var(--soft);max-width:66ch;margin:0 0 10px}
.opt h4{margin:0;font-size:14.5px}
.opt .now{font-size:13px;margin:3px 0 0}
.opt ul{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--soft)}
.opt li{margin:3px 0}
.lore article{max-width:66ch;margin:0 0 34px}
.lore h3{margin:0 0 6px;font-size:22px}
.lore p{font-family:var(--book);font-size:17px;line-height:1.65;margin:0 0 10px}
.lore .used{font-size:12.5px;color:var(--soft)}
.ahead h4{margin:0;font-size:18px}
.ahead .ln{font-family:var(--book);font-style:italic;color:var(--brass);font-size:15px}
.ahead p{font-size:13.5px;color:var(--soft);margin:8px 0}
/* quest map: stages as boxes, branches as arrows */
.maphead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:20px 0 0}
.maphead h3{margin:0;font-size:15px}
.flowfig{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;margin:8px 0 0}
.flow{position:relative}
.flow svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.fbox{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:1px;text-align:left;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);padding:4px 9px;cursor:pointer;line-height:1.2;overflow:hidden}
.fbox:hover{border-color:var(--brass)}
.fbox .k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbox .t{font-weight:650;font-size:12.5px}
.fbox.end{border-style:dashed;border-radius:20px;background:var(--panel)}
.fbox.end .t{color:var(--brass)}
.fbox.done{border-color:var(--brass);border-style:solid;background:var(--brass-bg)}
.fbox.now{border-color:var(--brass);background:var(--brass-bg);box-shadow:0 0 0 3px var(--brass)}
.fbox.far{opacity:.5}
.fedge{fill:none;stroke:var(--soft);stroke-width:1.5;opacity:.5}
.fedge.taken{stroke:var(--brass);stroke-width:3;opacity:1}
.keyrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12px;color:var(--soft);margin:12px 0 0}
.keyrow span{display:inline-flex;gap:6px;align-items:center}
.key-line{display:inline-block;width:22px;height:14px;border:1px solid var(--line);border-left:3px solid var(--m-thinking);border-radius:3px;background:var(--panel)}
.key-reply{display:inline-block;width:22px;height:14px;border:1px dashed var(--soft);border-radius:8px;background:var(--panel)}

/* the dialogue tree: line boxes, reply boxes, curved branches */
.stagebar{display:flex;gap:8px;align-items:center;margin-top:8px}
.treefig{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:16px;margin-top:10px}
.treefig.grab{cursor:grab}
.treefig.drag{cursor:grabbing;user-select:none}
.canvas{position:relative;transform-origin:0 0}
.canvas>svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tedge{fill:none;stroke:var(--soft);stroke-width:1.5;opacity:.45}
.tedge.lit{stroke:var(--brass);stroke-width:3.5;opacity:1}
.tedge.jump{stroke-dasharray:7 6;stroke-width:2.5}
.treefig.playing{max-height:64vh;overflow:auto}
.tbox{position:absolute}
.tbox .line,.tbox .narr{max-width:none;margin:0}
.tbox .narr{background:var(--panel);border:1px solid var(--line);border-left:3px double var(--soft);border-radius:6px;padding:8px 12px;font-size:14.5px}
.tbox .say{font-size:15px}
.treply{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:1px dashed var(--soft);border-radius:14px;background:var(--panel);padding:6px 11px 7px;font-weight:600;font-size:13.5px;line-height:1.35}
.treply .lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700}
.texit{display:flex;flex-wrap:wrap;gap:4px}
.texit .chip{font-size:11px;padding:3px 8px;background:var(--panel)}
.texit .chip.end{background:var(--brass-bg)}
.tref{width:100%;border:1px dashed var(--link);color:var(--link);border-radius:6px;background:var(--panel);padding:5px 9px;font-size:12px;text-align:left;cursor:pointer;line-height:1.3}
.tentry{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:650;color:var(--soft);border-left:3px solid var(--brass);padding:5px 9px;background:var(--panel);border-radius:4px}
.fold{position:absolute;right:-11px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;border:1px solid var(--soft);background:var(--panel);color:var(--soft);font-size:13px;line-height:1;padding:0;cursor:pointer;z-index:2}
.fold:hover{border-color:var(--brass);color:var(--brass)}
.playing .fold{display:none}
.playing .tbox.dim{opacity:.34}
.tbox.current .line,.tbox.current .narr{box-shadow:0 0 0 3px var(--brass)}
.tbox.visited .line,.tbox.visited .narr{border-color:var(--brass)}
.tbox.taken .treply{border:1.5px solid var(--brass);background:var(--brass-bg)}
.tbox.pickable .treply{border:2px solid var(--brass);cursor:pointer;box-shadow:var(--shadow)}
.tbox.pickable .treply:hover{background:var(--brass-bg)}
.tbox.locked .treply{opacity:.6}
.nowcard{border:1px solid var(--brass);border-radius:8px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nowcard .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);font-weight:700}
details.path{font-size:13px}
details.path summary{cursor:pointer;color:var(--soft);font-weight:600}
details.path .talk{margin-top:8px}
@media (prefers-reduced-motion:no-preference){.line.flash,.narr.flash{transition:box-shadow .2s,background .2s}}

<script>
window.ATLAS = {"cast": {"people": [{"id": "noor", "name": "Noor", "status": "new", "age": 58, "color": "#a8752a", "career": "Master baker, owner of the Stone Oven", "career_id": "baker", "place": "The Stone Oven Bakery, Baker Street, Old Town. Lives in the back rooms. (Proposed new shop: there is no bakery inside the old wall today; the three that exist are out in Northwood, Eastbrook and Southfield.)", "quote": "Flour, water, salt, time. Everything else is vanity.", "voice": "Short sentences. Never two words where one will do. Compliments so dry you notice them an hour later. Counts everything: change, loaves, people. She says very little, until the one night at the crock when she says it all.", "wants": "The bread to outlive her without changing by one grain.", "hides": "Her hands. The order book has been in someone else's writing for weeks.", "story": ["Fourth keeper of the Stone Oven and of the Mother, the sourdough culture her great-grandmother Ilse started the week the town wall came down. Noor took over at twenty-four when her own mother's hands gave out, and has opened at four every morning since, excepting one morning the town still discusses.", "Six years ago her younger brother Tam wanted to put the family name over six counters in six towns. She said the oven doesn't travel. He left for Eastgate Mall on a Tuesday; she opened on time. They have not spoken since, and she has walked past his counter exactly once, on the far side. She tests every new pair of hands the same way: she sends the first basket out one loaf short, and waits to hear what they do about it."], "ties": [["tam", "rift", "brother; six years of silence"], ["pip", "work", "her apprentice"], ["oda", "friend", "her miller for forty years"], ["vera", "friend", "tenant upstairs, oldest customer"], ["mei", "trade", "the Tram Café's standing order"], ["olu", "trade", "shelf bread, and a nine-year bet"]]}, {"id": "tam", "name": "Tam", "status": "new", "age": 49, "color": "#2f7e74", "career": "Owner of Crumb & Co, Eastgate Mall", "career_id": "food_outlet_owner", "place": "A counter in Eastgate Mall, where two outlets are already named Crumb; a flat in the Centre he mostly sleeps in.", "quote": "My sister counts the change twice. I count the customers. One of us is winning. Neither of us is happy.", "voice": "Fast, warm, always selling something, mostly himself. Jokes to keep the talk off the one subject. Goes quiet exactly once per scene, and that line is the true one.", "wants": "To be let back in without having to ask.", "hides": "A jam jar in the back fridge, labelled MUM, fed every day for six years.", "story": ["The younger half of the Stone Oven, once. He wanted the bakery to grow; his sister wanted it to stay true. Both were right, so he left, and took a cutting of the Mother in a jam jar without asking. He has kept it alive ever since in the back of a mall unit that smells of cinnamon spray. The mall's rules forbid him to bake with it.", "Every Saturday he pays a courier, in cash, no name, to bring him one seeded loaf from the Stone Oven. He has not eaten his own bread on a Saturday in six years."], "ties": [["noor", "rift", "sister; the door he can't knock on"], ["abe", "secret", "the Saturday loaf"], ["pip", "secret", "offered them a job at double the wage"]]}, {"id": "pip", "name": "Pip", "status": "new", "age": 19, "color": "#b5536b", "career": "Bakery assistant at the Stone Oven; pastry", "career_id": "bakery_assistant", "place": "A rented room over Tram Street. At the bakery by five. Usually.", "quote": "I wrote a song about crumb structure. There's a key change where the dough knocks back.", "voice": "Talks in first drafts. Blurts the thing everyone else was carefully not saying, then apologises to the room in general. More honest when something is on fire.", "wants": "To be good at one thing and to be told so, once, out loud.", "hides": "Tam's job offer, which they haven't refused. Being wanted is new.", "story": ["Hired for pastry and kept for heart. Hands like a surgeon with laminated dough, and entirely unable to wake up: their alarm is the sound of the barrow on the cobbles. Writes songs at night and busks exactly once a year, at the Town Fair, with their eyes shut.", "Pip watches how the new hand treats them on the first morning more closely than anyone realises. It decides, three quests later, how they meet you at the fountain: still listening, or already leaving."], "ties": [["noor", "work", "apprenticed to; terrified of; devoted to"], ["tam", "secret", "the offer they carry around like a hot tray"]]}, {"id": "oda", "name": "Oda", "status": "new", "age": 61, "color": "#53678f", "career": "Miller of the last stone mill in the valley", "career_id": "miller (proposed)", "place": "The mill house at Mill Fields, west of the old wall, where Mill Street gets its name.", "quote": "A stone talks while it's cutting right. This one's been mumbling for a year now.", "voice": "Slow and exact, with pauses that aren't empty. Talks about machines as if they were livestock and about people as if they were weather.", "wants": "The stones to bite again.", "hides": "That she has known for a year what the mumbling means, and couldn't face the tools.", "story": ["Everything else is rollers and silos out past the ring road. Oda's flour is why the Stone Oven's bread tastes of somewhere, and she and Noor have argued about grind and grist, fondly, for forty years.", "Her husband Marek dressed the stones: recut the furrows that make a millstone bite. He died two years ago. His tools and pattern book went to the museum because she could not have them in the house, and the stones have been going dull ever since."], "ties": [["noor", "friend", "miller and baker"], ["len", "trade", "only her stones can take his wheat"], ["suvi", "trade", "buys Brook Farm's grain, for now"], ["jai", "quest", "he keeps Marek's tools"]]}, {"id": "suvi", "name": "Suvi", "status": "new", "age": 34, "color": "#4b8a52", "career": "Runs Brook Farm", "career_id": "farmer (proposed)", "place": "Brook Farm, the fields past the east wall line.", "quote": "Heritage doesn't pay the vet. A contract pays the vet.", "voice": "Brisk, numerate, tired of being cast as the villain for doing arithmetic. Softens only when her father isn't watching.", "wants": "One certain number in a year of guesses.", "hides": "She can still name every field the way her father taught her, and it would cost her to stop.", "story": ["Came home when her father's knee went and found the books held together by habit. Valley Provisions, the mall's supplier, has offered one flat price for the whole harvest, every year. It is the first certain number she has seen since she came back.", "The sticking point is four acres of Old Wall Red, her father's wheat. The silo men call it contamination. Her father calls it the farm. Suvi is not wrong, and the quest never pretends she is."], "ties": [["len", "family", "father; the argument at the kitchen table"], ["oda", "trade", "sells grain to the mill"]]}, {"id": "len", "name": "Len", "status": "new", "age": 74, "color": "#6e7a3a", "career": "Grower of Old Wall Red; retired in name only", "career_id": "farmer (proposed)", "place": "Brook Farm. Refuses the good chair.", "quote": "Forty years I've grown wheat on the wall's bones. You can't put that in a silo. It won't go.", "voice": "Biblical cadence. Gets quieter as he gets more certain. Calls the wheat “she”.", "wants": "Somebody young to say the Red is worth it, so he doesn't have to be the only one.", "hides": "He knows the farm needs the contract.", "story": ["He brought the Old Wall Red back from one forgotten sack of an old wheat, and sowed it on the rubble line where the east wall stood, in soil full of mortar that drains like nothing else in the valley. The grain is hard and old-fashioned and awkward in a roller mill, and it makes bread you remember three days after eating it."], "ties": [["suvi", "family", "daughter; proud of her, fighting her"], ["oda", "trade", "his miller"]]}, {"id": "vera", "name": "Vera", "status": "new", "age": 66, "color": "#8a4f86", "career": "Retired school cook; judge of the Town Fair", "career_id": "school_cook (retired)", "place": "The flat above the Stone Oven. Her armchair faces the flue, because the warmth comes up.", "quote": "I've eaten this town's bread for sixty years. I know what it was before it was clever.", "voice": "Tart, theatrical, precise. Hands down verdicts like a judge who has seen everything and acquitted almost nothing.", "wants": "To taste the Town Oven's bread once more before she forgets it.", "hides": "She feeds half the street's cats, and she is afraid her tasting memory is going.", "story": ["Cooked for the school for thirty-nine years, so half the town grew up on her dinners and still stands straighter when she looks at them. At eight years old she queued at the Town Oven by the fountain with the family's brass token in her mitten, the winter before it closed. She is the last person who can say from memory what that bread was like.", "Her verdict at the fair is short, and the town quotes it until the next one."], "ties": [["noor", "friend", "her landlady, more or less"], ["jai", "friend", "argues with him about what belongs in a drawer"], ["eli", "work", "he provides the stage; she commands it"]]}, {"id": "mei", "name": "Mei", "status": "live", "resident": "r0504", "age": 27, "color": "#c0543c", "career": "Café hand at the Tram Café", "career_id": "cafe", "place": "The Tram Café, Market Square.", "quote": "Only when the tram's in! You'll get used to it.", "voice": "Already in the game: the player's first friend. Warm, quick, tells everyone everything, which makes her the town's switchboard.", "wants": "To ride the tram to the end of the line, once, with somebody who asks where she would like to go.", "hides": "Everybody tells Mei things. Nobody asks her anything. And old Bram has offered her the café's lease, and she has told nobody.", "story": ["Your neighbour from New in town. The Tram Café takes the Stone Oven's biggest standing order, so she and Noor trade in nods going back years. If you gave her the bread, she vouches for you at the bakery door, and later she is one of the two buyers who can save the Old Wall Red.", "Added for the courting line: Mei has sold coffee to the whole tram line for five years and never ridden it past Market Square. She grew up in a flat with three cousins and a wall thin enough to hear the timetable through, and watched her mother marry on love and a Tuesday wage. She can be courted once you are on the morning round and her regard reaches 25. What wins her is being asked a question and listened to."], "ties": [["noor", "trade", "twelve loaves before the first tram"]]}, {"id": "abe", "name": "Abe", "status": "live", "resident": "r0518", "color": "#c07f1f", "career": "Courier", "career_id": "courier", "place": "Everywhere. Ask him, he'll tell you.", "quote": "Three rounds and one pair of legs.", "voice": "Already in the game: gave you your first round. Cheerful, and discreet to a fault, which is the plot point.", "story": ["Has carried one seeded loaf from the Stone Oven to Eastgate Mall every Saturday for six years, paid in cash by a man he is too professional to name. It is the only delivery he has never been late for. If you have worked his rounds since Errand runner, you can work out for yourself where that loaf goes."], "ties": [["tam", "secret", "the Saturday loaf"], ["noor", "trade", "her deliveries; she doesn't ask"]]}, {"id": "jai", "name": "Jai", "status": "live", "resident": "r1714", "color": "#5560a8", "career": "Keeper at the Old Town Museum", "career_id": "curator", "place": "Old Town Museum, by Market Square.", "quote": "Worth more than this building's roof. Please, it's ours.", "voice": "Already in the game: the rare book. Earnest and rule-bound; melts for anyone who cares about an object's story. Paperwork is how he loves things.", "story": ["Keeps the brass bread tokens, a bakery crock given in grief, and a stone-dresser's tools he accepted from a widow because refusing felt cruel. The baker's career keeps asking him to choose between the paperwork and the point of it. If you kept his rare book in Errand runner, he has not forgotten, and the museum doors are heavier for you."], "ties": [["noor", "quest", "holds her mother's crock, OT-112"], ["oda", "quest", "holds Marek's tools"], ["vera", "friend", "his best and worst visitor"]]}, {"id": "olu", "name": "Olu", "status": "live", "resident": "r0408", "color": "#3e7d4f", "career": "Shopkeeper at Market Grocer", "career_id": "shopkeeper", "place": "Market Grocer, behind the square.", "quote": "If you find out, tell me first. I've got a bet on with the baker.", "voice": "Already in the game: the night gardener. Loves news the way other people love money.", "story": ["Shopkeepers in the slice already joke about having a bet on with the baker. This career gives Olu a real one: nine years ago he bet Noor a sweet roll she couldn't go a year without a day off. It has rolled over, unpaid, ever since."], "ties": [["noor", "trade", "six loaves for the shelf"]]}, {"id": "eli", "name": "Eli", "status": "live", "resident": "r0497", "color": "#5c6670", "career": "Clerk and market seller; runs the Town Fair", "career_id": "clerk", "place": "Market Square, most days.", "quote": "Buy cheap, sell dear, and the market crowd does the rest.", "voice": "Already in the game: taught you the stall. Organises things nobody asked him to organise, and does it well.", "story": ["Runs the fair with a clipboard and a rope line, both brought from home. He guards the bake-off's rules mostly so that Vera has something official to overrule."], "ties": [["vera", "work", "judge and clerk of the fair"]]}, {"id": "hari", "name": "Hari", "status": "live", "resident": "r0410", "color": "#5e8c50", "career": "Gardener at the Tram Court garden", "career_id": "gardener", "place": "Tram Court garden; after dark, ask the fountain.", "quote": "The council cut the flower money this year, so... I plant them at night.", "voice": "Already in the game: the night gardener himself. Shy, generous, happiest mid-sentence about soil.", "story": ["Grows rosemary along the garden's south bed. If you kept his secret or helped him plant, he brings a bundle to the fair for your loaf. If you told Olu, he doesn't."], "ties": [["noor", "trade", "rosemary, which he gives to almost nobody else"]]}], "map": {"noor": [450, 320], "tam": [730, 220], "pip": [480, 490], "vera": [290, 170], "oda": [180, 350], "suvi": [90, 520], "len": [260, 540], "mei": [710, 440], "abe": [840, 340], "jai": [560, 90], "olu": [640, 580], "eli": [110, 90], "hari": [350, 600]}, "edge_labels": {"noor|tam": "estranged siblings", "noor|pip": "apprentice", "noor|oda": "miller and baker", "noor|vera": "upstairs tenant", "jai|noor": "her mother's crock", "jai|oda": "Marek's tools", "jai|vera": "the token drawer", "abe|tam": "the Saturday loaf", "pip|tam": "a job offer", "len|suvi": "father and daughter", "eli|vera": "clerk and judge"}}, "world": {"career": {"id": "baker", "title": "The Baker", "workplace": "The Stone Oven Bakery, Baker Street", "pitch": "Five quests, five ranks, one family. You knock on a side door at four in the morning and end up deciding what a hundred-and-twenty-year-old bakery becomes. Every quest asks the same question from a new side: what do you keep, and what do you let change?", "ranks": ["Dough Hand", "Oven Hand", "Journeyman", "Baker", "Master Baker"]}, "lore": [{"title": "The year the wall came down", "text": ["Old Town had a wall once. It kept nothing out but the view. A hundred and twenty years ago the town voted, by a margin people still argue about, to take it down and use the stone for something better.", "The line of it is still there if you know where to look: West Wall, North Wall, East Wall and South Wall streets run where it stood. Every street that used to end at the wall was given a tree to walk towards instead, which is why so many streets carry a tree's name. The stone went into garden walls, the fountain's basin, and one bakery oven."], "used": "Background for everything. Explains the street names already on the map and the taken-down wall in the city data."}, {"title": "The Town Oven and the brass tokens", "text": ["Before every kitchen had its own fire, Old Town had one: the Town Oven, by the fountain in Market Square. You made your dough at home, pressed your household's brass token into the top, and carried it to the square. The baker's peel took forty loaves at a time. The token came back baked into the crust, so nobody went home with the wrong bread.", "The Town Oven closed fifty-eight years ago, the winter gas came to the last streets. The tokens went into a drawer at the museum. Each one has a number, and the museum knows which family held which, with eleven exceptions that Jai considers a personal failing. Number forty-one is lent out for a year to whoever wins the Town Fair."], "used": "The fair prize in Market Day; the Long Table ending brings the Town Oven back. The brass-token quest markers already in the slice can be read as the same tokens."}, {"title": "The Mother", "text": ["A sourdough culture is flour and water that has been kept alive: fed every day, used every day, never finished. The Stone Oven's is called the Mother. Noor's great-grandmother Ilse started her the week the wall came down, in a stoneware crock, and she has been fed at midnight and at five ever since, through two wars' worth of shortages and one flood.", "Every loaf the bakery has ever sold was raised by her. She will not take roller-milled flour and never has. She is fed with wrist-warm water, never from the kettle: cold only slows a culture down, but heat kills it outright. There are two living jars of her in the world. Only one of them is known about."], "used": "The centre of the career. Her fate in Feeding the Mother changes every later quest."}, {"title": "Old Wall Red", "text": ["When the east wall came down, the rubble that couldn't be carted was ploughed in where it lay. The soil along that line is full of mortar and drains like nowhere else in the valley. Old Wall Red is an old wheat, the kind the Town Oven's bread was made from, and it had all but died out. Forty years ago Len of Brook Farm found one forgotten sack of it and sowed it there, mostly out of stubbornness.", "It yields badly, mills awkwardly, and tastes of somewhere. Roller mills can't do much with it; the silo buyers call it contamination. Put through a sharp stone, it makes the bread people from Old Town describe to strangers on trains."], "used": "Stone Ground. Whether the Red survives decides the quality of the fair loaf."}, {"title": "The last stone", "text": ["Mill Street is named for the mills that stood along the stream when the town had six of them. Mill Works makes machine parts now. One stone mill is left, out at Mill Fields, and Oda runs it.", "A millstone cuts with furrows chiselled into its face, and the furrows wear. Recutting them is called dressing the stone, done with a small pick called a mill bill, following a pattern of harps and furrows that every dresser learns from the one before. A dresser signs the stone, near the eye, with a mark of their own. The last dresser in the valley was Oda's husband Marek. His sign was an ear of wheat."], "used": "Stone Ground: the dressing of the stones, and the choice of whose mark goes beside Marek's."}, {"title": "Baker Street, four in the morning", "text": ["Baker Street had four bakeries once and is down to one. The Stone Oven's oven was built from wall stone the year the wall came down, which is where the name comes from, and it has not gone cold on a working day since.", "The shop opens at seven and is sold out by a little after nine. The side door is in the alley. Bakers use the alley. There are three keys to that door in the world, and a great deal of this career is about who holds them."], "used": "The career's workplace and its daily rhythm."}], "threads": [{"id": "done:new_in_town:gift", "label": "You gave Mei your bread", "what": "The starter quest's kind ending."}, {"id": "done:errand_runner:delivered", "label": "You delivered Abe's parcel", "what": "You know the courier rounds."}, {"id": "done:errand_runner:kept", "label": "You kept the museum's book", "what": "Jai has not forgotten."}, {"id": "done:night_gardener:kept|helped", "label": "You kept faith with Hari", "what": "Kept his secret, or helped him plant."}, {"id": "done:own_stall:*", "label": "You have run a market stall", "what": "You know how a stall works."}, {"id": "mall_loaf", "label": "The mall loaf", "what": "You covered a short count with bread from Crumb & Co."}, {"id": "pip_reported", "label": "You reported Pip", "what": "You called down the stairs about the dropped tray."}, {"id": "noticed_hands", "label": "You noticed the handwriting", "what": "You asked whose writing was in the order book."}, {"id": "crock_taken", "label": "The crock, taken", "what": "You lifted OT-112 out of the museum without asking."}, {"id": "knows_jar", "label": "You know about the jar", "what": "Tam keeps a living cutting of the Mother."}, {"id": "told_of_jar", "label": "Noor refused the jar", "what": "You told her on the morning the Mother died, and she would not hear it."}, {"id": "mother_pure", "label": "The Mother: unbroken", "what": "Saved by crock, rye and vigil alone."}, {"id": "mother_joined", "label": "The Mother: joined", "what": "Tam's six years are folded into her."}, {"id": "mother_lost", "label": "The Mother: lost", "what": "The bakery bakes on bought yeast."}, {"id": "noor_knows", "label": "Noor knows about Tam's cutting", "what": "The truth has been said to her."}, {"id": "tam_secret", "label": "The secret kept", "what": "The cutting went in and nobody told Noor."}, {"id": "stones_dressed", "label": "The stones: dressed true", "what": "Recut from Marek's pattern book."}, {"id": "stones_rough", "label": "The stones: dressed rough", "what": "Recut from memory, without the book."}, {"id": "red_saved", "label": "The Red: saved", "what": "Struck out of the contract; two buyers."}, {"id": "red_split", "label": "The Red: halved", "what": "Two acres to the mill, two to the silo."}, {"id": "oven_shared", "label": "You shared the oven", "what": "Tam baked his fair loaf in the Stone Oven's fire."}, {"id": "oven_sold", "label": "You hired out the oven", "what": "Twenty brix for forty minutes."}, {"id": "oven_refused", "label": "You kept the door shut", "what": "Everyone brings their own fire."}, {"id": "token_tam", "label": "Tam holds the token", "what": "He won it in your oven and cannot look at it."}, {"id": "tam_offer", "label": "Tam's job offer", "what": "Head baker at Crumb & Co."}, {"id": "tam_waiting", "label": "Tam is in the alley", "what": "Waiting to be let in."}, {"id": "jar_home", "label": "The jar comes home", "what": "Tam brings the Mother back to Baker Street."}, {"id": "pip_stays", "label": "Pip stays at the Oven", "what": "Pip told Tam no, at the fair."}, {"id": "end_long_table", "label": "The Long Table", "what": "The career ended with the Town Oven lit again."}, {"id": "courting_mei", "label": "You are courting Mei", "what": "Lunch went well."}, {"id": "promised_line", "label": "You promised Mei the end of the line", "what": "A tram ride to wherever it stops."}, {"id": "mei_steady", "label": "Walking out with Mei", "what": "The dinner went well enough."}, {"id": "engaged", "label": "Engaged", "what": "Mei said yes, once you had a home and savings."}, {"id": "met_tam_early", "label": "Tam sold you the mall loaf", "what": "He remembers the face."}, {"id": "book_returned", "label": "You returned the museum's book", "what": "The only way back into Jai's good books."}, {"id": "broke_promise", "label": "You broke your promise to Tam", "what": "You told Noor about the cutting after promising silence."}, {"id": "pip_leaves", "label": "Pip leaves for Tam's counter", "what": "Decided by the fountain at the fair."}, {"id": "end_crumb", "label": "You went to Crumb & Co", "what": "The career ended at the mall."}, {"id": "end_own_name", "label": "You left under your own name", "what": "The career ended with your own stall."}, {"id": "lunch_ends", "label": "You found out Mei likes the ends", "what": "You asked the café's cook."}, {"id": "mei_takes_cafe", "label": "Mei is taking the café", "what": "She said so to a person, on the tram."}, {"id": "scalded", "label": "You used the kettle", "what": "Hot water at the four o'clock feed."}, {"id": "end_homecoming", "label": "Homecoming", "what": "The career ended with the Mother brought home."}, {"id": "married", "label": "Married", "what": "The end of the quest line and the start of the end game."}], "courting": {"pitch": "One person in the Baker's story can be courted: Mei, from the morning round. The line is three quests and then a wedding, and each step is gated the same way: her regard for you has to reach a level before the next step can even be asked.", "rules": [{"what": "Regard opens each step", "why": "Lunch at 25, dinner at 45, the question at 75. A lunch that goes well reaches 45. A dinner that goes very well can reach 75 at once; one that goes only middling leaves a gap to make up with shifts at the café. From quests alone, only the kindest start reaches 25: the bread given to Mei, and your own breakfast loaf on the first round."}, {"what": "A bad date closes nothing", "why": "A lunch or a dinner that goes badly can be asked for again once her regard has recovered."}, {"what": "A home and savings before she says yes", "why": "She will say what she wants and send you away to get it: a home you own (a mortgage counts, renting does not) and 150 Bx put by. Arrive already holding both and she says yes on the spot."}, {"what": "The wedding ends the line", "why": "A market-day event on the square. Noor bakes the loaf, because a baker does not bake their own. Who stands up with you and who is in the crowd come from how you lived the career. It ends with one choice that picks the first end-game thread."}]}, "endgame": [{"title": "Household", "text": "Your wife moves into the home you bought and keeps her own routine from there, out to the café before the first tram. A shared account at Linden Bank. She moves out of the flat she shares at Lantern Court."}, {"title": "Family", "text": "Children join the household over the years, each a new resident with a routine of their own: the school gate, the playground, the tram. More people in a house means a bigger house."}, {"title": "Fortune", "text": "The getting-richer thread. Buy the empty shop between the café and the oven and run all three. Then property: buy to let, the mall units, the row on Baker Street. Each step is a bank loan, a risk and a rival bidder."}, {"title": "Legacy", "text": "Take an apprentice and send out their first basket one loaf short. Decide, years on, whose name goes on the door after yours."}], "decisions": [{"quest": "four_oclock_door", "title": "The dropped tray", "where": "Quest I · First morning", "ask": "Pip drops a night's work ninety seconds before Noor comes back. Pip has known you for about a minute.", "options": [{"pick": "Cover for Pip", "now": "Pip is grateful, and says so. Noor says only “Hm”.", "later": ["Noor counted the trays. Raise it at the verdict and she tells you that today was your one blind eye.", "Pip pays the debt in Quest II by telling you about the jar marked MUM."]}, {"pick": "Tell her together", "now": "An hour of pastry owed, and “You said we. Noted.”", "later": ["The best standing with both Noor and Pip.", "Pip confides in you in Quest II, and listens to you at the fair."]}, {"pick": "Call down the stairs", "now": "“Thank you for the report.” Pip goes quiet.", "later": ["In Quest II Pip tells you about the jar only if you ask, and with an edge.", "At the fair Pip has already decided to leave for Tam's counter. Only a real apology changes that."]}]}, {"quest": "four_oclock_door", "title": "Seventeen loaves", "where": "Quest I · Seventeen", "ask": "Eighteen owed, seventeen in the barrow, nobody watching. Noor shorted the basket herself to see what you would do.", "options": [{"pick": "Put your own breakfast in", "now": "The café gets its dozen. You go hungry until the verdict.", "later": ["Hired clean. Mei tells the story for a week.", "Mei's regard helps her become the Red's second buyer in Quest III."]}, {"pick": "Go back and check the count", "now": "Eleven minutes late, and Mei lets you know it.", "later": ["Hired clean: “A count you check is yours.”"]}, {"pick": "Short one of them, and say so", "now": "An apology at one counter or the other.", "later": ["Hired clean, a little cooler. There was no right one to short; she wanted to hear whether you would tell her which."]}, {"pick": "Buy a mall loaf and say nothing", "now": "Four brix. Olu turns one loaf over and decides to say nothing, to you.", "later": ["Olu takes the loaf straight to Noor. Hired on watch at best; shrug it off and the door shuts.", "The man who sold it was Tam. He recognises you in Quest II.", "Olu may whisper it to Vera at the judging table in Quest IV."]}]}, {"quest": "feeding_the_mother", "title": "Object OT-112", "where": "Quest II · the museum", "ask": "The crock that could save the Mother is a museum object. Jai offers a form and a loan. There is a third way.", "options": [{"pick": "The form, signed by Noor", "now": "Noor has to face her own signature from the week her mother died.", "later": ["Standing with both Noor and Jai. The proper way, and the one that costs Noor something."]}, {"pick": "A loan for “demonstration of original function”", "now": "Jai wraps the crock like a christening.", "later": ["Jai is an ally from here on. Not offered if you kept his rare book."]}, {"pick": "Take it at closing", "now": "Nobody catches you. That is the worst part.", "later": ["Quest III opens with an empty case and Jai asking who he would report.", "Own up and he forgives you (if you also kept his book, he wants that back first). Deny it and Marek's pattern book stays in its drawer: the stones are dressed rough, and the fair loaf can never be great."]}, {"pick": "Do without the crock", "now": "A glass jar in two blankets and a cardigan.", "later": ["The vigil cannot save her on its own. Only Tam's cutting can."]}]}, {"quest": "feeding_the_mother", "title": "Who tells her", "where": "Quest II · the jar marked MUM", "ask": "Tam will give you a cup of the cutting he has kept alive for six years. He lets you choose the price.", "options": [{"pick": "“I will. Tonight. The truth.”", "now": "At two in the morning, Noor sits down.", "later": ["The Saturday loaf goes on the books.", "At the fair you can offer the oven in Noor's name.", "The Long Table becomes possible."]}, {"pick": "“Nobody. It's kinder.”", "now": "You can fold it in at four while she sleeps.", "later": ["If you share the oven at the fair, Tam almost says it in front of her.", "Vera can taste where the Mother has been, and asks whose kitchen, out loud.", "When it comes out, it costs you with Noor."]}, {"pick": "Leave the jar where it is", "now": "Her way: rye and the night.", "later": ["If the vigil holds, the line is unbroken, and Vera asks no questions at the fair.", "If it fails, the Mother is lost, and the jar becomes the only way home in Quest V."]}]}, {"quest": "feeding_the_mother", "title": "The four o'clock feed", "where": "Quest II · the vigil", "ask": "Noor is asleep. The tap takes a while to run warm. The kettle has just boiled.", "options": [{"pick": "Wait for wrist-warm water", "now": "A little before five, a bubble.", "later": ["The Mother lives, if she had the crock or the cutting."]}, {"pick": "Wake Noor", "now": "“Asking is cheaper than guessing.”", "later": ["Same as feeding her right, as long as the crock is there."]}, {"pick": "Use the kettle", "now": "The smell changes. Oda warned you in so many words.", "later": ["With the jar in your pocket you can start her again from Tam's six years, and must tell Noor everything.", "Without it, the Mother is gone, Noor knows whose hand it was, and the career goes on without her."]}]}, {"quest": "stone_ground", "title": "Whose mark", "where": "Quest III · Land and furrow", "ask": "You have recut the stone. A dresser signs the work. Marek's ear of wheat is already there.", "options": [{"pick": "Leave his alone", "now": "“That's the right kind of pride.”", "later": ["Oda's regard."]}, {"pick": "A small mark beside his", "now": "“He'd have liked the cheek.”", "later": ["Your mark is on the last millstone in the valley for as long as it turns."]}, {"pick": "Hand Oda the bill", "now": "A millrind, cut by a steady hand. “Now she's both of ours.”", "later": ["The highest standing with Oda in the career."]}]}, {"quest": "stone_ground", "title": "The kitchen table", "where": "Quest III · Brook Farm", "ask": "Suvi signs the whole harvest away at the end of the week. She is not wrong to. The Red goes with it unless somebody makes it worth four awkward acres.", "options": [{"pick": "Noor's price and a second buyer", "now": "Suvi strikes the Red out of the contract. Len puts the kettle on, which for Len is a speech.", "later": ["Needs Mei's regard, or your own market stall from A stall of your own.", "With dressed stones, the fair loaf is the best bread the Oven can make, so long as the Mother lives and the plait stays at home."]}, {"pick": "Split it", "now": "“Half's a seed crop. You can come back from half.”", "later": ["Enough Red for the fair loaf and for Saturdays."]}, {"pick": "Tell her to sign", "now": "The farm is safe. Len walks the Red that night.", "later": ["The fair loaf has ordinary flour in it and can never be great.", "Suvi offers you an introducer's fee. Take it, and it is yours to confess to Noor or keep quiet about."]}]}, {"quest": "market_day", "title": "Forty minutes", "where": "Quest IV · the fair", "ask": "Tam's van is dead and his loaf is collapsing. The only hot oven in walking distance is his sister's.", "options": [{"pick": "Share the oven", "now": "He carries the tray up Baker Street himself and stops at the step.", "later": ["Great loaf: the token comes home as “the bread with two bakers behind it”.", "Lesser loaf: Tam wins in your fire, cannot bear it, and brings the token to your alley, unless the Mother was lost.", "Either way, this is the door he walks through in Quest V."]}, {"pick": "Hire it out for twenty brix", "now": "“The most Eastgate thing anyone on Baker Street has ever said.”", "later": ["Vera mentions the landlord at the judging table.", "Closes the Long Table. If his loaf wins, he still brings the token to your alley, unless the Mother was lost."]}, {"pick": "Keep the door shut", "now": "“Her words, near enough. Six years ago.”", "later": ["You may still win, to a quiet square.", "In Quest V Tam comes to the alley with a job offer, unless the Mother was lost, when he comes about that."]}]}, {"quest": "name_on_the_door", "title": "What the Oven should be", "where": "Quest V · the last question", "ask": "Noor cannot shape a batch any more. She asks you what the bakery becomes. Only the answers you have earned are on the table.", "options": [{"pick": "The Long Table", "now": "Noor opens the side door herself.", "later": ["Needs: you shared the oven at the fair, Tam is waiting in the alley, and either Noor knows about the cutting or the jar comes home that night.", "The Town Oven burns again on market days."]}, {"pick": "Homecoming", "now": "Tam carries the jar in with both hands.", "later": ["Only when the Mother was lost, and you get Tam to bring the jar home."]}, {"pick": "Both names on the door", "now": "“Same size. Smaller would be false and larger would be cheek.”", "later": ["Needs high standing with Noor."]}, {"pick": "Her name, your hands", "now": "Open unless the jar is coming home. The Oven goes on.", "later": ["“It's lonelier than it looks, the name part.”"]}, {"pick": "Your own name", "now": "A third jar of the Mother, and a stall.", "later": ["Needs A stall of your own, and a living Mother."]}, {"pick": "Tam's counter", "now": "“Somebody in that mall should know what a door is for.”", "later": ["Only if you shut the door at the fair and the Mother still lives. The best wage in the career."]}]}, {"quest": "lunch_mei", "title": "Twenty minutes with Mei", "where": "Courting Mei · the fountain rim", "ask": "Everybody tells Mei things. She has a hundred things to tell you, and twenty minutes.", "options": [{"pick": "Ask her where she would go", "now": "“Nobody asks me that.” She has never ridden the tram past Market Square.", "later": ["Regard +20, which reaches 45 even from the lowest start.", "Promise her the end of the line, and that promise is the next quest."]}, {"pick": "Let her talk", "now": "A good twenty minutes. She learns nothing about what you think of her.", "later": ["Regard +10: courting begins. Whether that reaches 45 for dinner depends on where you started."]}, {"pick": "Talk about your week", "now": "“It was a lovely loaf, truly.”", "later": ["Nothing begins. You can ask again next week."]}]}, {"quest": "question_mei", "title": "Her conditions", "where": "Courting Mei · the question", "ask": "Mei wants a home that is yours and 150 Bx put by before she will say yes. She has lived her whole life behind thin walls, and wants a door nobody else has a key to.", "options": [{"pick": "Go and get them, then ask again", "now": "Two goals appear: own a home, and have 150 Bx across cash and accounts.", "later": ["A mortgage counts; a rented room does not.", "You ask again at the new door, and she says yes."]}, {"pick": "Arrive already holding both", "now": "She skips her own speech. “Who does it in that order?” “A baker. We prove things first.”", "later": ["Yes on the spot."]}, {"pick": "Balk at the conditions", "now": "“I'd rather wait than marry a maybe.”", "later": ["Regard −10. You are still walking out, and can ask again."]}]}, {"quest": "the_wedding", "title": "What do we do first?", "where": "The wedding · two coats in the hall", "ask": "The last choice of the quest line. It picks which end-game thread opens first; the others stay open.", "options": [{"pick": "Fill the house", "now": "“Two. And thick walls. And they'll both be told everything.”", "later": ["End game opens on the family."]}, {"pick": "Get rich", "now": "The empty shop between the café and the oven. “We could have it inside the year.”", "later": ["End game opens on the fortune."]}, {"pick": "Sleep till five", "now": "For once.", "later": ["End game opens with nothing pressed."]}]}], "careers_ahead": [{"title": "The Courier", "line": "Every Door in Town", "lead": "abe", "shares": ["abe", "tam", "vera", "len", "mei"], "premise": "Abe's knees are going and he has forty years of undeliverable post in a drawer at the depot: letters with no street, parcels for people who moved. You inherit the rounds and the drawer. Each dead letter is a small story with two ends, and one of them is addressed to a baker's son who left on a Tuesday."}, {"title": "The Museum Hand", "line": "The Token Drawer", "lead": "jai", "shares": ["jai", "vera", "noor", "oda", "eli"], "premise": "Eleven brass tokens have no family against their number, and Jai cannot sleep. You trace them through attics, wills and one very old grudge. Token number one is missing entirely. Vera knows who had it and has been waiting sixty years for somebody to ask politely."}, {"title": "The Teller", "line": "The Wall Fund", "lead": "eli", "shares": ["eli", "suvi", "noor", "tam", "olu"], "premise": "When the wall came down, the town opened an account at Linden Bank “for the next thing we build together”, and never agreed what that was. A hundred and twenty years of interest later, you are the junior teller who finds it. Everyone in town has an opinion. Several of them have loan applications."}, {"title": "The Gardener", "line": "The Linden on Linden Street", "lead": "hari", "shares": ["hari", "olu", "vera", "len"], "premise": "Every street that ended at the wall was given a tree. The linden is dying, and the council will replace it with a bench. Hari means to save it at night, with his own money, and needs somebody who can keep a secret better than the last time."}, {"title": "The Clinic Nurse", "line": "Small Hours", "lead": "noor", "shares": ["noor", "len", "vera", "pip", "oda"], "premise": "People tell a nurse what they tell nobody else. Noor's hands, Len's knee, Pip's sleeping, Vera's fear that her tasting memory is going. A career about what you do with what you are told, and when keeping a confidence stops being kind."}, {"title": "The Estate Agent", "line": "Keys", "lead": "suvi", "shares": ["suvi", "tam", "vera", "mei"], "premise": "The town's two property companies both want the row on Baker Street. Vera's flat is in it. So is a bakery. You hold the keys to half the town and learn that every one of them is somebody's four o'clock door."}], "exclusive": [["pip_covered", "pip_together", "pip_reported"], ["gave_own_loaf", "counted_first", "shorted_olu", "shorted_mei", "mall_loaf"], ["crock_signed", "crock_loaned", "crock_taken", "no_crock"], ["cutting_truth", "cutting_secret"], ["mother_pure", "mother_joined", "mother_lost"], ["tam_secret", "secret_out"], ["stones_dressed", "stones_rough"], ["deal_saved", "deal_split", "deal_sold"], ["red_saved", "red_split", "red_sold"], ["loaf_wall", "loaf_seeded", "loaf_rosemary", "loaf_plait"], ["oven_shared", "oven_sold", "oven_refused"], ["pip_stays", "pip_leaves"], ["token_won", "token_tam", "token_lost"], ["lunch_plain", "lunch_fancy", "lunch_ends"], ["wed_fountain", "wed_table"], ["best_pip", "best_abe", "best_tam", "best_olu"]], "additions": [{"what": "Flags that carry between quest lines", "why": "Today flags are kept per resident. About thirty flags carry from one quest to a later one; the rest are read inside the quest that sets them."}, {"what": "Reading another quest's ending in a reply or a start", "why": "“done:new_in_town:gift” and the like. Today only a quest's own “needs” list and jobs read endings."}, {"what": "A stage that opens on different lines depending on what happened", "why": "Mei greets you differently if the count is short. One start node per condition, first match wins."}, {"what": "Narration between lines", "why": "A few moments have no speaker: counting the barrow, the four o'clock feed. They are shown as text, not voiced. Stage directions on a spoken line are also text only, for the animators."}, {"what": "Seven residents, four places, about a dozen items", "why": "Noor, Tam, Pip, Oda, Suvi, Len, Vera; the Stone Oven, Crumb & Co's counter in Eastgate Mall, the mill house at Mill Fields, Brook Farm's kitchen; keys, the crock, rye, the jar, the token."}, {"what": "Reputation gates on replies", "why": "Mei's regard of 10 or more makes her a buyer for the Red; Noor's of 40 or more opens the partnership."}, {"what": "Reputation gates on whole quest lines", "why": "The courting quests each need her regard at a level before they are offered (25, 45 and 75). “Regard” on this page is the slice's reputation, −100 to 100."}, {"what": "A goal for owning a home", "why": "The proposal needs a home you own. The property market already knows what you own; the quest format needs a goal and a condition that read it. The money goal exists already."}, {"what": "Courting, marriage and the end game as features", "why": "None of these is in the backlog yet. Romance, a spouse who moves into your home, children and the wealth thread each need a backlog entry and a level picked before anything is built."}, {"what": "The numbers", "why": "Every regard level, the 150 Bx and all rewards are placeholders until balanced against what a player earns. Some amounts are also spoken in lines (“a hundred and fifty brix”, “twenty brix”), and those lines have to change with the numbers."}, {"what": "Taking a quest line again", "why": "Four endings can be taken again (turned away at the bakery, a lunch or dinner that goes badly, a proposal withdrawn). Taken again, the quest starts clean: the flags and items its own replies gave are cleared and the regard they awarded is taken back, so failing on purpose earns nothing. What the ending itself cost stays."}, {"what": "Clearing a flag", "why": "A few facts stop being true: the Mother is no longer lost once the jar comes home; a secret is no longer kept once it is out. The format today can only set flags."}, {"what": "Facts that cannot both be true", "why": "Sixteen groups of flags are exclusive (how the Mother ended, what you did with the oven, which loaf you entered). The checker now fails if two in a group are ever set together."}, {"what": "Several speakers in one talk", "why": "A talk stage is with one resident today. Several scenes here have two or more people speaking in turn: the first morning, the farm kitchen, the fair, the last door, the wedding."}, {"what": "Quest items that cannot be sold", "why": "The crock, the rye, Marek's tools, the fair token and the keys are held for the story. They should be marked as quest items so they cannot go on a stall."}, {"what": "People and places not counted above", "why": "Bram, who owns the Tram Café; the café's cook; Mrs Ellery of the museum committee; the tram depot and the field behind it at the end of the line. Two outlets in Eastgate Mall are already named Crumb, so Tam's counter can be one of them."}, {"what": "No seasons", "why": "Decided by the owner: no quest is tied to a time of year. The fair is the Town Fair, held when the career reaches it, and nothing in the wording names a season or a month."}, {"what": "Each player's own story", "why": "Decided by the owner: every player has their own copy of the career and the courting. Marrying Mei, losing the Mother or winning the fair happens in that player's game only, and other players in the same city do not see it. So all of this (flags, quest progress, regard, who is married, the lines residents say) is kept per player, and a resident such as Mei must be able to differ from one player's view to another's."}, {"what": "Jai works at the museum", "why": "Decided by the owner. The starter quest used to send the parcel to resident r0505, a Jai who is a barista at the Tram Café. The town has another Jai, r1714, who is a guide at the Old Town Museum: the starter quest and this career now both mean him, and nobody's job had to change. He does not share a flat with Mei."}, {"what": "The town is Old Town", "why": "Decided by the owner. The starter quest greeted the player with “Welcome to Linden!” and sent them to the bank “on Linden's north side”; both now say Old Town, in the game and on this page. Linden stays the name of the street and the bank."}, {"what": "A quest line taken before", "why": "Each of the four lines that can be taken again opens on a different line the second time (“You again.”), so the format needs to know that a line has been tried."}, {"what": "Money moved by a reply", "why": "Three replies move money outside an ending: the mall loaf (4 Bx paid), the introducer's fee (30 Bx received) and the oven hire (20 Bx received). Each needs a ledger entry with a named other side: the mall's till, Valley Provisions, Tam's outlet."}, {"what": "Regard with someone who is not in the conversation", "why": "Several replies change regard with a person who is not the one speaking (Pip, when you answer Noor; Hari and Vera at the judging table). Three replies are gated on Tam's or Pip's regard."}, {"what": "More places and things", "why": "The Town Oven on the square, lit on market days after the Long Table ending, and the empty chandler's shop next to the café. The breakfast loaf should be eaten or unsellable. Ninety-one residents are already named Noor; the baker is the one at the Stone Oven."}, {"what": "What the world shows is per player too", "why": "Following the owner's decision that the story is each player's own: the lit Town Oven, the line added to the bakery's sign and who lives where after the wedding are seen only by the player whose story it is."}, {"what": "Two checks in the live validator", "why": "The game's quest checker rejects a line whose replies all carry a condition, and a negated money need. About thirty lines here have a condition on every reply: most are pairs of opposites (if / unless), and a few are covered by facts that cannot both be true, and the proposal uses “has not 150 Bx” and “has no home”. The checker needs to accept a set of conditions that covers every case."}, {"what": "The museum's first edition", "why": "The rare book from Errand runner can be sold today. If it is sold, the only way to mend things with Jai is gone, and one of his lines (“I still have the book”) can be false. It should not be sellable while that thread is open."}, {"what": "Career ranks", "why": "Dough Hand to Master Baker, wages and a share of takings rest on the career requirements (CAR-001 to CAR-005), which are still only proposed in the spec."}]}, "quests": [{"id": "new_in_town", "group": "live", "act": "1", "title": "New in town", "rank": "", "giver": "mei", "needs": [], "hook": "Starts with a new game.", "summary": "Settle in: meet your neighbour, open a bank account, and do her a small favour.", "theme": "", "start": "meet", "stages": [{"id": "meet", "title": "Meet Mei", "kind": "talk", "with": "mei", "goal": "Talk to Mei at the Tram Café", "log": "Your new neighbour Mei works at the Tram Café on Market Square. Go and say hello.", "start": "hello", "nodes": {"hello": {"who": "mei", "mood": "happy", "say": "{greeting}! You must be {player}, from across the courtyard. I'm Mei. Welcome to Old Town!", "options": [{"text": "Thanks! I've only just arrived.", "next": "money"}, {"text": "Hello. Is it always this busy?", "next": "busy"}]}, "busy": {"who": "mei", "mood": "thinking", "say": "Only when the tram's in! You'll get used to it. Have you sorted yourself out yet? Money and all that?", "options": [{"text": "Not yet. Where do I start?", "next": "money"}]}, "money": {"who": "mei", "mood": "neutral", "say": "Open an account at Linden Bank first. Nobody here pays in cash, and the bank gives newcomers a little something to start. Then... could I ask a favour?", "options": [{"text": "Of course. What is it?", "next": "favour"}, {"text": "Depends on the favour.", "next": "favour"}]}, "favour": {"who": "mei", "mood": "thinking", "say": "I'm stuck here until close and there's no bread at home. Could you bring me a loaf from a grocer? Market Grocer is just behind the square.", "options": [{"text": "Bank first, then bread. Leave it to me.", "next": null, "act": ["stage:bank"]}]}}}, {"id": "bank", "title": "Open an account", "kind": "bank", "goal": "Open an account at Linden Bank", "log": "Open an account at Linden Bank, on Old Town's north side. Go inside and press B at the counter.", "then": "stage:bread"}, {"id": "bread", "title": "Buy a loaf", "kind": "have", "goal": "Have a loaf of bread", "log": "Buy a loaf of bread at a grocer. Inside a shop, press B.", "sim": ["give:bread"], "then": "stage:back"}, {"id": "back", "title": "Back to Mei", "kind": "talk", "with": "mei", "goal": "Take the bread to Mei", "log": "Take the bread to Mei.", "start": "back", "nodes": {"back": {"who": "mei", "mood": "happy", "say": "You're back! Did you find a loaf?", "options": [{"text": "Here you are. Call it a welcome present.", "next": "gift", "need": ["have:bread"], "act": ["take:bread"]}, {"text": "Here. That'll be the price on the shelf, please.", "next": "paid", "need": ["have:bread"], "act": ["take:bread"]}, {"text": "About that... I ate it on the way.", "next": "ate"}, {"text": "Not yet. I'll be back.", "next": null}]}, "gift": {"who": "mei", "mood": "happy", "say": "Oh, that's kind! Then the next coffee's on me. And I'll tell everyone at the café about you.", "options": [{"text": "See you around, Mei.", "next": null, "act": ["end:gift"]}]}, "paid": {"who": "mei", "mood": "neutral", "say": "Of course! Here you go. A head for business already, I see.", "options": [{"text": "Thanks, Mei.", "next": null, "act": ["end:paid"]}]}, "ate": {"who": "mei", "mood": "sad", "say": "You ate my bread? Well. At least you're honest. I'll manage.", "options": [{"text": "Sorry, Mei.", "next": null, "act": ["end:ate"]}]}}}], "endings": [{"id": "gift", "title": "A welcome present", "log": "You gave Mei the bread. She won't forget it.", "pay": 1000, "rep": {"mei": 20}, "ripples": ["Baker career: Mei sends you to the Stone Oven herself, and Noor has already heard about the loaf.", "With Mei's regard this high, she can be the second buyer who saves the Old Wall Red."], "unlocks": "Opens Errand runner and The night gardener."}, {"id": "paid", "title": "Paid for the bread", "log": "Mei paid you for the bread.", "pay": 300, "rep": {"mei": 5}, "ripples": ["Baker career: you find the card in the bakery window on your own."], "unlocks": "Opens Errand runner and The night gardener."}, {"id": "ate", "title": "You ate it", "log": "You ate Mei's bread. She'll manage.", "pay": 0, "rep": {"mei": -15}, "ripples": ["Baker career: Mei is a harder door. She will only back the Old Wall Red if you win her round on the morning rounds."], "unlocks": "Opens Errand runner and The night gardener."}]}, {"id": "errand_runner", "group": "live", "act": "2", "title": "Errand runner", "rank": "", "giver": "abe", "needs": ["done:new_in_town:*"], "hook": "Ask Abe the courier: “You look like you're in a hurry too.”", "summary": "Abe the courier has too many parcels and not enough legs.", "theme": "", "start": "offer", "stages": [{"id": "offer", "title": "Abe's offer", "kind": "talk", "with": "abe", "goal": "Talk to Abe", "log": "Abe the courier looks like he could use a hand.", "start": "o1", "nodes": {"o1": {"who": "abe", "mood": "thinking", "say": "Always! Three rounds and one pair of legs. Say... you're new, aren't you? Want to earn a few brix?", "options": [{"text": "What's the job?", "next": "o2"}, {"text": "Not today, thanks.", "next": null}]}, "o2": {"who": "abe", "mood": "neutral", "say": "A parcel's waiting at Market Grocer. It goes to Jai at the Old Town Museum, and only Jai. Bring me word when it's done and I'll pay you.", "options": [{"text": "Deal.", "next": null, "act": ["stage:pickup"]}, {"text": "Maybe later.", "next": null}]}}}, {"id": "pickup", "title": "Collect the parcel", "kind": "go", "goal": "Go to Market Grocer", "log": "Collect Abe's parcel from Market Grocer, by the fountain behind Market Square.", "sim": ["give:parcel"], "then": "stage:deliver"}, {"id": "deliver", "title": "Only Jai", "kind": "talk", "with": "jai", "goal": "Take the parcel to Jai at the Old Town Museum", "log": "Take the parcel to Jai at the Old Town Museum. Only Jai.", "start": "d1", "nodes": {"d1": {"who": "jai", "mood": "surprised", "say": "{greeting}. Is that... a parcel for me? I've been waiting all week.", "options": [{"text": "From Abe. Here you are.", "next": "d2", "need": ["have:parcel"], "act": ["take:parcel"]}, {"text": "It might be. What's in it?", "next": "d3", "need": ["have:parcel"]}, {"text": "Not yet. I'll be back.", "next": null}]}, "d2": {"who": "jai", "mood": "happy", "say": "Wonderful. Tell Abe he's got a fast new runner.", "options": [{"text": "I will.", "next": null, "act": ["stage:report"]}]}, "d3": {"who": "jai", "mood": "thinking", "say": "A first edition, for the museum. Worth more than this building's roof. Please, it's ours.", "options": [{"text": "Of course. Here.", "next": "d2", "act": ["take:parcel"]}, {"text": "I think I'll hold on to it.", "next": "d4"}]}, "d4": {"who": "jai", "mood": "angry", "say": "You... wait! I'm telling Abe!", "options": [{"text": "Tell whoever you like.", "next": null, "act": ["take:parcel", "give:rare_book", "rep:jai:-40", "end:kept"]}]}}}, {"id": "report", "title": "Report to Abe", "kind": "talk", "with": "abe", "goal": "Tell Abe the parcel reached Jai", "log": "Tell Abe the parcel reached Jai.", "start": "r1", "nodes": {"r1": {"who": "abe", "mood": "thinking", "say": "Well? Did Jai get it?", "options": [{"text": "Safe and sound.", "next": "r2"}, {"text": "Yes, and I could do more of these.", "next": "r3"}]}, "r2": {"who": "abe", "mood": "happy", "say": "Good work. Here's your pay. Couriers around town will have rounds for you now, if you want them.", "options": [{"text": "Thanks, Abe.", "next": null, "act": ["end:delivered"]}]}, "r3": {"who": "abe", "mood": "happy", "say": "Ha! Keen. Here's your pay. Ask any courier for a round; I'll put the word out.", "options": [{"text": "I will.", "next": null, "act": ["rep:abe:+5", "end:delivered"]}]}}}], "endings": [{"id": "delivered", "title": "Delivered", "log": "You delivered Abe's parcel. Couriers now offer you rounds.", "pay": 1500, "rep": {"abe": 10, "jai": 10}, "ripples": ["Baker career: you know Abe's rounds well enough to work out who the Saturday loaf goes to, and to say so to Tam's face."], "unlocks": "Opens A stall of your own. Courier rounds."}, {"id": "kept", "title": "You kept the book", "log": "You kept the museum's rare book. Abe and Jai will not forget.", "pay": 0, "rep": {"abe": -40}, "ripples": ["Baker career: Jai meets you at the museum door with “You.” No loans, only forms, until the book comes back.", "Returning the first edition, in Feeding the Mother or in Stone Ground, is the only way to mend it."], "unlocks": "Opens A stall of your own."}]}, {"id": "night_gardener", "group": "live", "act": "3", "title": "The night gardener", "rank": "", "giver": "olu", "needs": ["done:new_in_town:*"], "hook": "Ask Olu at Market Grocer: “Any idea who's planting those flowers?”", "summary": "Someone has been planting flowers round the fountain at night. Olu at Market Grocer wants to know who.", "theme": "", "start": "offer", "stages": [{"id": "offer", "title": "Olu's question", "kind": "talk", "with": "olu", "goal": "Talk to Olu at Market Grocer", "log": "Olu has a mystery and a bet riding on it.", "st
