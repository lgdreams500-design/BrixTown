art": "o1", "nodes": {"o1": {"who": "olu", "mood": "surprised", "say": "None! Every morning there's a new row round the fountain behind the shop. If you're up late, have a look for me?", "options": [{"text": "I'll keep watch tonight.", "next": null, "act": ["stage:watch"]}, {"text": "I sleep at night, sorry.", "next": null}]}}}, {"id": "watch", "title": "Keep watch", "kind": "near", "goal": "Be by the fountain between 21:00 and 05:00", "log": "Look round the fountain behind Market Grocer between 21:00 and 05:00. Press ] to speed the clock.", "sim": ["give:trowel"], "then": "stage:who"}, {"id": "who", "title": "A trowel marked “H.”", "kind": "talk", "with": "hari", "goal": "Ask Hari at the Tram Court garden", "log": "Fresh earth, and a trowel marked “H.” Hari tends the Tram Court garden. Ask him about it.", "start": "w1", "nodes": {"w1": {"who": "hari", "mood": "neutral", "say": "{greeting}. Can I help you?", "options": [{"text": "Is this trowel yours, Hari?", "next": "w2", "need": ["have:trowel"]}, {"text": "Nothing, sorry.", "next": null}]}, "w2": {"who": "hari", "mood": "sad", "say": "Ah. Yes. The council cut the flower money this year, so... I plant them at night, with my own seeds. Don't tell anyone?", "options": [{"text": "Your secret's safe with me.", "next": "w3", "act": ["take:trowel"]}, {"text": "Let me help you plant the next row.", "next": "w4", "act": ["take:trowel"]}, {"text": "Olu asked me to find out. I'll have to tell him.", "next": "w5"}]}, "w3": {"who": "hari", "mood": "happy", "say": "Thank you. Here, take some seeds. Sell them, plant them, whatever you like.", "options": [{"text": "Thanks, Hari.", "next": null, "act": ["end:kept"]}]}, "w4": {"who": "hari", "mood": "happy", "say": "Really? Then come by the garden any day. There's always weeding, and I'll pay you for it.", "options": [{"text": "I'll be there.", "next": null, "act": ["end:helped"]}]}, "w5": {"who": "hari", "mood": "sad", "say": "I see. Well. Do what you must.", "options": [{"text": "Sorry, Hari.", "next": null, "act": ["stage:tell"]}]}}}, {"id": "tell", "title": "Tell Olu", "kind": "talk", "with": "olu", "goal": "Tell Olu who it is", "log": "Tell Olu at Market Grocer who the night gardener is.", "start": "t1", "nodes": {"t1": {"who": "olu", "mood": "surprised", "say": "Well? Did you find out who it is?", "options": [{"text": "It's Hari, from the Tram Court garden.", "next": "t2", "need": ["have:trowel"], "act": ["take:trowel"]}, {"text": "Not yet. I'm still looking.", "next": null}]}, "t2": {"who": "olu", "mood": "happy", "say": "Hari! The quiet one! Here, for your trouble. I owe you a good story.", "options": [{"text": "Glad to help.", "next": null, "act": ["end:told"]}]}}}], "endings": [{"id": "kept", "title": "The secret kept", "log": "You kept Hari's secret. He gave you seeds.", "pay": 500, "rep": {"hari": 25}, "give": ["seeds", "seeds", "seeds"], "ripples": ["Baker career: Hari hands a bundle of rosemary over the garden wall for your fair loaf."], "unlocks": ""}, {"id": "helped", "title": "Planting together", "log": "You offered to help Hari. Gardeners now offer you work.", "pay": 800, "rep": {"hari": 30}, "ripples": ["Baker career: Hari hands a bundle of rosemary over the garden wall for your fair loaf."], "unlocks": "Gardening shifts."}, {"id": "told", "title": "You told Olu", "log": "You told Olu about Hari. Olu paid you for the news.", "pay": 2000, "rep": {"olu": 20, "hari": -25}, "ripples": ["Baker career: no rosemary. Hari gives that to nobody who talks."], "unlocks": ""}]}, {"id": "own_stall", "group": "live", "act": "4", "title": "A stall of your own", "rank": "", "giver": "eli", "needs": ["done:errand_runner:*"], "hook": "Ask Eli: “How does a market stall work here?”", "summary": "Eli at the square's grocer thinks you could sell at the market.", "theme": "", "start": "offer", "stages": [{"id": "offer", "title": "Eli's advice", "kind": "talk", "with": "eli", "goal": "Talk to Eli", "log": "Eli knows how the market works.", "start": "o1", "nodes": {"o1": {"who": "eli", "mood": "thinking", "say": "You rent one by the day, fifteen brix, right here on the square. Buy cheap, sell dear, and the market crowd does the rest.", "options": [{"text": "I'll save up for it.", "next": "o2"}, {"text": "Could I borrow the money?", "next": "o3"}, {"text": "Not for me.", "next": null}]}, "o2": {"who": "eli", "mood": "neutral", "say": "Sensible. Put it by in a savings account at the bank; it grows a little every day. Come and rent a stall once you've the money.", "options": [{"text": "I will.", "next": null, "act": ["stage:funds"]}]}, "o3": {"who": "eli", "mood": "thinking", "say": "Linden Bank lends to anyone with an account. Just mind you pay it back on time; they're not forgiving.", "options": [{"text": "I'll talk to them.", "next": null, "act": ["stage:funds"]}]}}}, {"id": "funds", "title": "Fifteen brix", "kind": "money", "goal": "Have 15 Bx", "log": "Get together 15 Bx for a day's rent: save it, or borrow it at Linden Bank.", "then": "stage:rent"}, {"id": "rent", "title": "Rent a stall", "kind": "stall", "goal": "Rent a stall on Market Square", "log": "Rent a stall on Market Square: stand on the square and press B.", "then": "stage:sell"}, {"id": "sell", "title": "Sell three", "kind": "stall_sold", "goal": "Sell three items from your stall", "log": "Set out items on your stall (B on the square) and sell three of them to the market crowd.", "then": "stage:report"}, {"id": "report", "title": "Tell Eli", "kind": "talk", "with": "eli", "goal": "Tell Eli how it went", "log": "Tell Eli how your first day went.", "start": "r1", "nodes": {"r1": {"who": "eli", "mood": "happy", "say": "There's the new trader! How did it go?", "options": [{"text": "Sold out! Thanks for the tip. Let me buy you lunch.", "next": "r2", "need": ["money:500"]}, {"text": "Not bad. I'm keeping every chip, mind.", "next": "r3"}]}, "r2": {"who": "eli", "mood": "happy", "say": "Ha! I won't say no. Come by any time; for you, the regulars' price.", "options": [{"text": "Deal.", "next": null, "act": ["end:shared"]}]}, "r3": {"who": "eli", "mood": "neutral", "say": "Fair enough. That's how you get rich, I suppose.", "options": [{"text": "See you, Eli.", "next": null, "act": ["end:solo"]}]}}}], "endings": [{"id": "shared", "title": "Lunch for Eli", "log": "You stood Eli lunch. Market Grocer now gives you the regulars' price.", "pay": 0, "charge": 500, "rep": {"eli": 40}, "ripples": ["Baker career: you know how a stall works, so you can offer Suvi a market stall as the Old Wall Red's second buyer, and you can end the career under your own name."], "unlocks": "The stall is yours to rent any day."}, {"id": "solo", "title": "Every chip", "log": "Your first market day is done. The stall is yours to rent any day.", "pay": 1000, "rep": {"eli": 5}, "ripples": ["Baker career: you know how a stall works, so you can offer Suvi a market stall as the Old Wall Red's second buyer, and you can end the career under your own name."], "unlocks": "The stall is yours to rent any day."}]}, {"id": "four_oclock_door", "group": "baker", "act": "I", "title": "The Four O'Clock Door", "rank": "Dough Hand", "giver": "noor", "needs": ["done:new_in_town:*"], "hook": "A card in the Stone Oven's window. If you gave Mei the bread in New in town, she sends you.", "summary": "Noor needs a pair of hands that can wake. The interview is a dawn, a dropped tray, and a basket she has sent out one loaf short on purpose.", "theme": "What do you do when you come up short, and who do you tell?", "start": "card", "stages": [{"id": "card", "title": "The card in the window", "kind": "talk", "with": "noor", "goal": "Talk to Noor at the Stone Oven, Baker Street", "log": "A card in the bakery window: “WANTED: a pair of hands that can wake. Enquire within. Early.”", "scene": "The shelves are already bare, but the whole street still smells of it. Behind the counter a woman is cleaning a scale that is visibly clean.", "start": "n1", "starts": [{"need": ["again:four_oclock_door"], "node": "n_again"}], "nodes": {"n_again": {"who": "noor", "mood": "neutral", "say": "You again. The card's still in the window, I notice. Same morning, same basket, same test. I don't change a test because somebody failed it. Four o'clock. Side door.", "options": [{"text": "Four o'clock.", "next": null, "act": ["stage:dawn"]}, {"text": "I'll think about it.", "next": null}]}, "n1": {"who": "noor", "mood": "neutral", "say": "We're closed. We've been closed since the bread ran out, which was ten past nine. The card says early.", "options": [{"text": "The card says you need a pair of hands.", "next": "n2"}, {"text": "When exactly is early?", "next": "early"}, {"text": "You sell out by nine and you want more help?", "next": "cheek"}, {"text": "Mei at the Tram Café sent me.", "next": "mei", "need": ["done:new_in_town:gift", "!flag:mei_vouched"]}]}, "n2": {"who": "noor", "mood": "thinking", "say": "Everyone has hands. I need ones that show up. The last pair came attached to a nice boy and a phone. The phone showed up more.", "options": [{"text": "What happened to him?", "next": "lastone"}, {"text": "Mine show up.", "next": "early"}]}, "lastone": {"who": "noor", "mood": "neutral", "say": "The mall happened. Shiny counter, nine o'clock start, music in the ceiling. He's happier. His bread isn't.", "options": [{"text": "I'm not here for the music.", "next": "early"}, {"text": "Nine o'clock doesn't sound unreasonable.", "next": "nine"}]}, "nine": {"who": "noor", "mood": "neutral", "say": "No. It sounds comfortable. Bread doesn't rise on comfortable. The mall is four hundred metres that way.", "options": [{"text": "Four o'clock it is, then.", "next": "early"}, {"text": "I'll think about it.", "next": null}]}, "mei": {"who": "noor", "mood": "surprised", "say": "Mei doesn't send me people. She sends me orders and gossip, in that order. She says you gave her your own loaf. That's either foolish or promising.", "options": [{"text": "Both, probably.", "next": "early", "act": ["rep:noor:+5", "flag:mei_vouched"]}, {"text": "It was just bread.", "next": "justbread", "act": ["flag:mei_vouched"]}]}, "justbread": {"who": "noor", "mood": "neutral", "say": "No such thing. That's the first wrong thing you've said. Say the rest after four tomorrow.", "options": [{"text": "Understood.", "next": "early"}]}, "cheek": {"who": "noor", "mood": "surprised", "say": "It's not more I want. It's the same, done right, with two of us standing up. You've a tongue on you. The oven doesn't care about tongues.", "options": [{"text": "What does it care about?", "next": "early"}, {"text": "Noted. When do I start?", "next": "early"}]}, "early": {"who": "noor", "mood": "neutral", "say": "Four. The oven doesn't do lie-ins. Side door, in the alley. Knock like you mean it. If you're awake, you'll do.", "options": [{"text": "I'll be there.", "next": null, "act": ["stage:dawn"]}, {"text": "Four in the morning?", "next": "four"}]}, "four": {"who": "noor", "mood": "thinking", "say": "There's another four? The mall's pastry counter opens at nine, I'm told. Perhaps that's more your hour.", "options": [{"text": "I said I'll be there.", "next": null, "act": ["stage:dawn"]}, {"text": "Honestly? It might be.", "next": null}]}}}, {"id": "dawn", "title": "Knock like you mean it", "kind": "near", "goal": "Be at the bakery's side door between 03:50 and 04:20", "log": "Be at the Stone Oven's side door between 03:50 and 04:20. The front is for customers. Bakers use the alley.", "scene": "The town at four: one lit window on Baker Street, the fountain talking to itself, your own footsteps going ahead of you. The side door opens before you knock twice. “Hm,” says Noor, which you will learn is a compliment.", "then": "stage:morning"}, {"id": "morning", "title": "First morning", "kind": "talk", "with": "noor", "goal": "Work the dawn shift, and deal with what Pip drops", "log": "Coat on the hook, hands under the tap. Knead what you're given. Don't touch the jar on the top shelf.", "start": "f1", "nodes": {"f1": {"who": "noor", "mood": "neutral", "say": "Coat on the hook. Hands under the tap. You knead what I give you, you weigh what you shape, and you don't touch the jar on the top shelf.", "options": [{"text": "What's in the jar?", "next": "crock"}, {"text": "Right.", "next": "teach"}]}, "crock": {"who": "noor", "mood": "neutral", "say": "Tomorrow.", "options": [{"text": "That's it? “Tomorrow”?", "next": "crock2"}, {"text": "Right.", "next": "teach"}]}, "crock2": {"who": "noor", "mood": "thinking", "say": "Everything in this room is flour, water, salt and time. The jar is mostly time. You get the time when you've earned the flour.", "options": [{"text": "Fair enough.", "next": "teach"}]}, "teach": {"who": "noor", "mood": "neutral", "say": "Shoulders, not wrists. The dough can tell when you're lying. Push it away like you mean it. Fold it back like you're sorry. Again.", "options": [{"text": "(Keep kneading.)", "next": "cellar"}]}, "cellar": {"who": "scene", "say": "Ten past five. Noor goes down to the cellar for salt. Ninety seconds later the side door bangs and Pip arrives at a dead run, coat half on, and catches the proving rack with one elbow. A tray of seeded loaves, proved all night, goes face down on the flags.", "options": [{"text": "(Look at the tray. Look at Pip.)", "next": "pip1"}]}, "pip1": {"who": "pip", "mood": "surprised", "say": "No, no, no. The seeded batch. Those took all night. She'll turn me into rusks. You didn't see this. Did you see this?", "options": [{"text": "Reshape them, fast. I'll watch the stairs.", "next": "cover", "act": ["flag:pip_covered"]}, {"text": "We tell her. Now. Both of us, together.", "next": "together", "act": ["flag:pip_together"]}, {"text": "(Call down the stairs.) Noor! Tray down!", "next": "report", "act": ["flag:pip_reported"]}]}, "cover": {"who": "pip", "mood": "thinking", "say": "You'd do that? For me? Right. Watch the stairs. They'll bake flat, but market-day people don't look. They just want the seeds.", "options": [{"text": "Hurry.", "next": "cover2"}]}, "cover2": {"who": "pip", "mood": "sad", "say": "Thanks. I owe you one. I'm already carrying one I owe. They stack, apparently.", "options": [{"text": "What's the one you're carrying?", "next": "cover3"}, {"text": "Shape faster. Talk later.", "next": "hm", "act": ["rep:pip:+10"]}]}, "cover3": {"who": "pip", "mood": "surprised", "say": "Nothing. Nobody. Ask me when something's on fire. I'm more honest when something's on fire.", "options": [{"text": "I'll hold you to that.", "next": "hm", "act": ["rep:pip:+10"]}]}, "hm": {"who": "noor", "mood": "neutral", "dir": "She comes back up with the salt and looks at the seeded trays for one second longer than necessary.", "say": "Hm.", "options": [{"text": "(Keep kneading. Very attentively.)", "next": "barrow"}]}, "together": {"who": "pip", "mood": "surprised", "say": "Together? Nobody says together in a kitchen. It's always one person's fault. That's what kitchens are for.", "options": [{"text": "Not this one. Come on.", "next": "together2"}]}, "together2": {"who": "noor", "mood": "neutral", "dir": "She looks at the tray, then at the two of you standing shoulder to shoulder like a court martial.", "say": "Burns get shown, not hidden. Same with trays. Reshape, prove again, and the pair of you owe me an hour of pastry. {player}. You said “we”. Noted.", "options": [{"text": "Yes, chef.", "next": "barrow", "act": ["rep:noor:+8", "rep:pip:+10"]}]}, "report": {"who": "noor", "mood": "neutral", "dir": "She comes up slowly, looks at the tray, then at Pip for a long moment, then at you.", "say": "Thank you for the report.", "options": [{"text": "It seemed like you should know.", "next": "report2"}]}, "report2": {"who": "pip", "mood": "sad", "say": "No, it's fine. It's fine. Welcome to the Stone Oven. Mind the rack. It bites.", "options": [{"text": "(Help reshape. Say nothing.)", "next": "barrow", "act": ["rep:noor:+3", "rep:pip:-10"]}]}, "barrow": {"who": "noor", "mood": "neutral", "dir": "Half past six. She loads the barrow herself, then tucks a smaller, darker loaf into your coat pocket. One seeded loaf in brown paper stays behind on the rack, with a chalk cross on it and no name.", "say": "Twelve for the Tram Café. Six for Market Grocer. Before the seven o'clock tram. That one's yours. Breakfast. Don't eat it walking.", "options": [{"text": "Yes, chef.", "next": null, "act": ["give:breakfast_loaf", "stage:count"]}]}}}, {"id": "count", "title": "Seventeen", "kind": "moment", "goal": "Push the barrow to Market Square before the seven o'clock tram", "log": "The morning round: twelve to the Tram Café, six to Market Grocer. The barrow pulls left. Everyone's barrow pulls left, Pip says. It's the cobbles.", "start": "c1", "nodes": {"c1": {"who": "scene", "say": "Halfway down Baker Street you count the barrow, because she told you to weigh what you shape, and a count is a kind of weighing. Seventeen. The café's twelve and the grocer's six make eighteen. Nobody is watching. The tram is due in nine minutes.", "options": [{"text": "My breakfast loaf makes eighteen.", "next": null, "need": ["have:breakfast_loaf"], "act": ["take:breakfast_loaf", "flag:gave_own_loaf", "stage:cafe"]}, {"text": "Go back and tell Noor the count is wrong.", "next": "back", "act": ["flag:counted_first"]}, {"text": "The café gets its twelve. The grocer gets five and an apology.", "next": null, "act": ["flag:shorted_olu", "stage:cafe"]}, {"text": "The grocer gets his six. The café gets eleven and an apology.", "next": null, "act": ["flag:shorted_mei", "stage:cafe"]}, {"text": "The mall sells bread. Nobody needs to know.", "next": "mall", "need": ["money:400"], "act": ["charge:400", "flag:mall_loaf"]}]}, "back": {"who": "noor", "mood": "thinking", "dir": "She is waiting at the side door with the eighteenth loaf already in her hand.", "say": "You counted. Good. You are also now eleven minutes behind the tram. Run.", "options": [{"text": "(Run.)", "next": null, "act": ["rep:noor:+5", "stage:cafe"]}]}, "mall": {"who": "scene", "say": "Eastgate Mall, at a run. One counter has its shutters half up. A man with a retail smile sells you a white loaf that is warm, even, and smells of nothing at all. “Emergency?” he says. “We get a lot of emergencies.” You tuck it among the grocer's six.", "options": [{"text": "(Back to the barrow.)", "next": null, "act": ["flag:met_tam_early", "stage:cafe"]}]}}}, {"id": "cafe", "title": "The Tram Café's twelve", "kind": "talk", "with": "mei", "goal": "Deliver to Mei at the Tram Café", "log": "First drop: the Tram Café, Market Square. Mei counts everything twice, fast.", "start": "m_full", "starts": [{"need": ["flag:gave_own_loaf"], "node": "m_gift"}, {"need": ["flag:counted_first"], "node": "m_late"}, {"need": ["flag:shorted_mei"], "node": "m_short"}, {"need": ["flag:mall_loaf"], "node": "m_mall"}], "nodes": {"m_full": {"who": "mei", "mood": "happy", "say": "Twelve, warm, and before the tram! The Oven's found a barrow that can tell the time. How is she? Is she being nice? Don't answer that. She's never nice. She's better than nice.", "options": [{"text": "She's exact.", "next": null, "act": ["stage:grocer"]}, {"text": "Better than nice. That's about it.", "next": null, "act": ["stage:grocer"]}]}, "m_mall": {"who": "mei", "mood": "surprised", "say": "Twelve, warm, and only just. The tram has been in two minutes and they were starting to circle. Where have you been? Don't answer. Go. The grocer's waiting.", "options": [{"text": "(On to Market Grocer.)", "next": null, "act": ["stage:grocer"]}]}, "m_gift": {"who": "mei", "mood": "surprised", "say": "Twelve! Warm! And hang on. One of these is darker. That's a baker's own loaf. That's your breakfast, isn't it?", "options": [{"text": "It makes the dozen.", "next": "m_gift2", "need": ["done:new_in_town:gift"]}, {"text": "It makes the dozen.", "next": "m_gift2b", "need": ["!done:new_in_town:gift"]}, {"text": "A loaf is a loaf, Mei.", "next": "m_gift2", "need": ["done:new_in_town:gift"]}, {"text": "A loaf is a loaf, Mei.", "next": "m_gift2b", "need": ["!done:new_in_town:gift"]}]}, "m_gift2": {"who": "mei", "mood": "happy", "say": "That's twice now. The bread thing. You know that's twice? I'm telling Noor. Loudly. While she pretends not to listen.", "options": [{"text": "She'll pretend beautifully.", "next": null, "act": ["rep:mei:+10", "stage:grocer"]}]}, "m_gift2b": {"who": "mei", "mood": "happy", "say": "You put your own breakfast in my basket. Nobody does that. I'm telling Noor. Loudly. While she pretends not to listen.", "options": [{"text": "She'll pretend beautifully.", "next": null, "act": ["rep:mei:+10", "stage:grocer"]}]}, "m_late": {"who": "mei", "mood": "angry", "say": "Eleven minutes! I have had a tram full of people looking at an empty basket for eleven minutes. Do you know what a tram full of people looks like?", "options": [{"text": "The count was short. I went back for the twelfth.", "next": "m_late2"}]}, "m_late2": {"who": "mei", "mood": "thinking", "say": "You went back. Most would have handed me eleven and a face. Fine. Forgiven. Mostly. Go, the grocer's waiting.", "options": [{"text": "(On to Market Grocer.)", "next": null, "act": ["stage:grocer"]}]}, "m_short": {"who": "mei", "mood": "neutral", "say": "Eleven. The order's twelve.", "options": [{"text": "It's eleven today. My count, my fault. I'm sorry.", "next": "m_short2"}, {"text": "Noor's count, actually.", "next": "m_short3"}]}, "m_short2": {"who": "mei", "mood": "happy", "say": "Honest and short. Like my favourite people. The tram crowd will take what's here and argue with the air about the rest. Go on.", "options": [{"text": "(On to Market Grocer.)", "next": null, "act": ["rep:mei:+3", "stage:grocer"]}]}, "m_short3": {"who": "mei", "mood": "thinking", "say": "Blaming Noor's arithmetic. Brave. Wrong, I expect, but brave. Go on.", "options": [{"text": "(On to Market Grocer.)", "next": null, "act": ["rep:mei:-5", "flag:blamed_noor", "stage:grocer"]}]}}}, {"id": "grocer", "title": "Market Grocer's six", "kind": "talk", "with": "olu", "goal": "Deliver to Olu at Market Grocer", "log": "Second drop: Market Grocer, behind the square. Olu weighs every loaf in his hand, and every piece of news.", "start": "o_full", "starts": [{"need": ["flag:shorted_olu"], "node": "o_short"}, {"need": ["flag:mall_loaf"], "node": "o_mall"}], "nodes": {"o_full": {"who": "olu", "mood": "happy", "say": "Six on the nail, still warm. Tell Noor the bet stands. She'll know.", "options": [{"text": "What bet?", "next": "o_bet"}, {"text": "I'll tell her.", "next": null, "act": ["stage:verdict"]}]}, "o_bet": {"who": "olu", "mood": "happy", "say": "Nine years ago I bet her a sweet roll she couldn't go one year without a day off. Nine years that bet has rolled over. The interest alone is a bakery.", "options": [{"text": "I'll pass it on.", "next": null, "act": ["flag:knows_bet", "stage:verdict"]}]}, "o_short": {"who": "olu", "mood": "angry", "say": "Five. The café gets her twelve and I get five and, what, a story?", "options": [{"text": "Five and an apology. The short count is mine.", "next": "o_short2"}, {"text": "The tram crowd couldn't wait.", "next": "o_short3"}]}, "o_short2": {"who": "olu", "mood": "thinking", "say": "A story with an apology in it. I can sell that. It'll cost you, mind. I'll be telling it for a week.", "options": [{"text": "A week's fair.", "next": null, "act": ["rep:olu:-5", "stage:verdict"]}]}, "o_short3": {"who": "olu", "mood": "angry", "say": "And my shelf can? My shelf has feelings. Tell Noor the bet stands, and tell her I counted.", "options": [{"text": "(Leave him to it.)", "next": null, "act": ["rep:olu:-10", "stage:verdict"]}]}, "o_mall": {"who": "olu", "mood": "happy", "dir": "He lifts the loaves out one at a time. At the fifth he stops, turns it over, and looks at you for exactly as long as it takes to decide to say nothing.", "say": "Six. On time. Tell Noor the bet stands.", "options": [{"text": "(Leave, faster than necessary.)", "next": null, "act": ["stage:verdict"]}]}}}, {"id": "verdict", "title": "The count", "kind": "talk", "with": "noor", "goal": "Report back to Noor", "log": "Back to Baker Street. Noor is at the counter with the order book open.", "start": "v1", "nodes": {"v1": {"who": "noor", "mood": "neutral", "dir": "The order book lies open between you. The recent entries are in a rounder hand than the pages before.", "say": "The round. Tell me.", "options": [{"text": "We were one short. I put my own loaf in.", "next": "v_gift", "need": ["flag:gave_own_loaf"]}, {"text": "I counted, and I came back. You know the rest.", "next": "v_count", "need": ["flag:counted_first"]}, {"text": "One short. I shorted the grocer.", "next": "v_short", "need": ["flag:shorted_olu"]}, {"text": "One short. I shorted the café.", "next": "v_short", "need": ["flag:shorted_mei"]}, {"text": "The count was short. I bought a mall loaf to cover it.", "next": "v_confess", "need": ["flag:mall_loaf"]}, {"text": "Everything delivered. Full count.", "next": "v_lie", "need": ["flag:mall_loaf"]}, {"text": "Whose writing is that in the order book?", "next": "v_book", "need": ["!flag:noticed_hands"]}]}, "v_book": {"who": "noor", "mood": "neutral", "say": "Pip's. Pip keeps the book these days. My pen and I are not speaking. The round.", "options": [{"text": "(Give your report.)", "next": "v1", "act": ["flag:noticed_hands"]}]}, "v_gift": {"who": "noor", "mood": "neutral", "say": "I know. I shorted the basket myself. Eighteen owed, seventeen sent. You could have blamed me, blamed Pip, or bought your way out. You gave away your breakfast.", "options": [{"text": "You shorted it on purpose?", "next": "v_why"}, {"text": "It seemed like the job.", "next": "v_key"}]}, "v_why": {"who": "noor", "mood": "thinking", "say": "I short every first basket. It's the cheapest honest look at a person that money can buy. One loaf.", "options": [{"text": "And what did you see?", "next": "v_key"}]}, "v_count": {"who": "noor", "mood": "neutral", "say": "You did. Eleven minutes late and one count right. A count you check is yours. A count you don't is mine, and I am tired of carrying everybody's.", "options": [{"text": "It won't need carrying again.", "next": "v_key"}]}, "v_short": {"who": "noor", "mood": "thinking", "say": "And you told them so? To their face?", "options": [{"text": "To their face.", "next": "v_short2", "need": ["!flag:blamed_noor"]}, {"text": "To their face. More or less.", "next": "v_short_blame", "need": ["flag:blamed_noor"]}]}, "v_short2": {"who": "noor", "mood": "neutral", "say": "Then here is the lesson, free. There was no right one to short. Olu's shelf is money, Mei's tram is noise, and both of them are mine. I shorted the basket myself. I wanted to hear whether you would tell me which.", "options": [{"text": "Now you've heard.", "next": "v_key", "act": ["rep:noor:-5"]}]}, "v_short_blame": {"who": "noor", "mood": "neutral", "say": "More or less. Mei tells me you said it was my count. It was. You didn't know that when you said it. Side door key. It works until it doesn't.", "options": [{"text": "Understood.", "next": null, "act": ["rep:noor:-5", "end:hired_wary"]}]}, "v_confess": {"who": "noor", "mood": "neutral", "dir": "She reaches under the counter and sets a loaf between you. White. Even. Olu brought it round an hour ago.", "say": "I know. Olu has a good eye and a better mouth. This rose in a steel tray, in a warm cupboard, four hundred metres from my oven. And it wore my basket to do it.", "options": [{"text": "I panicked. It won't happen again.", "next": "v_wary"}, {"text": "Nobody went short. Isn't that the job?", "next": "v_brazen"}]}, "v_lie": {"who": "noor", "mood": "angry", "dir": "She reaches under the counter and sets a loaf between you. White. Even.", "say": "Full count. Then explain this one. Olu brought it round an hour ago. It rose in a steel tray, in a warm cupboard, and it wore my basket.", "options": [{"text": "I'm sorry. I should have told you first.", "next": "v_wary_lie"}, {"text": "The order was filled, wasn't it?", "next": "v_brazen"}]}, "v_wary_lie": {"who": "noor", "mood": "neutral", "say": "Yes. You should. Wrong twice before breakfast: once at the mall, and once to my face. Side door key. It works until it doesn't.", "options": [{"text": "Understood.", "next": null, "act": ["rep:noor:-15", "end:hired_wary"]}]}, "v_wary": {"who": "noor", "mood": "neutral", "say": "No, it won't. Because from now on you'll count. Side door key. It works until it doesn't. Understand me?", "options": [{"text": "Understood.", "next": null, "act": ["rep:noor:-5", "end:hired_wary"]}]}, "v_brazen": {"who": "noor", "mood": "angry", "say": "The job is the bread. Go and fill orders somewhere that can't taste the difference. The mall's hiring. Tell them I sent you. They'll enjoy that.", "options": [{"text": "(There is nothing to say.)", "next": null, "act": ["end:turned_away"]}]}, "v_key": {"who": "noor", "mood": "happy", "dir": "She pushes a dark loaf across the counter, the twin of the one in your pocket this morning, and sets a key beside it as if it were a teaspoon.", "say": "Sit. Eat. Side door. There are three of those keys in the world. Four o'clock tomorrow. Don't be early. Early people are as much trouble as late ones.", "options": [{"text": "About the seeded batch this morning...", "next": "v_pip", "need": ["flag:pip_covered"]}, {"text": "Thank you, Noor.", "next": null, "act": ["end:hired_clean"]}]}, "v_pip": {"who": "noor", "mood": "thinking", "say": "Rose flat. Reshaped in a hurry. Seeds pressed on after. I counted the trays before the cellar and after. You covered for someone you had known a minute. That's a kind heart and a cheap one. Today was your one blind eye. Spend the next one better.", "options": [{"text": "Yes, chef.", "next": null, "act": ["end:hired_clean"]}]}}}], "endings": [{"id": "hired_clean", "title": "Hired, clean", "log": "Noor handed you the side-door key as if it were nothing. There are three in the world.", "pay": 1200, "rep": {"noor": 15}, "give": ["side_door_key"], "flags": [], "ripples": ["You start the career high in Noor's regard. That matters at the very end: both names on the door needs 40.", "If you covered for Pip, it is already priced in. She counted the trays.", "How you treated Pip this morning decides how Pip meets you at the fountain, three quests on: still listening, or already leaving."], "unlocks": "Rank: Dough Hand. Repeatable job: the morning round."}, {"id": "hired_wary", "title": "Hired, on watch", "log": "The key, but not the nod. Noor is counting you now, the way she counts the change.", "pay": 800, "rep": {"noor": 5}, "give": ["side_door_key"], "flags": ["noor_wary"], "ripples": ["You start the career low in Noor's regard. Both names on the door needs 40 at the end, so the difference has to be made up.", "If you bought the mall loaf, the man who sold it was Tam. He remembers a face, and says so in Feeding the Mother.", "If you bought the mall loaf, Olu may whisper it to Vera at the fair's judging table."], "unlocks": "Rank: Dough Hand. Repeatable job: the morning round."}, {"id": "turned_away", "retake": true, "title": "The door stays shut", "log": "“Go and fill orders somewhere that can't taste the difference.” The card stays in the window. You can knock again tomorrow.", "pay": 0, "rep": {"noor": -10}, "flags": [], "ripples": ["The quest line can be taken again from the card. It starts clean: the first attempt's morning is forgotten, except by Noor, whose regard stays ten lower."], "unlocks": "Nothing yet."}]}, {"id": "feeding_the_mother", "group": "baker", "act": "II", "title": "Feeding the Mother", "rank": "Oven Hand", "giver": "noor", "needs": ["done:four_oclock_door:hired_clean|hired_wary"], "hook": "A power cut on Baker Street, and the morning the shutters stay down.", "summary": "A power cut has chilled the Mother, the bakery's 120-year-old sourdough culture, and she has gone still. Saving her takes the old stoneware crock from the museum, rye from the last stone mill, and a night's vigil. There is also a second way: a jam jar in a mall fridge, labelled MUM, that nobody was ever meant to know about.", "theme": "When something old is dying, what are you willing to owe, and to whom?", "start": "still", "stages": [{"id": "still", "title": "The Mother goes quiet", "kind": "talk", "with": "noor", "goal": "Talk to Noor at the Stone Oven", "log": "The power was out on Baker Street until two, and the proofing room's heater with it. Noor has not opened the shutters. That has happened once before, ever.", "scene": "The proofing room's heater is ticking as it warms up again, hours too late. Noor stands over a glass jar like a doctor who already knows. The surface of the culture is flat, grey and silent.", "start": "s1", "nodes": {"s1": {"who": "noor", "mood": "neutral", "say": "She's not bubbling. Fed at midnight, fed at five. Nothing. The heater went off with the power, and she went cold.", "options": [{"text": "“She”?", "next": "she"}, {"text": "What does she need?", "next": "plan"}, {"text": "It's only starter. We could grow a new one in a week.", "next": "only"}]}, "she": {"who": "noor", "mood": "thinking", "say": "The Mother. My great-grandmother started her the week they pulled the wall down. Every loaf this shop has ever sold came off her. You've been eating her since you came.", "options": [{"text": "Then let's wake her. What does she need?", "next": "plan"}]}, "only": {"who": "noor", "mood": "angry", "say": "A new one would make bread. It would not make our bread. You can get a new dog, too.", "options": [{"text": "I'm sorry. Tell me what she needs.", "next": "only2"}]}, "only2": {"who": "noor", "mood": "sad", "say": "No. That was unfair. You weren't to know. Nobody's to know. That is half my trouble this morning.", "options": [{"text": "So tell me.", "next": "plan"}]}, "plan": {"who": "noor", "mood": "thinking", "say": "Warmth that doesn't swing. The old stoneware crock held heat like a grudge; this glass thing holds nothing. Fresh rye, stone-ground. She won't take roller flour, never has. And a night of feeding. The crock is in the museum. The rye is Oda's, at Mill Fields.", "options": [{"text": "Why is your crock in a museum?", "next": "why"}, {"text": "Crock, rye, tonight. On it.", "next": null, "act": ["stage:crock"]}]}, "why": {"who": "noor", "mood": "sad", "say": "Jai has it under glass with a little card. “Bread crock, Stone Oven Bakery.” As if it had finished doing things. Ask him. I don't go in there.", "options": [{"text": "I'll get it back.", "next": null, "act": ["stage:crock"]}]}}}, {"id": "crock", "title": "Object OT-112", "kind": "talk", "with": "jai", "goal": "Get the stoneware crock from the Old Town Museum", "log": "The crock is accession OT-112 at the Old Town Museum. Museums do not lend in a hurry. Jai does not do anything in a hurry.", "start": "j1", "starts": [{"need": ["done:errand_runner:kept", "!flag:book_returned"], "node": "j_thief"}], "nodes": {"j1": {"who": "jai", "mood": "happy", "say": "Come to see the token drawer? I've put it in order of year.", "options": [{"text": "Not today, Jai. I need the bakery crock. OT-112.", "next": "j2"}]}, "j2": {"who": "jai", "mood": "surprised", "say": "The Stone Oven crock? It's accessioned. Releasing an object needs form D-7, signed by the donor. The donor is Noor. I do have the form. I have all the forms.", "options": [{"text": "Give me the form. She'll sign.", "next": null, "act": ["give:form_d7", "stage:sign"]}, {"text": "Couldn't it go out on loan? Museums lend things.", "next": "j_loan"}, {"text": "Jai, the bakery's culture is dying. Tonight.", "next": "j_press"}, {"text": "Forget the crock. Blankets will do.", "next": null, "act": ["flag:no_crock", "stage:rye"]}]}, "j_loan": {"who": "jai", "mood": "thinking", "say": "Loans go to the committee, and the committee is Mrs Ellery's kitchen table on the first Thursday. Unless. An object may return to use for “demonstration of original function”. I should have to see it work. I should very much like to see it work.", "options": [{"text": "Come and watch bread happen, Jai.", "next": "j_loan2"}, {"text": "A signed form is cleaner. Give me the D-7.", "next": null, "act": ["give:form_d7", "stage:sign"]}]}, "j_loan2": {"who": "jai", "mood": "happy", "dir": "He wraps the crock in acid-free paper like a christening.", "say": "OT-112, outgoing, demonstration of original function. I want to hear what a crock sounds like when it isn't an exhibit.", "options": [{"text": "You're a good sort, Jai.", "next": null, "act": ["flag:crock_loaned", "give:old_crock", "rep:jai:+10", "stage:rye"]}]}, "j_press": {"who": "jai", "mood": "sad", "say": "Tonight. Of course it's tonight. It's always tonight with living things. That is why I work with objects. The form is proper. The loan is possible. Please don't choose the third thing you're thinking.", "options": [{"text": "The form. I'll take it to Noor.", "next": null, "act": ["give:form_d7", "stage:sign"]}, {"text": "The loan. Come and watch it work.", "next": "j_loan2"}, {"text": "(At closing, lift the crock into your barrow.)", "next": "j_take"}]}, "j_take": {"who": "scene", "say": "The case is not locked. A museum like this trusts you; that is most of the exhibit. The crock rides home under a flour sack. The little card stays behind, face down, as if it couldn't watch.", "options": [{"text": "(Go. The Mother can't wait.)", "next": null, "act": ["flag:crock_taken", "give:old_crock", "rep:jai:-25", "stage:rye"]}]}, "j_thief": {"who": "jai", "mood": "angry", "say": "You. I have a gap on a shelf where a first edition should be, and now you want to borrow something else?", "options": [{"text": "I brought the book back, Jai.", "next": "j_back", "need": ["have:rare_book"], "act": ["take:rare_book", "flag:book_returned", "rep:jai:+40"]}, {"text": "The bakery's culture is dying. This isn't about me.", "next": "j_thief2"}]}, "j_back": {"who": "jai", "mood": "surprised", "say": "You brought it back. Well. The shelf has been wrong for weeks. I had started walking the long way round it. Thank you. Now. What was it you needed?", "options": [{"text": "The bakery crock. OT-112.", "next": "j2"}]}, "j_thief2": {"who": "jai", "mood": "neutral", "say": "No. It isn't. Which is why you may have the proper form and nothing else. D-7, donor's signature. Rules are for exactly the people I can't trust.", "options": [{"text": "I'll take the form.", "next": null, "act": ["give:form_d7", "stage:sign"]}, {"text": "(At closing, lift the crock into your barrow.)", "next": "j_take"}, {"text": "Forget the crock. Blankets will do.", "next": null, "act": ["flag:no_crock", "stage:rye"]}]}}}, {"id": "sign", "title": "The donor's line", "kind": "talk", "with": "noor", "goal": "Take form D-7 to Noor", "log": "Form D-7 needs the donor's signature. The donor is Noor.", "start": "g1", "nodes": {"g1": {"who": "noor", "mood": "sad", "dir": "She reads the form twice. Her pen stops over the donor line of the old receipt stapled behind it, where her own signature sits, six years younger.", "say": "I signed her away the week my mother died. Grief does strange paperwork. You give away the one thing you're going to need.", "options": [{"text": "Sign it, Noor. The crock's coming home.", "next": "g2"}, {"text": "Take your time.", "next": "g2"}]}, "g2": {"who": "noor", "mood": "neutral", "dir": "She signs. It costs her something you can watch leaving.", "say": "Tell Jai it was looked after there. He'll want to hear that. He labels things so they'll be remembered. It isn't his fault that I wanted to forget.", "options": [{"text": "(Take the signed form back to Jai, tell him so, and carry the crock home.)", "next": null, "act": ["take:form_d7", "flag:crock_signed", "give:old_crock", "rep:noor:+8", "rep:jai:+8", "stage:rye"]}]}}}, {"id": "rye", "title": "The nurse of grains", "kind": "talk", "with": "oda", "goal": "Get stone-ground rye from Oda at Mill Fields", "log": "Out past the west wall line to Mill Fields. The mill house smells of dust and weather. Something in the machinery sounds wrong, even to you.", "start": "o1", "nodes": {"o1": {"who": "oda", "mood": "neutral", "dir": "She listens to the mill over your shoulder the whole time she talks to you.", "say": "Stone Oven barrow, new face. Let me guess. The Mother's taken a chill and Noor wants rye.", "options": [{"text": "How did you know?", "next": "o_how"}, {"text": "That's the size of it. Fresh ground, she said.", "next": "o_grind"}]}, "o_how": {"who": "oda", "mood": "thinking", "say": "Forty years of her. Rye is the nurse of the grains. Wheat's the patient; rye sits up all night. When the Stone Oven sends for rye in a hurry, somebody's poorly.", "options": [{"text": "Then I need the nurse.", "next": "o_grind"}]}, "o_grind": {"who": "oda", "mood": "neutral", "say": "Fresh means now, and now means you turn the small stone with me. Mind your sleeve.", "options": [{"text": "(Turn the stone.)", "next": "o_knock"}]}, "o_knock": {"who": "scene", "say": "The small stone turns. The flour comes off cool and grey and sweet. Twice in the turning, the big mill behind you knocks: a dull, wrong note, like a cough in a singer.", "options": [{"text": "What was that?", "next": "o_dull"}, {"text": "(Say nothing. Hold the sack.)", "next": "o_water"}]}, "o_dull": {"who": "oda", "mood": "sad", "say": "The big stones, going dull. A stone talks while it's cutting right. This one's been mumbling for a year now. They want dressing, and the man who dressed them isn't available.", "options": [{"text": "Who dressed them?", "next": "o_marek"}, {"text": "I'm sorry, Oda.", "next": "o_water"}]}, "o_marek": {"who": "oda", "mood": "sad", "say": "Marek. My husband. Two years gone. His tools went to the museum because I couldn't have them in the house. One patient at a time. Rye first.", "options": [{"text": "Rye first.", "next": "o_water", "act": ["flag:knows_marek"]}]}, "o_water": {"who": "oda", "mood": "neutral", "say": "Here. And tell Noor what she already knows, because tonight she'll be too tired to know it. Wrist-warm water. Never the kettle. Cold only slows a culture down. Hot kills her dead.", "options": [{"text": "Wrist-warm. Never the kettle.", "next": null, "act": ["give:rye_flour", "stage:pip"]}]}}}, {"id": "pip", "title": "Something's on fire", "kind": "talk", "with": "pip", "goal": "Bring the rye back to the Stone Oven", "log": "Back to Baker Street with the rye. Pip is waiting at the side door, which is not like Pip.", "start": "p1", "starts": [{"need": ["flag:pip_reported"], "node": "p_cold"}], "nodes": {"p1": {"who": "pip", "mood": "thinking", "say": "You got the rye? Good. Listen. Something's on fire, so I'm being honest. There's another one. Another Mother.", "options": [{"text": "Another what?", "next": "p2"}]}, "p2": {"who": "pip", "mood": "sad", "say": "Tam. Noor's brother, at the mall. He offered me a job and I went to hear it, don't look at me like that. In his back fridge there's a jam jar. Labelled MUM. He feeds it every day. Like a goldfish.", "options": [{"text": "You went to hear a job offer from Tam?", "next": "p3"}, {"text": "A cutting of the Mother. Alive.", "next": "p4"}]}, "p3": {"who": "pip", "mood": "sad", "say": "Double the wage and a nine o'clock start. I haven't said yes. I haven't said no. That's what I've been carrying about. Now you're carrying it too. Sorry.", "options": [{"text": "One fire at a time. The jar.", "next": "p4"}]}, "p4": {"who": "pip", "mood": "thinking", "say": "If she won't wake, his will. Same culture, six years apart. But if Noor finds out where it came from, I don't know what she does. I honestly don't.", "options": [{"text": "I'm going to Eastgate.", "next": null, "act": ["flag:knows_jar", "stage:jar"]}, {"text": "No. We do this Noor's way.", "next": null, "act": ["flag:knows_jar", "stage:vigil"]}]}, "p_cold": {"who": "pip", "mood": "neutral", "say": "Rye goes on the bench. Noor says the vigil starts at eleven.", "options": [{"text": "Pip. Is there anything else I should know?", "next": "p_cold2"}, {"text": "(Take the rye through.)", "next": null, "act": ["stage:vigil"]}]}, "p_cold2": {"who": "pip", "mood": "thinking", "say": "You'd only report it. Fine. It's bigger than me being cross. Tam, Noor's brother, at the mall, keeps a cutting of the Mother in his fridge. Labelled MUM. Do what you like with that. You usually do.", "options": [{"text": "I'm going to Eastgate.", "next": null, "act": ["flag:knows_jar", "stage:jar"]}, {"text": "We do this Noor's way.", "next": null, "act": ["flag:knows_jar", "stage:vigil"]}]}}}, {"id": "jar", "title": "The jar marked MUM", "kind": "talk", "with": "tam", "optional": true, "goal": "Optional: ask Tam at Crumb & Co, Eastgate Mall", "log": "Crumb & Co, Eastgate Mall. The lighting is warm. The bread is warm. Something about the warmth is the same temperature all the way through.", "start": "t1", "starts": [{"need": ["flag:met_tam_early"], "node": "t_emergency"}], "nodes": {"t1": {"who": "tam", "mood": "happy", "say": "Welcome to Crumb and Co, where the bread is warm and the lighting is warmer! What can I get you?", "options": [{"text": "I'm from the Stone Oven.", "next": "t2"}]}, "t_emergency": {"who": "tam", "mood": "happy", "say": "Hang on, I know you. Emergency white, at the crack of dawn! How was the emergency?", "options": [{"text": "It went into your sister's basket.", "next": "t_emergency2"}]}, "t_emergency2": {"who": "tam", "mood": "surprised", "say": "You put one of my loaves in Noor's basket? That is the funniest thing that has ever happened to me, and I can't tell a soul. She caught you, of course.", "options": [{"text": "Within the hour.", "next": "t2"}]}, "t2": {"who": "tam", "mood": "neutral", "dir": "The patter stops like a dropped tray. He is looking at the flour on your sleeves.", "say": "You're hers. The new one. Did she send you?", "options": [{"text": "No. She doesn't know I'm here.", "next": "t_truth"}, {"text": "Yes. She needs your help.", "next": "t_lie"}, {"text": "The Mother is dying, Tam.", "next": "t_dying"}]}, "t_lie": {"who": "tam", "mood": "thinking", "say": "No, she doesn't. If Noor sent for help, the fountain would hand in its notice. Try again, and leave the sales pitch out. I write three a day.", "options": [{"text": "She doesn't know. The Mother's dying.", "next": "t_dying", "act": ["rep:tam:-5"]}]}, "t_truth": {"who": "tam", "mood": "neutral", "dir": "He flips the counter sign to CLOSED with a flourish that has nothing behind it.", "say": "Course she doesn't. Come through the back. If you're here and she doesn't know, it's bad. And if it's bad, it's the Mother.", "options": [{"text": "She's gone still.", "next": "t_dying"}]}, "t_dying": {"who": "tam", "mood": "sad", "dir": "He takes a jam jar down from the back fridge. MUM, in marker, gone brown at the edges.", "say": "Six years I've kept her alive in there. Fed her before stock-take, every day. I told myself it was insurance. Insurance against exactly this.", "options": [{"text": "Give me a cup of it. Please.", "next": "t_ask"}, {"text": "Why keep it secret for six years?", "next": "t_why"}, {"text": "A courier brings a seeded loaf here every Saturday. That's you.", "next": "t_loaf", "need": ["done:errand_runner:delivered"]}, {"text": "Bring it to her yourself.", "next": "t_self"}]}, "t_why": {"who": "tam", "mood": "thinking", "say": "Because I took it without asking, and every day since has made the first day worse. There's a maths to owing people. My sister invented it. And the funny part: the mall won't let me bake with it. “Non-standard input.” Nobody laughs at that part.", "options": [{"text": "Give me a cup of it. For her.", "next": "t_ask"}, {"text": "Bring it to her yourself.", "next": "t_self"}]}, "t_loaf": {"who": "tam", "mood": "sad", "say": "Abe wouldn't have told you. You worked it out. One seeded loaf, every Saturday, six years. I have never once eaten my own bread on a Saturday. Don't tell her that. Tell her anything else.", "options": [{"text": "Give me a cup of it, Tam.", "next": "t_ask", "act": ["flag:knows_saturday"]}, {"text": "Bring it to her yourself.", "next": "t_self", "act": ["flag:knows_saturday"]}]}, "t_self": {"who": "tam", "mood": "sad", "say": "Walk up Baker Street with a jam jar and six years of silence? She'd close the shutters. No. Worse. She'd be polite. You take it. You've got clean hands.", "options": [{"text": "Then give me a cup.", "next": "t_ask"}]}, "t_ask": {"who": "tam", "mood": "neutral", "dir": "He spoons it into a clean jar like a transfusion.", "say": "One condition, and you pick it. Who tells her where this came from?", "options": [{"text": "I will. Tonight. The truth.", "next": "t_price_truth"}, {"text": "Nobody. She never finds out. It's kinder.", "next": "t_price_secret"}, {"text": "On second thought, keep it. We'll do this her way.", "next": "t_refuse"}]}, "t_price_truth": {"who": "tam", "mood": "surprised", "say": "Huh. I'd budgeted for the other answer. Then tell her it was fed. Every day. Whatever else she thinks of me, it was fed every day.", "options": [{"text": "Every day. She'll hear it.", "next": null, "act": ["give:mother_cutting", "flag:cutting_truth", "rep:tam:+15", "stage:vigil"]}]}, "t_price_secret": {"who": "tam", "mood": "sad", "say": "Kinder. Right. Kind the way the mall is warm. Take it. Saturdays, if anyone asks, you never met me.", "options": [{"text": "(Take the jar.)", "next": null, "act": ["give:mother_cutting", "flag:cutting_secret", "rep:tam:+5", "stage:vigil"]}]}, "t_refuse": {"who": "tam", "mood": "neutral", "say": "Her way. It's always her way. That's not a complaint, it's a description. The jar's here if her way runs out.", "options": [{"text": "(Go back to Baker Street.)", "next": null, "act": ["stage:vigil"]}]}}}, {"id": "vigil", "title": "The vigil", "kind": "talk", "with": "noor", "goal": "Keep the vigil at the Stone Oven from 23:00", "log": "A night of feeding in the oven's falling heat. Noor was always going to sit up. Now there are two of you.", "start": "v0", "starts": [{"need": ["flag:no_crock"], "node": "v0_glass"}], "nodes": {"v0": {"who": "scene", "say": "Eleven at night. The old crock sits in the oven's afterglow, fed with rye and wrist-warm water, stirred with the handle end of a wooden spoon, because that is how she has always been stirred and tonight is not the night for progress.", "options": [{"text": "(Sit down. It's a long time till five.)", "next": "v1"}]}, "v0_glass": {"who": "scene", "say": "Eleven at night. The glass jar sits by the oven door, wrapped in two blankets and Noor's cardigan. It looks like a patient. The glass is already cool to the touch.", "options": [{"text": "(Sit down. It's a long time till five.)", "next": "v1"}]}, "v1": {"who": "noor", "mood": "thinking", "say": "My great-grandmother started her the week the wall came down. Everyone was starting something that week. A shop, a marriage, an argument. A culture was cheaper than a baby, and she has outlasted most of the marriages. Talk to me. It's a long time till five.", "options": [{"text": "Tell me about your mother.", "next": "v_mother"}, {"text": "Tell me about your brother.", "next": "v_tam", "need": ["flag:knows_jar"]}, {"text": "Noor. I have something of hers. From Tam.", "next": "v_reveal", "need": ["have:mother_cutting"]}]}, "v_mother": {"who": "noor", "mood": "sad", "say": "She could tell the weather from the crumb. Rain two days out. Hands like paper at the end, and she'd still catch me adding yeast on a slow morning. Not angry. Disappointed. Which, as you know, is the strong one.", "options": [{"text": "And Tam? Was he here then?", "next": "v_tam", "need": ["flag:knows_jar"]}, {"text": "(Let the quiet be.)", "next": "v_two"}]}, "v_tam": {"who": "noor", "mood": "neutral", "say": "My brother wanted lights. A till that sings. Our name over six counters in six towns. I wanted the oven. We were both right. That's the trouble with bread. It proves slow, and people won't. He left on a Tuesday. I opened on time.", "options": [{"text": "Have you ever walked past his counter?", "next": "v_counter"}, {"text": "Noor. About Tam. I have something.", "next": "v_reveal", "need": ["have:mother_cutting"]}, {"text": "(Let the quiet be.)", "next": "v_two"}]}, "v_counter": {"who": "noor", "mood": "neutral", "say": "Once. From the far side. He was laughing with a customer. Good laugh, my brother. Retail laugh now. It started out real.", "options": [{"text": "Noor. I went to see him today.", "next": "v_reveal", "need": ["have:mother_cutting"]}, {"text": "(Let the quiet be.)", "next": "v_two"}]}, "v_reveal": {"who": "noor", "mood": "surprised", "dir": "You set a clean jam jar on the table, with a cupful of culture in it. She looks at it for a long time without touching it.", "say": "He took a cutting. And he fed it? Six years, in that place?", "options": [{"text": "Every day. He asked me to tell you that. Every day.", "next": "v_told", "need": ["flag:cutting_truth"]}, {"text": "Every day. I promised him I'd say nothing. I'm saying it anyway.", "next": "v_told", "need": ["flag:cutting_secret"], "act": ["flag:broke_promise"]}]}, "v_told": {"who": "noor", "mood": "sad", "dir": "She sits down. Noor, who stands through everything, sits down. Then she opens the jar and smells it.", "say": "Six years I let him be a till with a haircut. And all that time he was feeding her. Same sour. Same stubborn. Then it's still the same bread. Fold it in.", "options": [{"text": "(Fold the cutting into the Mother.)", "next": "v_two", "act": ["take:mother_cutting", "flag:used_cutting", "flag:noor_knows"]}]}, "v_two": {"who": "scene", "say": "Two o'clock, and a feed. Then the long hour. Somewhere after three Noor falls asleep in the chair with her hands folded under her arms, the way people hold something that hurts. Four o'clock. The feed is yours.", "options": [{"text": "(Go to the bench.)", "next": "v_four"}]}, "v_four": {"who": "scene", "say": "Rye on the bench. The tap runs wrist-warm if you wait for it. The kettle has just boiled for Noor's tea, the hour is very late, and hot would surely be quicker.", "options": [{"text": "Wait for the tap. Wrist-warm water, a fist of rye.", "next": "v_right", "need": ["!flag:no_crock"]}, {"text": "Wait for the tap. Wrist-warm water, a fist of rye.", "next": "v_right", "need": ["flag:no_crock", "flag:used_cutting"]}, {"text": "Wait for the tap. Wrist-warm water, a fist of rye.", "next": "v_cold", "need": ["flag:no_crock", "!flag:used_cutting"]}, {"text": "The kettle's just boiled. Hot water will hurry her along.", "next": "v_scald"}, {"text": "Wake Noor.", "next": "v_wake"}, {"text": "Fold in the jar from your pocket. Say nothing.", "next": "v_fold", "need": ["have:mother_cutting"]}]}, "v_right": {"who": "scene", "say": "You stir with the handle end. A little before five a bubble rises through the grey, slow as a word remembered. Then another.", "options": [{"text": "(Wake Noor. Show her.)", "next": null, "act": ["stage:morning"]}]}, "v_wake": {"who": "noor", "mood": "neutral", "say": "You woke me to ask. Good. Asking is cheaper than guessing. Wrist-warm. Handle end. Watch.", "options": [{"text": "(Watch. Learn it.)", "next": "v_right_noor", "need": ["!flag:no_crock"]}, {"text": "(Watch. Learn it.)", "next": "v_right_noor", "need": ["flag:no_crock", "flag:used_cutting"]}, {"text": "(Watch. Learn it.)", "next": "v_cold_noor", "need": ["flag:no_crock", "!flag:used_cutting"]}]}, "v_right_noor": {"who": "scene", "say": "She feeds the culture herself, wrist-warm, handle end, and does not go back to sleep. A little before five a bubble rises through the grey, slow as a word remembered. Then another.", "options": [{"text": "(Watch it with her.)", "next": null, "act": ["stage:morning"]}]}, "v_cold_noor": {"who": "noor", "mood": "sad", "say": "The feed's right, and it isn't enough. The glass gives the heat away as fast as the oven lends it. I should never have let that crock out of the house.", "options": [{"text": "Noor. There's another one. Tam kept a cutting alive, and I have it here.", "next": "v_told_late", "need": ["have:mother_cutting"]}, {"text": "(There is nothing left to try.)", "next": null, "need": ["!have:mother_cutting"], "act": ["flag:mother_dead", "stage:morning"]}]}, "v_told_late": {"who": "noor", "mood": "angry", "say": "He kept a cutting. Six years. And you have sat there with it in your pocket all night while she died in front of me. Give it here. Handle end. Fold it in.", "options": [{"text": "(Fold the cutting into the Mother.)", "next": null, "need": ["!flag:cutting_secret"], "act": ["take:mother_cutting", "flag:used_cutting", "flag:noor_knows", "rep:noor:-5", "stage:morning"]}, {"text": "(Fold the cutting into the Mother.)", "next": null, "need": ["flag:cutting_secret"], "act": ["flag:broke_promise", "take:mother_cutting", "flag:used_cutting", "flag:noor_knows", "rep:noor:-5", "stage:morning"]}]}, "v_cold": {"who": "scene", "say": "The feed is right, and it isn't enough. The glass gives the heat away as fast as the oven lends it. By half past four the surface is as flat and grey as it was at midnight.", "options": [{"text": "The jar in your pocket. Now or never.", "next": "v_fold", "need": ["have:mother_cutting"]}, {"text": "(There is nothing left to try.)", "next": null, "need": ["!have:mother_cutting"], "act": ["flag:mother_dead", "stage:morning"]}]}, "v_fold": {"who": "scene", "say": "You fold the jar's contents in with the handle end of the spoon. Six years of somebody else's kitchen disappear into a hundred and twenty of this one. By five she is rising, and nobody saw.", "options": [{"text": "(Wake Noor. Show her.)", "next": null, "act": ["take:mother_cutting", "flag:used_cutting", "stage:morning"]}]}, "v_scald": {"who": "scene", "say": "The water goes in steaming. For a moment the culture loosens and you think: there. Then the smell changes. Flat, cooked, like a kitchen after the guests have gone. Oda said it. Hot kills her dead.", "options": [{"text": "The jar in your pocket. All of it. Start her again.", "next": "v_restart", "need": ["have:mother_cutting"]}, {"text": "(Wake Noor. Tell her what you did.)", "next": null, "need": ["!have:mother_cutting"], "act": ["flag:scalded", "flag:mother_dead", "stage:morning"]}]}, "v_restart": {"who": "scene", "say": "You pour the ruined culture away with shaking hands and start her again from the jam jar: his six years, her rye, wrist-warm this time. By five she is rising. Every cell of her came through a mall fridge.", "options": [{"text": "(Wake Noor. Tell her all of it.)", "next": null, "act": ["take:mother_cutting", "flag:used_cutting", "flag:scalded", "stage:morning"]}]}}}, {"id": "morning", "title": "What rises", "kind": "talk", "with": "noor", "goal": "Five o'clock at the Stone Oven", "log": "Five o'clock. Whatever happened in the night, the town must not see the Stone Oven dark twice.", "start": "w_pure", "starts": [{"need": ["flag:mother_dead", "flag:scalded"], "node": "w_kettle"}, {"need": ["flag:mother_dead"], "node": "w_lost"}, {"need": ["flag:scalded"], "node": "w_scald"}, {"need": ["flag:used_cutting", "flag:noor_knows"], "node": "w_join"}, {"need": ["flag:used_cutting"], "node": "w_secret"}], "nodes": {"w_pure": {"who": "noor", "mood": "happy", "dir": "She lifts the lid. The Mother is loud this morning, frothing at the shoulder of the crock as if making up for lost time.", "say": "Stubborn. Like her keeper. Here. Proofing room key. There are two of those in the world.", "options": [{"text": "(Take the key.)", "next": null, "need": ["!have:mother_cutting"], "act": ["end:saved_pure"]}, {"text": "(Take the key. Tam's jar goes back to Eastgate, unopened.)", "next": null, "need": ["have:mother_cutting"], "act": ["take:mother_cutting", "end:saved_pure"]}]}, "w_join": {"who": "noor", "mood": "thinking", "say": "Six years apart, and she takes him back in a night. No argument. No sulk. She's a better family than the rest of us. Proofing room key. And {player}. On Saturday the seeded loaf goes to Eastgate with the morning round. On the books. No more cash.", "options": [{"text": "On the books. Yes, chef.", "next": null, "act": ["end:saved_joined_told"]}]}, "w_secret": {"who": "noor", "mood": "happy", "dir": "She tastes the culture off the back of the spoon and holds it on her tongue a moment too long.", "say": "She's risen. She's rounder. As if she's been somewhere. Hm. Sleep does that. Proofing room key.", "options": [{"text": "(Take the key. Say nothing.)", "next": null, "act": ["end:saved_joined_secret"]}, {"text": "Noor. She has been somewhere. Tam kept a cutting.", "next": "w_late"}]}, "w_late": {"who": "noor", "mood": "sad", "say": "And you'd have let me think it was the rye. No. Don't explain. You told me before the shutters went up. That counts. It only just counts.", "options": [{"text": "He fed it every day, Noor. Six years.", "next": null, "need": ["!flag:cutting_secret"], "act": ["flag:noor_knows", "rep:noor:-5", "end:saved_joined_told"]}, {"text": "He fed it every day, Noor. Six years.", "next": null, "need": ["flag:cutting_secret"], "act": ["flag:broke_promise", "flag:noor_knows", "rep:noor:-5", "end:saved_joined_told"]}]}, "w_scald": {"who": "noor", "mood": "sad", "dir": "She smells it before she is fully awake: the flat, cooked smell from the sink.", "say": "You used the kettle.", "options": [{"text": "I did. I killed her. Then I started her again, from a jar Tam has kept for six years.", "next": "w_scald2"}]}, "w_scald2": {"who": "noor", "mood": "neutral", "dir": "A very long silence. On the bench the culture goes on rising between you, not caring.", "say": "My great-grandmother's Mother died at four this morning. And she is alive on that bench because my brother stole a cup of her six years ago. I don't know which of you to be angrier with. Open the shutters. I'll decide after the bread.", "options": [{"text": "(Open the shutters.)", "next": null, "need": ["!flag:cutting_secret"], "act": ["flag:noor_knows", "rep:noor:-10", "end:saved_joined_told"]}, {"text": "(Open the shutters.)", "next": null, "need": ["flag:cutting_secret"], "act": ["flag:broke_promise", "flag:noor_knows", "rep:noor:-10", "end:saved_joined_told"]}]}, "w_kettle": {"who": "noor", "mood": "sad", "dir": "She smells it before she is fully awake: the flat, cooked smell from the sink.", "say": "You used the kettle.", "options": [{"text": "I did. I killed her. I'm sorry, Noor.", "next": "w_kettle2"}]}, "w_kettle2": {"who": "noor", "mood": "neutral", "dir": "She looks at the grey, still surface for a long time. Then she reaches for the tin of baker's yeast.", "say": "A hundred and twenty years, and one kettle. Oda will have told you. Everybody is told. The town eats at seven. We'll give them risen something. Shutters.", "options": [{"text": "(Open the shutters.)", "next": null, "act": ["rep:noor:-15", "end:lost"]}, {"text": "Noor. There's another one. Tam has kept a cutting alive.", "next": "w_lost2", "need": ["flag:knows_jar", "!flag:noor_knows"], "act": ["rep:noor:-15"]}]}, "w_lost": {"who": "noor", "mood": "sad", "dir": "She looks at the still, grey surface. Then she does the worst thing you have seen her do: she nods, practically, and reaches for the tin of baker's yeast.", "say": "The town eats at seven. We'll give them risen something. Shutters.", "options": [{"text": "(Work the saddest good shift of your life.)", "next": null, "act": ["end:lost"]}, {"text": "Noor. There's another one. Tam has kept a cutting alive.", "next": "w_lost2", "need": ["flag:knows_jar", "!flag:noor_knows"]}]}, "w_lost2": {"who": "noor", "mood": "angry", "say": "Don't. Not this morning. I will not go begging my own culture back from a mall. Shutters.", "options": [{"text": "(Open the shutters.)", "next": null, "act": ["flag:told_of_jar", "end:lost"]}]}}}], "endings": [{"id": "saved_pure", "title": "Saved, the old way", "log": "Crock, rye and a night's vigil. The Mother rose on her own history.", "pay": 2000, "rep": {"noor": 20}, "give": ["proofing_room_key"], "flags": ["mother_pure"], "ripples": ["At the fair, Vera knows the Mother in the loaf at once, and has no questions about where she has been.", "Tam's jar stays in its fridge, and the Saturday loaf keeps its secret.", "If you took the crock without asking, Jai has an empty case and a suspicion. Stone Ground begins there."], "unlocks": "Rank: Oven Hand. The proofing-room key. Repeatable job: a bake shift."}, {"id": "saved_joined_told", "title": "Saved, joined, and Noor knows", "log": "Tam's six years are folded into the Mother, and the truth was spoken before the shutters went up.", "pay": 2000, "rep": {"noor": 15, "tam": 20}, "give": ["proofing_room_key"], "flags": ["mother_joined", "noor_knows"], "ripples": ["The Saturday loaf goes on the books. Abe's six-year secret ends as a standing order.", "At the fair, when Tam's oven fails, Noor herself is ready to say “use ours”.", "The Long Table, the reconciliation ending, becomes reachable."], "unlocks": "Rank: Oven Hand. The proofing-room key. Repeatable job: a bake shift."}, {"id": "saved_joined_secret", "title": "Saved, joined, in silence", "log": "Tam's six years are in the Mother and nobody will say so. The secret is yours to carry now.", "pay": 2000, "rep": {"noor": 15, "tam": 5}, "give": ["proofing_room_key"], "flags": ["mother_joined", "tam_secret"], "ripples": ["Vera can taste where the Mother has been. At the judging table she says so, out loud.", "If you promised Tam silence and then share the oven at the fair, he nearly says it himself in Noor's hearing.", "When the secret comes out, it costs you with Noor."], "unlocks": "Rank: Oven Hand. The proofing-room key. Repeatable job: a bake shift."}, {"id": "lost", "title": "The Mother is gone", "log": "Some nights don't end right. The Stone Oven bakes on bought yeast now: good bread, from nowhere.", "pay": 600, "rep": {"noor": 0}, "flags": ["mother_lost"], "ripples": ["The career continues, diminished. At the fair Vera tastes the difference and asks one question.", "Tam's jar is now the only living line. In the last quest it can come home, and that homecoming is the hardest-won ending in the career.", "Olu stops joking about the nine-year bet. Nobody discusses why."], "unlocks": "Rank: Oven Hand, earned the hard way."}]}, {"id": "stone_ground", "group": "baker", "act": "III", "title": "Stone Ground", "rank": "Journeyman", "giver": "noor", "needs": ["done:feeding_the_mother:*"], "hook": "A smell of toast in yesterday's crumb, and a contract on a farmhouse table that gets signed at the end of the week.", "summary": "The flour is failing twice over. Oda's millstones have gone dull, and the only tools that can recut them belonged to her late husband and now sit in a museum drawer. Meanwhile Brook Farm is about to sell its whole harvest, the Old Wall Red included, to the mall's supplier for one flat price. Suvi is not wrong to sign. That is what makes it hard.", "theme": "Heritage against solvency, with no villain at the table.", "start": "toast", "stages": [{"id": "toast", "title": "Toast in the crumb", "kind": "talk", "with": "noor", "goal": "Talk to Noor at the Stone Oven", "log": "Noor wants you at the bench before the shutters go up. She has yesterday's loaf in her hands and a look on her face.", "start": "t1", "starts": [{"need": ["flag:mother_lost"], "node": "t_lost"}], "nodes": {"t1": {"who": "noor", "mood": "neutral", "dir": "She tears yesterday's loaf in half and holds the crumb under your nose.", "say": "Smell that. Under the sour. Toast. The flour is coming off Oda's stones hot. Dull stones rub instead of cut, and rubbing cooks the grain.", "options": [{"text": "Can dull stones be fixed?", "next": "t2"}, {"text": "Could we buy flour somewhere else?", "next": "t_else"}]}, "t_lost": {"who": "noor", "mood": "sad", "dir": "She tears yesterday's loaf in half and holds the crumb under your nose.", "say": "First the Mother. Now the flour. Smell that. Toast, in the crumb. At this rate I'll be selling toast racks before the year's out.", "options": [{"text": "What's wrong with the flour?", "next": "t_lost2"}]}, "t_lost2": {"who": "noor", "mood": "neutral", "say": "Oda's stones are dull. Dull stones rub instead of cut, and rubbing cooks the grain.", "options": [{"text": "Can they be fixed?", "next": "t2"}]}, "t_else": {"who": "noor", "mood": "neutral", "say": "Roller flour, from the silo men. White, even, dead. I would sooner sell toast racks. No. The stones want dressing.", "options": [{"text": "Dressing?", "next": "t2"}]}, "t2": {"who": "noor", "mood": "thinking", "say": "Dressed. Recut. Marek did it every second year. Marek's dead, and his tools and his pattern book are in Jai's museum. And that's the small problem.", "options": [{"text": "What's the large one?", "next": "t3"}]}, "t3": {"who": "noor", "mood": "neutral", "say": "Brook Farm. Len's girl signs the whole harvest to Valley Provisions at the end of the week. The mall's supplier. One flat price, everything into the silo, the Old Wall Red with it. If the Red goes, there is nothing left worth grinding on a stone.", "options": [{"text": "One thing at a time. The tools first.", "next": null, "act": ["stage:book"]}, {"text": "Why does the Red matter so much?", "next": "t_red"}]}, "t_red": {"who": "noor", "mood": "happy", "say": "Because it's the only wheat that tastes of here. Hard grain, grown on the wall's rubble. Rollers hate it. Oda's stones love it. Go and see Jai.", "options": [{"text": "On my way.", "next": null, "act": ["stage:book"]}]}}}, {"id": "book", "title": "OT-240 to OT-252", "kind": "talk", "with": "jai", "goal": "Ask Jai for Marek's tools and pattern book", "log": "The Old Town Museum, again. Marek's stone-dressing kit is in a drawer there: mill bills, a proof staff, and a pattern book.", "scene": "You ask after Marek's tools before you are properly through the door.", "start": "b1", "starts": [{"need": ["flag:crock_taken", "done:errand_runner:kept", "!flag:book_returned"], "node": "b_both"}, {"need": ["flag:crock_taken"], "node": "b_empty"}, {"need": ["done:errand_runner:kept", "!flag:book_returned"], "node": "b_thief"}], "nodes": {"b1": {"who": "jai", "mood": "happy", "say": "Marek's kit! OT-240 through 252. Mill bills, a thrift, a proof staff, and his pattern book. Nobody has asked for them since the day they came in. I dust them at the end of the weeks, in case.", "options": [{"text": "The mill's stones are dull. The tools need to work again.", "next": "b2"}]}, "b2": {"who": "jai", "mood": "thinking", "say": "Demonstration of original function. There is a clause for it. But these came from Oda in a bad week, and I won't send them back to her door unless she says so. The pattern book you may study now. The tools go when she asks for them herself.", "options": [{"text": "I'll ask her.", "next": null, "act": ["flag:book_lent", "stage:oda"]}]}, "b_both": {"who": "jai", "mood": "angry", "dir": "The case that held OT-112 is empty. So is the place on the shelf where the first edition should be.", "say": "The book. And now the crock. I have two gaps on two shelves, and one face that keeps turning up beside them.", "options": [{"text": "I've brought the book back. And it was me who took the crock.", "next": "b_own", "need": ["have:rare_book"], "act": ["take:rare_book", "flag:book_returned", "rep:jai:+40"]}, {"text": "I took the crock. And I still have the book. I'm sorry, Jai.", "next": "b_both2"}, {"text": "I don't know anything about that.", "next": "b_deny"}]}, "b_both2": {"who": "jai", "mood": "neutral", "say": "Sorry mends neither shelf. The form, then. D-7, signed by the donor, who is Oda. When she signs, the drawer opens. Not before. Bring the book back, and we shall talk about the rest.", "options": [{"text": "I'll bring her signature.", "next": null, "act": ["flag:book_lent", "stage:oda"]}]}, "b_empty": {"who": "jai", "mood": "sad", "dir": "The case that held OT-112 is still empty. He has left the little card where it fell.", "say": "I haven't reported it. I keep trying to work out who I would be reporting. And then you walk in, asking for more.", "options": [{"text": "It was me. I took the crock. I'm sorry, Jai.", "next": "b_own"}, {"text": "I don't know anything about that.", "next": "b_deny"}]}, "b_own": {"who": "jai", "mood": "neutral", "say": "I know it was you. I wanted to see whether you did. Tell me one thing. Is it working?", "options": [{"text": "She's alive in it. Come and see her.", "next": "b_mend", "need": ["!flag:mother_lost"]}, {"text": "It wasn't enough. We lost her anyway.", "next": "b_mend_lost", "need": ["flag:mother_lost", "!flag:scalded"]}, {"text": "It was working. Then I killed her, with a kettle.", "next": "b_mend_lost", "need": ["flag:mother_lost", "flag:scalded"]}]}, "b_mend": {"who": "jai", "mood": "happy", "say": "Then it is doing what it was made for, which is more than I ever managed for it. I'll change the card. “On long loan to its own bakery.” Now. What was it you wanted?", "options": [{"text": "Marek's kit.", "next": "b2", "act": ["flag:jai_mended", "rep:jai:+20"]}]}, "b_mend_lost": {"who": "jai", "mood": "sad", "say": "Oh. I am sorry. Keep the crock there. An empty crock in its own bakery is nearer home than a full case here. Now. What was it you wanted?", "options": [{"text": "Marek's kit.", "next": "b2", "act": ["flag:jai_mended", "rep:jai:+15"]}]}, "b_deny": {"who": "jai", "mood": "angry", "say": "No. Of course not. Then I can't help you. The pattern book stays in its drawer. I'm told Oda remembers most of it.", "options": [{"text": "(Leave.)", "next": null, "act": ["flag:no_book", "rep:jai:-15", "stage:oda"]}]}, "b_thief": {"who": "jai", "mood": "neutral", "say": "The form, then. D-7, signed by the donor, who is Oda. You know how it goes by now. When she signs, the drawer opens. Not before.", "options": [{"text": "I've brought the book back, Jai.", "next": "j_back3", "need": ["have:rare_book"], "act": ["take:rare_book", "flag:book_returned", "rep:jai:+40"]}, {"text": "I'll bring her signature.", "next": null, "act": ["flag:book_lent", "stage:oda"]}]}, "j_back3": {"who": "jai", "mood": "surprised", "say": "You brought it back. Well. The shelf has been wrong for a long while. Thank you. Then we can do this properly.", "options": [{"text": "Marek's kit.", "next": "b2"}]}}}, {"id": "oda", "title": "Land and furrow", "kind": "talk", "with": "oda", "goal": "Ask Oda for her blessing, then dress the stones at Mill Fields", "log": "Mill Fields. Somebody has to ask Oda to let another pair of hands use her husband's tools.", "start": "d1", "starts": [{"need": ["flag:no_book"], "node": "d_nobook"}], "nodes": {"d1": {"who": "oda", "mood": "neutral", "say": "You've been to the museum. I can see it on you. People come out of there walking carefully.", "options": [{"text": "Jai will release Marek's tools, if you ask for them yourself.", "next": "d2"}]}, "d2": {"who": "oda", "mood": "sad", "say": "Two years I've listened to those stones go dull, because the cure was in a drawer with his name on it. And now a baker's hand wants to take his bills to my stone.", "options": [{"text": "He'd hate the dust on them more than he'd mind my hands.", "next": "d_yes", "act": ["rep:oda:+8"]}, {"text": "No stones, no mill. No mill, no flour. That's the sum, Oda.", "next": "d_yes2"}, {"text": "They're tools. Tools want using.", "next": "d_blunt"}]}, "d_blunt": {"who": "oda", "mood": "angry", "say": "They're his hands, is what they are. You'll learn the difference when somebody dies on you.", "options": [{"text": "I'm sorry. That was clumsy. Will you ask for them?", "next": "d_yes2", "act": ["rep:oda:-5"]}]}, "d_yes": {"who": "oda", "mood": "happy", "say": "He would. He'd have a duster out before he said hello. Fetch them. I'll write Jai his line. And bring the book. I know the pattern by ear, not by eye.", "options": [{"text": "(Fetch Marek's kit from the museum.)", "next": "d_dress", "act": ["give:marek_tools"]}]}, "d_yes2": {"who": "oda", "mood": "neutral", "say": "Aye. That's the sum. Fetch them. I'll write Jai his line. And bring the book. I know the pattern by ear, not by eye.", "options": [{"text": "(Fetch Marek's kit from the museum.)", "next": "d_dress", "act": ["give:marek_tools"]}]}, "d_nobook": {"who": "oda", "mood": "neutral", "say": "No book. Jai turned you away. I'll not ask why; your face has the answer. Then we dress from memory. Mine, of his hands. It won't be right. It'll be better than toast.", "options": [{"text": "(Take down Marek's old spare bill from the nail by the door. Begin.)", "next": "d_rough"}]}, "d_dress": {"who": "scene", "say": "The runner stone comes up on the crane and lies on its back like something asleep. The pattern book opens flat at a page gone soft with thumbing. Ten harps. Four furrows to the harp. The land between left proud. In the margin, in pencil: “Slow is fast. M.”", "options": [{"text": "(Pick up the mill bill.)", "next": "d_dress2"}]}, "d_dress2": {"who": "oda", "mood": "thinking", "say": "Follow the old furrow. You're not cutting a new stone, you're finding the one that's there. Let the bill fall. Push it and it skates. Listen. Hear that? That's her saying yes.", "options": [{"text": "(Work the furrows, harp by harp, until the light goes.)", "next": "d_sign"}]}, "d_sign": {"who": "oda", "mood": "sad", "dir": "Near the eye of the stone, no bigger than a thumbnail, an ear of wheat is cut into the land.", "say": "A dresser signs the stone. That's Marek's. You've done the work. You've the right to cut yours beside it.", "options": [{"text": "Leave his alone. It's his stone.", "next": "d_sign_his", "act": ["rep:oda:+10"]}, {"text": "A small mark beside his. The work goes on.", "next": "d_sign_mine", "act": ["flag:signed_stone", "rep:oda:+5"]}, {"text": "Forty years you've fed this stone, Oda. Cut yours.", "next": "d_sign_oda", "act": ["flag:oda_signed", "rep:oda:+20"]}]}, "d_sign_his": {"who": "oda", "mood": "neutral", "say": "Aye. That's the right kind of pride.", "options": [{"text": "(Lower the stone. Run her.)", "next": "d_run"}]}, "d_sign_mine": {"who": "oda", "mood": "happy", "say": "He'd have liked the cheek. Small, mind. He was a small-signature man.", "options": [{"text": "(Cut it small. Lower the stone. Run her.)", "next": "d_run"}]}, "d_sign_oda": {"who": "oda", "mood": "surprised", "dir": "She takes the bill. Her hand is steadier than yours was. A millrind, plain, cut beside the wheat.", "say": "Forty years, and I never once thought it was mine to sign. There. Now she's both of ours.", "options": [{"text": "(Lower the stone. Run her.)", "next": "d_run"}]}, "d_run": {"who": "scene", "say": "The runner comes down. Oda opens the sluice. The mill takes a breath and the sound comes right: a long, even hush, like rain on a far roof. The flour comes off cool.", "options": [{"text": "(Listen a while. Then on to Brook Farm.)", "next": null, "act": ["flag:stones_dressed", "stage:farm"]}]}, "d_rough": {"who": "scene", "say": "You work from Oda's memory of another man's hands. Some furrows come true. Some wander. When the runner comes down the knock is gone, but the hush has a rasp in it, like a voice after a cold.", "options": [{"text": "(It will have to do. On to Brook Farm.)", "next": null, "act": ["flag:stones_rough", "stage:farm"]}]}}}, {"id": "farm", "title": "The kitchen table", "kind": "talk", "with": "suvi", "goal": "Go to Brook Farm before the week is out", "log": "Brook Farm, past the east wall line. The contract with Valley Provisions is signed at the end of the week.", "scene": "The farmhouse kitchen. A contract lies on the table between a teapot and a vet's bill. Suvi has a pen. Len has taken the bad chair, by choice, and is looking at the range as if it had personally disappointed him.", "start": "f1", "nodes": {"f1": {"who": "suvi", "mood": "neutral", "say": "You're from the Stone Oven. So you're here about four acres of red wheat, and you've been told I'm the villain.", "options": [{"text": "Nobody
