 said villain.", "next": "f2"}, {"text": "Are you?", "next": "f1b"}]}, "f1b": {"who": "suvi", "mood": "angry", "say": "I'm the one who opens the post. Sit down.", "options": [{"text": "(Sit.)", "next": "f2"}]}, "f2": {"who": "suvi", "mood": "thinking", "say": "Valley Provisions. One price, whole harvest, every year, paid in one sum. Do you know what one sum a year is, on a farm? It's the first time the money has come in before it ran out. Heritage doesn't pay the vet. A contract pays the vet.", "options": [{"text": "And the Old Wall Red?", "next": "f3"}, {"text": "Len. What do you say?", "next": "f_len"}]}, "f_len": {"who": "len", "mood": "neutral", "say": "Forty years I've grown wheat on the wall's bones. She tastes of the wall coming down. You can't put that in a silo. It won't go.", "options": [{"text": "Suvi. The Red.", "next": "f3"}]}, "f3": {"who": "suvi", "mood": "neutral", "say": "Goes in with the rest. The silo men call it contamination; they'd dock me for keeping it apart. Unless somebody pays me more for four awkward acres than Valley pays for nothing awkward at all. In writing. Before the week is out.", "options": [{"text": "Noor will. Stone price, in writing, paid the day the grain comes in.", "next": "f_noor"}, {"text": "Split it. Two acres in the contract, two to the mill.", "next": "f_split"}, {"text": "You should sign, Suvi. All of it. The farm comes first.", "next": "f_sign"}]}, "f_noor": {"who": "suvi", "mood": "thinking", "say": "Noor is one bakery. One buyer is a hobby. Two buyers is a market. Bring me a second name and I'll strike the Red out of the contract with this pen.", "options": [{"text": "The Tram Café. Mei has been asking for a wall loaf on the menu.", "next": "f_saved", "need": ["rep:mei:10"]}, {"text": "Me. A market stall, every market day. I know how a stall works.", "next": "f_saved", "need": ["done:own_stall:*"]}, {"text": "There's no second name. Not yet.", "next": "f_nosecond"}]}, "f_nosecond": {"who": "suvi", "mood": "sad", "say": "Then I can't carry four acres on one promise. Two. I'll keep two out for Noor, and heaven help my yield figures.", "options": [{"text": "Two it is.", "next": null, "act": ["flag:deal_split", "rep:suvi:+5", "rep:len:+5", "stage:report"]}, {"text": "Then sign it all. Don't cripple the contract for half a gesture.", "next": "f_sign"}]}, "f_saved": {"who": "len", "mood": "happy", "dir": "Suvi draws one line through a paragraph, initials it, and turns the page round. Len gets up out of the bad chair, which takes a while, and puts the kettle on, which for Len is a speech.", "say": "She'll want more than four acres, a wheat with two buyers. The top field's doing nothing.", "options": [{"text": "Six acres, then?", "next": "f_saved2"}]}, "f_saved2": {"who": "suvi", "mood": "happy", "say": "Don't push it, Dad. Fine. Six. And {player}: if either of your buyers is late with the money, the vet's bill goes to the bakery.", "options": [{"text": "Deal.", "next": null, "act": ["flag:deal_saved", "rep:suvi:+10", "rep:len:+25", "stage:report"]}]}, "f_split": {"who": "suvi", "mood": "thinking", "say": "Half. Valley won't love it, but they'll swallow two acres. Dad?", "options": [{"text": "Len?", "next": "f_split2"}]}, "f_split2": {"who": "len", "mood": "sad", "say": "Half a wheat. Well. Half's a seed crop. You can come back from half.", "options": [{"text": "Then two acres go to the mill.", "next": null, "act": ["flag:deal_split", "rep:suvi:+5", "rep:len:+5", "stage:report"]}]}, "f_sign": {"who": "suvi", "mood": "surprised", "say": "So you've come down on the side of the sums.", "options": [{"text": "I came to see the sums. The sums are yours.", "next": "f_sign2"}]}, "f_sign2": {"who": "len", "mood": "sad", "say": "So that's the young one's word. Well. I asked for it. Sign, girl. I'll walk the Red tonight. Somebody should.", "options": [{"text": "(Watch her sign.)", "next": "f_sign3"}]}, "f_sign3": {"who": "suvi", "mood": "neutral", "dir": "She signs. Then, without looking up:", "say": "Valley pays an introducer's fee. Thirty brix. You talked sense when everyone else talked wheat. It's yours if you want it.", "options": [{"text": "I'll take it.", "next": null, "act": ["pay:3000", "flag:took_fee", "flag:deal_sold", "rep:suvi:+20", "rep:len:-25", "stage:report"]}, {"text": "Keep it. Put it toward the vet.", "next": null, "act": ["flag:deal_sold", "rep:suvi:+25", "rep:len:-15", "stage:report"]}]}}}, {"id": "report", "title": "What the flour will be", "kind": "talk", "with": "noor", "goal": "Tell Noor how it went", "log": "Back to Baker Street. Noor will want the stones first and the wheat second, and will pretend it's the other way round.", "start": "r_split", "starts": [{"need": ["flag:deal_saved"], "node": "r_saved"}, {"need": ["flag:deal_sold"], "node": "r_sold"}], "nodes": {"r_saved": {"who": "noor", "mood": "happy", "say": "Six acres. And a second buyer. You went out for a sack of flour and came back with a harvest. And the stones?", "options": [{"text": "Dressed. The mill sounds like rain.", "next": "r_good", "need": ["flag:stones_dressed"]}, {"text": "Better. Not right. We had no pattern book.", "next": "r_rough", "need": ["flag:stones_rough"]}]}, "r_split": {"who": "noor", "mood": "thinking", "say": "Two acres. Half a wheat, half a contract. Nobody's happy and everybody's solvent. That is most of farming, and most of baking. And the stones?", "options": [{"text": "Dressed. The mill sounds like rain.", "next": "r_good_split", "need": ["flag:stones_dressed"]}, {"text": "Better. Not right. We had no pattern book.", "next": "r_rough_split", "need": ["flag:stones_rough"]}]}, "r_sold": {"who": "noor", "mood": "sad", "say": "All of it. Into the silo.", "options": [{"text": "The farm had to come first. I told her so.", "next": "r_sold2"}, {"text": "Valley paid me an introducer's fee. I took it.", "next": "r_fee", "need": ["flag:took_fee"]}]}, "r_good": {"who": "noor", "mood": "happy", "say": "I heard. Oda sent word. She said the mill sounds like rain. She hasn't said a thing like that since Marek. Journeyman. Go and scale tomorrow's rye.", "options": [{"text": "I'll scale the rye.", "next": null, "act": ["end:red_saved"]}]}, "r_rough": {"who": "noor", "mood": "neutral", "say": "Rough stones and good grain. We'll taste it in the crust, and we'll live. Journeyman. Go and scale tomorrow's rye.", "options": [{"text": "I'll scale the rye.", "next": null, "act": ["end:red_saved"]}]}, "r_good_split": {"who": "noor", "mood": "neutral", "say": "Good stones and half the grain to put through them. I've baked on worse. Journeyman. Scale the rye.", "options": [{"text": "I'll scale the rye.", "next": null, "act": ["end:red_split"]}]}, "r_rough_split": {"who": "noor", "mood": "neutral", "say": "Half a wheat through half-right stones. Well. We're still a bakery. Journeyman. Scale the rye.", "options": [{"text": "I'll scale the rye.", "next": null, "act": ["end:red_split"]}]}, "r_sold2": {"who": "noor", "mood": "neutral", "say": "You did. And you weren't wrong. I'll thank you not to be right like that in my shop again for a while. We bake with what Oda can find. Journeyman. Scale the rye.", "options": [{"text": "Understood.", "next": null, "act": ["end:red_sold"]}]}, "r_fee": {"who": "noor", "mood": "angry", "say": "Did they. Then the Red was worth thirty brix, and now we both know the price. Scale the rye.", "options": [{"text": "(Scale the rye.)", "next": null, "act": ["rep:noor:-15", "end:red_sold"]}]}}}], "endings": [{"id": "red_saved", "title": "The Red stays", "log": "The Old Wall Red is struck out of the contract and six acres go in at the next sowing. The wheat has two buyers now, which makes it a market.", "pay": 2500, "rep": {"noor": 15, "oda": 10}, "flags": ["red_saved"], "ripples": ["The fair loaf can be baked with Old Wall Red. With dressed stones as well, it is the best bread the Oven can make, so long as the Mother lives and the plait stays at home.", "Whoever you named as second buyer is now part of the bakery's week: a wall loaf on Mei's menu, or your own stall on market days.", "Len starts turning up at the side door with a sack and an opinion."], "unlocks": "Rank: Journeyman. Repeatable job: the flour run to Mill Fields."}, {"id": "red_split", "title": "Half a wheat", "log": "Two acres to the silo, two to the mill. Nobody is happy and everybody is solvent.", "pay": 2000, "rep": {"noor": 8, "oda": 5}, "flags": ["red_split"], "ripples": ["There is enough Red for the fair loaf and for Saturdays, and not for much else.", "Len calls it a seed crop. He is already planning the year after."], "unlocks": "Rank: Journeyman. Repeatable job: the flour run to Mill Fields."}, {"id": "red_sold", "title": "Into the silo", "log": "Brook Farm signed everything to Valley Provisions. The farm is safe. The Red is gone into the common grain.", "pay": 1500, "rep": {"noor": 0}, "flags": ["red_sold"], "ripples": ["The Oven bakes with ordinary grain. At the fair the loaf has nothing to hide behind and less to say.", "Suvi remembers who talked sense. Brook Farm becomes a friendly door.", "Len walks the old wall line in the evenings. If you took the fee, he knows."], "unlocks": "Rank: Journeyman. Repeatable job: the flour run to Mill Fields."}]}, {"id": "market_day", "group": "baker", "act": "IV", "title": "Market Day", "rank": "Baker", "giver": "eli", "needs": ["done:stone_ground:*"], "hook": "The Town Fair. Eli has had the Stone Oven's entry form filled in for weeks.", "summary": "One loaf per bakery, on the table by nine, and Vera's verdict is final. Everything you did before is in the loaf: whether the Mother lived, what the flour is, whose favour is baked into it. Then the mall's proving van dies in the square with forty minutes to go, and the only hot oven in walking distance is yours.", "theme": "Is winning the point, or is the bread?", "start": "entry", "stages": [{"id": "entry", "title": "The entry form", "kind": "talk", "with": "eli", "goal": "See Eli on Market Square about the bake-off", "log": "Eli is running the Town Fair from a clipboard on Market Square. The Stone Oven enters every year. This year the form has your name on it.", "start": "e1", "nodes": {"e1": {"who": "eli", "mood": "happy", "say": "The Stone Oven's entry! I had the form filled in before you got here. I have had it filled in for weeks.", "options": [{"text": "What are the rules?", "next": "e2"}, {"text": "Who's judging?", "next": "e3"}]}, "e2": {"who": "eli", "mood": "neutral", "say": "One loaf per bakery. On the table by nine. The judges' word is final. And no arguing with Vera. That last one isn't a rule. It's advice.", "options": [{"text": "Who's judging, besides Vera?", "next": "e3"}]}, "e3": {"who": "eli", "mood": "thinking", "say": "Vera, as always. Jai from the museum, who brings the prize. And one name out of the hat: this year, Olu. The prize is a year's loan of an original Town Oven token. Brass. Number forty-one.", "options": [{"text": "Who else has entered?", "next": "e4"}]}, "e4": {"who": "eli", "mood": "neutral", "say": "Northwood, Eastbrook, Southfield. And Crumb and Co. First time the mall has ever entered. He signed the form himself. Looked like a man signing for a parcel he wasn't sure he'd ordered.", "options": [{"text": "The mall's entering.", "next": null, "act": ["stage:loaf"]}]}}}, {"id": "loaf", "title": "One loaf", "kind": "talk", "with": "noor", "goal": "Decide the fair loaf with Noor", "log": "One loaf, and the whole town tastes it. Noor wants to see you at the bench.", "start": "l1", "nodes": {"l1": {"who": "noor", "mood": "neutral", "dir": "She has both hands flat on the bench, and she is looking at them.", "say": "You're shaping the fair loaf. One loaf, and the whole town tastes it. What do we send?", "options": [{"text": "Why me? It's your bakery.", "next": "l_why", "need": ["!flag:asked_why_me"]}, {"text": "The plain wall loaf. Flour, water, salt, time.", "next": "l_wall", "act": ["flag:loaf_wall"]}, {"text": "The seeded Saturday loaf.", "next": "l_seeded", "need": ["!flag:noor_knows"], "act": ["flag:loaf_seeded"]}, {"text": "The seeded Saturday loaf.", "next": "l_seeded_known", "need": ["flag:noor_knows"], "act": ["flag:loaf_seeded"]}, {"text": "Rosemary. Hari handed a bundle over the garden wall.", "next": "l_rosemary", "need": ["done:night_gardener:kept|helped"], "act": ["flag:loaf_rosemary"]}, {"text": "Pip's six-strand plait. Let them see what these hands can do.", "next": "l_plait", "act": ["flag:loaf_plait"]}]}, "l_why": {"who": "noor", "mood": "neutral", "say": "Because a fair loaf is shaped in one go, and mine don't go in one go any more. That's all you're getting. Choose.", "options": [{"text": "(Choose the loaf.)", "next": "l1", "act": ["flag:asked_why_me"]}]}, "l_wall": {"who": "noor", "mood": "happy", "say": "The Town Oven's loaf. The one Vera queued for. It's the hardest thing we make, because there is nowhere to stand behind it. Good.", "options": [{"text": "(Shape it. Prove it. Carry it to the square.)", "next": null, "act": ["stage:fair"]}]}, "l_seeded": {"who": "noor", "mood": "neutral", "say": "The seeded. Sells itself every Saturday. Safe. I've nothing against safe. Safe pays the flour bill.", "options": [{"text": "(Shape it. Prove it. Carry it to the square.)", "next": null, "act": ["stage:fair"]}]}, "l_seeded_known": {"who": "noor", "mood": "thinking", "say": "The Saturday loaf. His loaf. You'd put that on the table in front of him. Hm. Yes. Let him taste in public what he's been buying in secret.", "options": [{"text": "(Shape it. Prove it. Carry it to the square.)", "next": null, "act": ["stage:fair"]}]}, "l_rosemary": {"who": "noor", "mood": "surprised", "say": "Hari's rosemary? He gives that to nobody. What did you do for him? No. Don't tell me. A loaf with a favour baked into it. Vera will like that, and she'll know.", "options": [{"text": "(Shape it. Prove it. Carry it to the square.)", "next": null, "act": ["stage:fair"]}]}, "l_plait": {"who": "noor", "mood": "neutral", "say": "A plait. It will look like a wedding and taste as if the effort went into the looking. Pip will be thrilled. It's your loaf.", "options": [{"text": "(Shape it. Prove it. Carry it to the square.)", "next": null, "act": ["stage:fair"]}]}}}, {"id": "fair", "title": "Forty minutes", "kind": "talk", "with": "tam", "goal": "Take the loaf to the fair on Market Square", "log": "The Town Fair. Bunting on the arches, a rope line, a busker tuning up. Entries on the table by nine.", "scene": "At the far end of the square stands a white van with CRUMB & CO on its side and its back doors open. No hum. A man in a clean apron is standing very still in front of a rack of slowly collapsing dough.", "start": "a1", "nodes": {"a1": {"who": "tam", "mood": "sad", "say": "Generator's dead. The proving van's cold, the oven's cold, and my entry has forty minutes before it's a pancake. Tell me you've come to gloat. I'd respect a gloat.", "options": [{"text": "Use our oven. It's two hundred metres away and it's hot.", "next": "a_share"}, {"text": "Noor would say it herself. Use ours.", "next": "a_noor", "need": ["flag:noor_knows"]}, {"text": "The oven's hot. Twenty brix for forty minutes.", "next": "a_sell"}, {"text": "That's the fair. Everyone brings their own fire.", "next": "a_refuse"}]}, "a_share": {"who": "tam", "mood": "surprised", "say": "Her oven. You're offering me my sister's oven. Does she know you're giving away her fire?", "options": [{"text": "It's a fair. Nobody should lose to a generator.", "next": "a_walk", "act": ["flag:oven_shared", "rep:tam:+15"]}]}, "a_noor": {"who": "tam", "mood": "surprised", "say": "She'd say that? Noor? “Use ours”? Say it again, slowly. I want to remember the wording.", "options": [{"text": "“Use ours.” Two words. She'd count them.", "next": "a_walk", "act": ["flag:oven_shared", "rep:tam:+15"]}]}, "a_sell": {"who": "tam", "mood": "thinking", "say": "Twenty brix, for my own mother's oven. That is the most Eastgate thing anyone on Baker Street has ever said. I'm almost proud. Done.", "options": [{"text": "(Take the twenty.)", "next": "a_walk", "act": ["pay:2000", "flag:oven_sold", "rep:tam:-5"]}]}, "a_refuse": {"who": "tam", "mood": "neutral", "say": "Her words, near enough. Six years ago, different subject. Fair enough. Eli! Scratch Crumb and Co.", "options": [{"text": "(Carry your loaf to the table.)", "next": null, "act": ["flag:oven_refused", "rep:tam:-15", "stage:pip"]}]}, "a_walk": {"who": "scene", "say": "He carries the tray up Baker Street himself. At the side door he stops, as if the step were higher than he remembered. The oven takes his loaf the way it takes everything: without comment.", "options": [{"text": "(Wait with him by the oven.)", "next": "a_wait", "need": ["!flag:tam_secret"]}, {"text": "(Wait with him by the oven.)", "next": "a_slip", "need": ["flag:tam_secret", "!flag:noor_knows", "flag:cutting_secret", "flag:oven_shared"]}, {"text": "(Wait with him by the oven.)", "next": "a_wait", "need": ["flag:tam_secret", "!flag:noor_knows", "!flag:cutting_secret"]}, {"text": "(Wait with him by the oven.)", "next": "a_wait", "need": ["flag:tam_secret", "!flag:noor_knows", "flag:cutting_secret", "!flag:oven_shared"]}]}, "a_wait": {"who": "tam", "mood": "sad", "dir": "Noor stays at the bench with her back to you both. She does not turn round. She does not leave, either.", "say": "Same smell. I'd forgotten it has a smell. You'd think a man who runs a bakery would remember what one smells like.", "options": [{"text": "(Tam is looking at you.)", "next": "a_promise", "need": ["flag:broke_promise", "!flag:mother_lost"]}, {"text": "(Forty minutes. Then back to the square.)", "next": null, "act": ["stage:pip"]}]}, "a_promise": {"who": "tam", "mood": "thinking", "say": "You told her. You promised me you wouldn't, and you told her that same night. I was angry for a week. Then the Saturday loaf came round on the books, with my name on the order. Don't ever keep a promise to me again.", "options": [{"text": "(Forty minutes. Then back to the square.)", "next": null, "act": ["stage:pip"]}]}, "a_slip": {"who": "tam", "mood": "happy", "dir": "Noor has come to the proofing room door. He hasn't seen her.", "say": "First the jar, and now the oven. I'm running up a bill with you. At this rate I'll owe you a bakery.", "options": [{"text": "Tam. Not here.", "next": "a_slip_stop"}, {"text": "(Let him finish.)", "next": "a_slip_out"}]}, "a_slip_stop": {"who": "tam", "mood": "surprised", "dir": "He follows your eyes to the doorway. Noor looks at the two of you, then at the oven, and goes back to the bench.", "say": "Right. Yes. The oven. Lovely oven.", "options": [{"text": "(Forty minutes. Then back to the square.)", "next": null, "act": ["stage:pip"]}]}, "a_slip_out": {"who": "noor", "mood": "neutral", "dir": "From the doorway.", "say": "What jar?", "options": [{"text": "(Tell her. All of it.)", "next": "a_slip_out2"}]}, "a_slip_out2": {"who": "noor", "mood": "sad", "say": "All this time. You let me think it was the rye, all this time. And you. You fed her six years, and then sent a stranger to my door with her instead of your own two feet. Get that loaf to the square. We'll not do this in front of the oven.", "options": [{"text": "(Back to the square.)", "next": null, "act": ["flag:noor_knows", "flag:secret_out", "unflag:tam_secret", "rep:noor:-15", "stage:pip"]}]}}}, {"id": "pip", "title": "One song, eyes shut", "kind": "talk", "with": "pip", "goal": "Find Pip by the fountain before the judging", "log": "Pip busks once a year, at the fair, with their eyes shut. They are by the fountain with a guitar, not playing it.", "start": "k1", "starts": [{"need": ["flag:pip_reported"], "node": "k_cold"}], "nodes": {"k1": {"who": "pip", "mood": "thinking", "say": "I'm on after the judging. One song, eyes shut, it's fine, I do it every year. And Tam asked me again. This morning. Double the wage, and he wants an answer today, and I haven't got one.", "options": [{"text": "What do you want, Pip?", "next": "k2"}, {"text": "Stay. The Oven needs you.", "next": "k_needs"}, {"text": "Take it. It's good money.", "next": "k_go"}]}, "k2": {"who": "pip", "mood": "sad", "say": "I want Noor to say I'm good. Once. Out loud. She says “hm”. I've learned to live on “hm”. Tam says “brilliant” about everything, so it's worth nothing. Sorry. That came out more finished than I meant it.", "options": [{"text": "You're good, Pip. I'm saying it. Out loud.", "next": "k_stay"}, {"text": "Then go where somebody says it.", "next": "k_go2"}]}, "k_needs": {"who": "pip", "mood": "neutral", "say": "Needs. Not wants. You sound like her.", "options": [{"text": "You're good, Pip. That's the part she doesn't say.", "next": "k_stay"}, {"text": "It's your choice to make.", "next": "k_go"}]}, "k_stay": {"who": "pip", "mood": "happy", "say": "Oh. Right. I'm going to pretend I've got flour in my eye. I'll tell Tam no. Nicely. I'll write him a song about it.", "options": [{"text": "(Leave them to tune up.)", "next": null, "act": ["flag:pip_stays", "rep:pip:+15", "stage:judging"]}]}, "k_go": {"who": "pip", "mood": "neutral", "say": "Yeah. It is. Good money, and somebody who wants me. I'll tell Noor after the fair.", "options": [{"text": "(Leave them to tune up.)", "next": null, "act": ["flag:pip_leaves", "rep:pip:-5", "stage:judging"]}]}, "k_go2": {"who": "pip", "mood": "neutral", "say": "Yeah. Maybe that's all it is. Somewhere that says it. I'll tell Noor after the fair.", "options": [{"text": "(Leave them to tune up.)", "next": null, "act": ["flag:pip_leaves", "rep:pip:-5", "stage:judging"]}]}, "k_cold": {"who": "pip", "mood": "neutral", "say": "I'm taking Tam's job. I wanted you to hear it from me, and not as a report.", "options": [{"text": "I was wrong, that first morning. I'm sorry, Pip.", "next": "k_cold2"}, {"text": "That's your choice to make.", "next": null, "act": ["flag:pip_leaves", "stage:judging"]}]}, "k_cold2": {"who": "pip", "mood": "thinking", "say": "That's late. That's really late. But it's out loud, and nobody at the Oven says anything out loud. I'll stay a while longer. Then we'll see what you are.", "options": [{"text": "(Leave them to tune up.)", "next": null, "act": ["flag:pip_stays", "rep:pip:+10", "stage:judging"]}]}}}, {"id": "judging", "title": "The verdict", "kind": "talk", "with": "vera", "goal": "Stand at the judging table", "log": "Nine o'clock. Vera tears each loaf rather than cutting it. Jai holds token forty-one in a white glove. Olu is enjoying himself enormously.", "start": "j_good", "starts": [{"need": ["flag:mother_lost"], "node": "j_nowhere"}, {"need": ["flag:loaf_plait"], "node": "j_plait"}, {"need": ["flag:stones_dressed", "flag:red_saved"], "node": "j_great"}, {"need": ["flag:stones_dressed", "flag:red_split"], "node": "j_great"}], "nodes": {"j_great": {"who": "vera", "mood": "happy", "dir": "She tears the loaf and is quiet for longer than Eli's schedule allows.", "say": "That is the wall wheat, through a stone that's cutting true. I have not tasted this since I had to stand on a box to see over the counter.", "options": [{"text": "(Wait.)", "next": "hub_great", "need": ["!flag:mother_joined"]}, {"text": "(Wait.)", "next": "round_great", "need": ["flag:mother_joined"]}]}, "j_good": {"who": "vera", "mood": "thinking", "dir": "She tears the loaf and chews with her eyes shut.", "say": "Good bread. Honest bread. The Mother's in it; I'd know her in the dark. But the flour is only doing its job. I taste a bakery that has had a hard year.", "options": [{"text": "(Wait.)", "next": "hub_rest", "need": ["!flag:mother_joined"]}, {"text": "(Wait.)", "next": "round_rest", "need": ["flag:mother_joined"]}]}, "j_plait": {"who": "vera", "mood": "neutral", "say": "Six strands. Very handsome. I am sixty-six years old and I have never yet eaten a photograph. The crumb underneath is good. It deserved less scaffolding.", "options": [{"text": "(Wait.)", "next": "hub_rest", "need": ["!flag:mother_joined"]}, {"text": "(Wait.)", "next": "round_rest", "need": ["flag:mother_joined"]}]}, "j_nowhere": {"who": "vera", "mood": "sad", "say": "This is good bread. It is good bread from nowhere. Where is she? What happened to the Mother?", "options": [{"text": "We lost her the night the power went.", "next": "j_nowhere2", "need": ["!flag:scalded"]}, {"text": "I killed her. Hot water, at four in the morning.", "next": "j_nowhere2", "need": ["flag:scalded"]}]}, "j_nowhere2": {"who": "vera", "mood": "sad", "say": "Then I have outlived her. I did not expect to be saying that at a bake-off. Stand up straight, child. It isn't a judgement. It's a condolence.", "options": [{"text": "(Stand up straight.)", "next": "hub_rest"}]}, "round_great": {"who": "vera", "mood": "thinking", "say": "And the Mother. She's rounder. She has been somewhere. There are six years of somebody else's kitchen in this. Whose?", "options": [{"text": "Her brother's. It's no secret on Baker Street.", "next": "hub_great", "need": ["flag:noor_knows"]}, {"text": "Tam's. He kept a cutting alive. Noor didn't know. She does now.", "next": "hub_great", "need": ["!flag:noor_knows"], "act": ["flag:noor_knows", "flag:secret_out", "unflag:tam_secret", "rep:noor:-10"]}, {"text": "You'd have to ask the Mother.", "next": "hub_great", "need": ["!flag:noor_knows"]}]}, "round_rest": {"who": "vera", "mood": "thinking", "say": "And the Mother. She's rounder. She has been somewhere. There are six years of somebody else's kitchen in this. Whose?", "options": [{"text": "Her brother's. It's no secret on Baker Street.", "next": "hub_rest", "need": ["flag:noor_knows"]}, {"text": "Tam's. He kept a cutting alive. Noor didn't know. She does now.", "next": "hub_rest", "need": ["!flag:noor_knows"], "act": ["flag:noor_knows", "flag:secret_out", "unflag:tam_secret", "rep:noor:-10"]}, {"text": "You'd have to ask the Mother.", "next": "hub_rest", "need": ["!flag:noor_knows"]}]}, "hub_great": {"who": "scene", "say": "Jai holds up the white glove. The square waits on Vera.", "options": [{"text": "(Olu leans over and whispers something to Vera.)", "next": "white_great", "need": ["flag:mall_loaf", "!flag:white_aired"]}, {"text": "(Vera turns the plain loaf over in her hands.)", "next": "plain_great", "need": ["flag:loaf_wall", "!flag:plain_aired"]}, {"text": "(Vera holds the crumb to her nose.)", "next": "herb_great", "need": ["flag:loaf_rosemary", "!flag:herb_aired"]}, {"text": "(Tam is staring at your loaf.)", "next": "seed_great", "need": ["flag:loaf_seeded", "!flag:seed_aired", "!flag:oven_refused"]}, {"text": "(The verdict.)", "next": "vd_two", "need": ["flag:oven_shared"]}, {"text": "(The verdict.)", "next": "vd_receipt", "need": ["flag:oven_sold"]}, {"text": "(The verdict.)", "next": "vd_cold_win", "need": ["flag:oven_refused"]}]}, "hub_rest": {"who": "scene", "say": "Jai holds up the white glove. The square waits on Vera.", "options": [{"text": "(Olu leans over and whispers something to Vera.)", "next": "white_rest", "need": ["flag:mall_loaf", "!flag:white_aired"]}, {"text": "(Vera turns the plain loaf over in her hands.)", "next": "plain_rest", "need": ["flag:loaf_wall", "!flag:plain_aired"]}, {"text": "(Vera holds the crumb to her nose.)", "next": "herb_rest", "need": ["flag:loaf_rosemary", "!flag:herb_aired"]}, {"text": "(Tam is staring at your loaf.)", "next": "seed_rest", "need": ["flag:loaf_seeded", "!flag:seed_aired", "!flag:oven_refused"]}, {"text": "(The verdict.)", "next": "vd_lost_well", "need": ["flag:oven_shared"]}, {"text": "(The verdict.)", "next": "vd_sold_lost", "need": ["flag:oven_sold"]}, {"text": "(The verdict.)", "next": "vd_lost_cold", "need": ["flag:oven_refused"]}]}, "white_great": {"who": "vera", "mood": "surprised", "say": "A mall loaf? In the Stone Oven's basket? On your first morning? And she kept you on. Then either you are very good or she is getting soft. I have just tasted which.", "options": [{"text": "(Wish for the ground to open.)", "next": "hub_great", "act": ["flag:white_aired"]}]}, "white_rest": {"who": "vera", "mood": "surprised", "say": "A mall loaf? In the Stone Oven's basket? On your first morning? And she kept you on. Then either you are very good or she is getting soft. I have just tasted which.", "options": [{"text": "(Wish for the ground to open.)", "next": "hub_rest", "act": ["flag:white_aired"]}]}, "plain_great": {"who": "vera", "mood": "thinking", "say": "Plain. No seeds, no plait, nowhere to stand behind it. That is the Town Oven's own loaf, and it takes nerve to put it on a table. I can taste the nerve.", "options": [{"text": "(Wait.)", "next": "hub_great", "act": ["flag:plain_aired", "rep:vera:+5"]}]}, "plain_rest": {"who": "vera", "mood": "thinking", "say": "Plain. No seeds, no plait, nowhere to stand behind it. That is the Town Oven's own loaf, and it takes nerve to put it on a table. I can taste the nerve.", "options": [{"text": "(Wait.)", "next": "hub_rest", "act": ["flag:plain_aired", "rep:vera:+5"]}]}, "herb_great": {"who": "vera", "mood": "happy", "say": "Rosemary. From the south bed at Tram Court; I'd know it anywhere. Hari gives that to almost nobody. Somebody has been kind to that man. I shall count it.", "options": [{"text": "(Wait.)", "next": "hub_great", "act": ["flag:herb_aired", "rep:vera:+5", "rep:hari:+5"]}]}, "seed_great": {"who": "tam", "mood": "surprised", "say": "That's the Saturday loaf. You've entered the Saturday loaf. Against me. I have eaten that loaf every week for six years. I know exactly how good it is.", "options": [{"text": "(Wait.)", "next": "hub_great", "act": ["flag:seed_aired"]}]}, "herb_rest": {"who": "vera", "mood": "happy", "say": "Rosemary. From the south bed at Tram Court; I'd know it anywhere. Hari gives that to almost nobody. Somebody has been kind to that man. I shall count it.", "options": [{"text": "(Wait.)", "next": "hub_rest", "act": ["flag:herb_aired", "rep:vera:+5", "rep:hari:+5"]}]}, "seed_rest": {"who": "tam", "mood": "surprised", "say": "That's the Saturday loaf. You've entered the Saturday loaf. Against me. I have eaten that loaf every week for six years. I know exactly how good it is.", "options": [{"text": "(Wait.)", "next": "hub_rest", "act": ["flag:seed_aired"]}]}, "vd_two": {"who": "vera", "mood": "happy", "say": "The token goes to the Stone Oven. And I am told the mall's loaf came out of the same fire this morning. Best thing in it, the fire. Number forty-one, to the bread with two bakers behind it.", "options": [{"text": "(Take the token. Find Tam's face in the crowd.)", "next": null, "act": ["end:two_bakers"]}]}, "vd_receipt": {"who": "vera", "mood": "neutral", "say": "The token goes to the Stone Oven. Best loaf on the table. I'm also told its oven was let by the hour this morning. I judge bread, not landlords. Number forty-one.", "options": [{"text": "(Take the token.)", "next": null, "act": ["end:won_cold"]}]}, "vd_cold_win": {"who": "vera", "mood": "neutral", "say": "The token goes to the Stone Oven. Best loaf at the fair. I notice it was also the only fire at the fair. Number forty-one. Wear it lightly.", "options": [{"text": "(Take the token.)", "next": null, "act": ["end:won_cold"]}]}, "vd_lost_well": {"who": "vera", "mood": "thinking", "say": "The token goes to Crumb and Co. I never thought to say it. It was baked in the Stone Oven's fire, by a man that fire trained, and it is the best loaf here. The Oven lost today. I don't believe it lost anything that matters.", "options": [{"text": "(Clap. Mean it.)", "next": null, "act": ["end:lost_well"]}]}, "vd_sold_lost": {"who": "vera", "mood": "neutral", "say": "The token goes to Crumb and Co, baked in an oven hired for twenty brix. Beaten by your own tenant. There is a proverb in that, and I shan't be the one to write it.", "options": [{"text": "(Clap. It costs you.)", "next": null, "act": ["end:tenant"]}]}, "vd_lost_cold": {"who": "vera", "mood": "angry", "say": "The token goes to Northwood, for a perfectly decent cob. One bakery's van died and the other's door stayed shut. I fed half this square at five years old, on one bench, with one jug between them. Evidently it wore off.", "options": [{"text": "(Stand there and take it.)", "next": null, "act": ["end:lost_cold"]}]}}}], "endings": [{"id": "two_bakers", "title": "The bread with two bakers", "log": "Token forty-one came home to the Stone Oven, and the mall's loaf was baked in the same fire. Vera's sentence will be quoted until the next fair.", "pay": 3500, "rep": {"noor": 15, "tam": 15, "vera": 10}, "give": ["fair_token"], "flags": ["token_won"], "ripples": ["The shared oven is the door Tam walks through in the last quest. Without it, the Long Table cannot happen.", "Orders double. Olu wants a second shelf, and the Tram Café wants twenty loaves where it had twelve.", "Whatever Pip decided by the fountain, they play their song to a full square."], "unlocks": "Rank: Baker. The fair token, for a year. Repeatable job: the Saturday stall."}, {"id": "won_cold", "title": "Won, to a quiet square", "log": "Best loaf at the fair. The applause was polite. Vera noticed whose fire was the only fire.", "pay": 3000, "rep": {"noor": 5, "tam": -10, "vera": -5}, "give": ["fair_token"], "flags": ["token_won"], "ripples": ["If you kept the door shut: you hold the token, and in the last quest Tam comes to the alley with a job offer.", "If you hired the oven out: you hold the token and his twenty brix.", "Either way the Long Table is closed: it needs the oven shared."], "unlocks": "Rank: Baker. The fair token, for a year. Repeatable job: the Saturday stall."}, {"id": "lost_well", "title": "Lost well", "log": "Tam's loaf, baked in the Stone Oven's fire, took the token. The Oven lost the fair and won the town.", "pay": 1500, "rep": {"noor": 10, "tam": 20, "vera": 10}, "flags": ["token_tam"], "ripples": ["Tam cannot bear to keep the token. In the last quest he brings it to the alley in a paper bag, unless the Mother was lost, when he comes about that.", "The whole square saw whose door opened. Orders rise anyway.", "Noor says nothing about losing. She gives you the first slice of the next morning's batch, which is how she says it."], "unlocks": "Rank: Baker. Repeatable job: the Saturday stall."}, {"id": "tenant", "title": "Beaten by your tenant", "log": "Tam's loaf took the token, baked in an oven you charged him twenty brix to use.", "pay": 500, "rep": {"vera": -5}, "flags": ["token_tam"], "ripples": ["Tam still cannot bear to keep the token, and brings it to the alley in the last quest, unless the Mother was lost, when he comes about that.", "The Long Table is closed: it needs the oven shared, not hired."], "unlocks": "Rank: Baker. Repeatable job: the Saturday stall."}, {"id": "lost_cold", "title": "Nobody's fair", "log": "The token went elsewhere, and Vera had a sentence for it. It will be quoted until the next fair.", "pay": 500, "rep": {"noor": -5, "vera": -10}, "flags": ["token_lost"], "ripples": ["The Oven keeps its regulars and gains nobody.", "If you kept the door shut, Tam comes to the alley in the last quest with a job offer, unless the Mother was lost.", "In the last quest the partnership needs real standing with Noor; this ending does not help.", "Eli quietly adds a line to next year's rules about sharing ovens. It has your initials beside it."], "unlocks": "Rank: Baker, by seniority. Repeatable job: the Saturday stall."}]}, {"id": "name_on_the_door", "group": "baker", "act": "V", "title": "Your Name on the Door", "rank": "Master Baker", "giver": "noor", "needs": ["done:market_day:*"], "hook": "Some weeks after the fair. A tray of rolls on the bench, shaped badly by the best hands in town.", "summary": "Noor's hands are going the way her mother's went. Before long she will not be able to shape a batch. The Stone Oven needs hands, and a name to answer for them, and there is a man standing in the alley who has not knocked on that door in six years. What the bakery becomes is your answer to give, and everything you did since the first morning decides which answers are open.", "theme": "What do you keep, and what do you let change?", "start": "hands", "stages": [{"id": "hands", "title": "Shaped badly", "kind": "talk", "with": "noor", "goal": "Talk to Noor at the bench", "log": "After closing. Noor has asked you to stay behind.", "scene": "A tray of rolls sits on the bench, shaped badly. Not an apprentice's kind of badly. A different kind. Noor is holding her right hand in her left as if it belonged to somebody she was looking after.", "start": "h1", "starts": [{"need": ["flag:noticed_hands"], "node": "h_known"}], "nodes": {"h1": {"who": "noor", "mood": "neutral", "say": "Don't. I know what they look like. I shaped them.", "options": [{"text": "Your hands.", "next": "h2", "need": ["!flag:mother_lost"]}, {"text": "Your hands.", "next": "h2_lost", "need": ["flag:mother_lost"]}]}, "h_known": {"who": "noor", "mood": "neutral", "say": "You've known a long while. You asked about the order book, and then you had the manners not to ask the second question. Ask it now.", "options": [{"text": "How bad are they, Noor?", "next": "h2", "need": ["!flag:mother_lost"], "act": ["rep:noor:+5"]}, {"text": "How bad are they, Noor?", "next": "h2_lost", "need": ["flag:mother_lost"], "act": ["rep:noor:+5"]}]}, "h2": {"who": "noor", "mood": "sad", "say": "The same as my mother's. I can feed the Mother. I can count. I can taste. I cannot shape a batch, and before long I won't be able to shape a roll. So the Oven needs hands, and a name to answer for them.", "options": [{"text": "It has hands.", "next": "h3"}, {"text": "And Pip's bench is empty.", "next": "h_pip", "need": ["flag:pip_leaves"]}, {"text": "What do you want it to be?", "next": "h3"}]}, "h2_lost": {"who": "noor", "mood": "sad", "say": "The same as my mother's. I can count. I can taste. I cannot shape a batch, and before long I won't be able to shape a roll. So the Oven needs hands, and a name to answer for them.", "options": [{"text": "It has hands.", "next": "h3"}, {"text": "And Pip's bench is empty.", "next": "h_pip", "need": ["flag:pip_leaves"]}, {"text": "What do you want it to be?", "next": "h3"}]}, "h_pip": {"who": "noor", "mood": "sad", "say": "Pip went where somebody says “brilliant”. I said “hm”. I have had since the fair to cost that, and it comes out dear.", "options": [{"text": "It still has hands.", "next": "h3"}]}, "h3": {"who": "noor", "mood": "thinking", "say": "I've known what the Oven is since I could reach the bench. I don't know what it is without my hands in it. You do the thinking. Go and walk about. Come back this evening and tell me what it should be when I can't.", "options": [{"text": "This evening.", "next": null, "act": ["stage:alley"]}]}}}, {"id": "alley", "title": "The man who isn't knocking", "kind": "talk", "with": "tam", "goal": "That evening: the alley beside the Stone Oven", "log": "You walk the old wall line and back. When you come back, somebody is standing in the alley by the side door.", "scene": "A man is standing in the alley by the side door, not knocking. He has clearly been not knocking for some time.", "start": "x1", "starts": [{"need": ["flag:mother_lost", "flag:noor_knows"], "node": "x_lost_known"}, {"need": ["flag:mother_lost", "flag:told_of_jar"], "node": "x_lost"}, {"need": ["flag:mother_lost"], "node": "x_lost_untold"}, {"need": ["flag:oven_refused"], "node": "x_offer"}, {"need": ["flag:token_tam"], "node": "x_token"}], "nodes": {"x1": {"who": "tam", "mood": "neutral", "say": "I heard about her hands. Mei told Abe, Abe told a parcel, and the parcel told me. What happens to the Oven?", "options": [{"text": "That depends. Would you come in, if the door opened?", "next": "x_in"}, {"text": "Why do you care? You left.", "next": "x_left"}]}, "x_left": {"who": "tam", "mood": "sad", "say": "I left the shop. I never left the bread. I have eaten hers every Saturday for six years.", "options": [{"text": "Would you come in, if the door opened?", "next": "x_in"}]}, "x_in": {"who": "tam", "mood": "thinking", "say": "If she opened it. Not you. Her. I've had six years to practise walking through that door, and I still only know the one way. Invited.", "options": [{"text": "Then wait here.", "next": null, "act": ["flag:tam_waiting", "stage:door"]}, {"text": "It isn't my door to open.", "next": null, "act": ["stage:door"]}]}, "x_token": {"who": "tam", "mood": "neutral", "dir": "He is holding token forty-one in a paper bag, like something bought.", "say": "This is hers. It was baked in her fire. I've had it on my till ever since, and I can't look at it. Give it to her. Don't say it's from me. No. Say it's from me.", "options": [{"text": "Give it to her yourself. Wait here.", "next": null, "act": ["flag:tam_waiting", "stage:door"]}, {"text": "I'll take it in.", "next": null, "act": ["give:fair_token", "stage:door"]}]}, "x_offer": {"who": "tam", "mood": "neutral", "say": "I'll be quick, since I'm not welcome on this street. Her hands are going. The Oven has a year left, two if she's stubborn, and she is. Come and run my counter. Head baker. Sixty brix a day, and you start at nine.", "options": [{"text": "I'll think about it.", "next": null, "act": ["flag:tam_offer", "stage:door"]}, {"text": "No. And you know why.", "next": "x_offer2"}]}, "x_offer2": {"who": "tam", "mood": "sad", "say": "I know why. You shut a door on me at the fair, and here I am offering you a job. What does that tell you about how many bakers I trust? The offer stands.", "options": [{"text": "(Go in.)", "next": null, "act": ["flag:tam_offer", "stage:door"]}]}, "x_lost_known": {"who": "tam", "mood": "sad", "say": "She had my cutting in her kitchen for one night, and then the kettle took the lot. I heard. I've still the jar. I've waited ever since for her to send for it, and she won't. She had it once already, and look what came of that.", "options": [{"text": "Bring the jar home, Tam. Tonight. I'll get you through the door.", "next": null, "act": ["flag:jar_home", "flag:tam_waiting", "stage:door"]}, {"text": "It's too late. Leave her be.", "next": null, "act": ["stage:door"]}]}, "x_lost_untold": {"who": "tam", "mood": "sad", "say": "I know she lost the Mother. Vera said it across the judging table, in front of the whole square, like weather. And I've a jar of her in my fridge, alive, and my sister doesn't know it exists.", "options": [{"text": "Bring the jar home, Tam. Tonight. I'll get you through the door.", "next": null, "act": ["flag:knows_jar", "flag:jar_home", "flag:tam_waiting", "stage:door"]}, {"text": "It's too late. Leave her be.", "next": null, "act": ["flag:knows_jar", "stage:door"]}]}, "x_lost": {"who": "tam", "mood": "sad", "say": "I know she lost the Mother. Vera said it across the judging table, in front of the whole square, like weather. And I've a jar of her in my fridge, alive, and a sister who would sooner bake on bought yeast than send for it, if I know her.", "options": [{"text": "Bring the jar home, Tam. Tonight. I'll get you through the door.", "next": null, "act": ["flag:knows_jar", "flag:jar_home", "flag:tam_waiting", "stage:door"]}, {"text": "She said she won't beg her own culture back from a mall.", "next": "x_lost2", "need": ["flag:told_of_jar"]}, {"text": "It's too late. Leave her be.", "next": null, "act": ["flag:knows_jar", "stage:door"]}]}, "x_lost2": {"who": "tam", "mood": "angry", "say": "Beg? I'd carry it up Baker Street on my knees. Nobody has to beg. Somebody has to knock. All right. I'll fetch the jar, and then I'll knock.", "options": [{"text": "I'll tell her you're coming.", "next": null, "act": ["flag:jar_home", "flag:tam_waiting", "stage:door"]}]}}}, {"id": "door", "title": "What the Oven should be", "kind": "talk", "with": "noor", "goal": "Give Noor your answer", "log": "The shutters are down. The oven is ticking as it cools. Noor is waiting for an answer.", "start": "y1", "starts": [{"need": ["flag:jar_home", "flag:noor_knows"], "node": "y_home_known"}, {"need": ["flag:jar_home"], "node": "y_home"}, {"need": ["flag:tam_waiting"], "node": "y0"}], "nodes": {"y0": {"who": "noor", "mood": "neutral", "say": "Before you answer. There's a man in my alley. I can hear him not knocking. What does he want?", "options": [{"text": "To come in, if you'd open the door.", "next": "y0b", "need": ["!flag:token_tam"]}, {"text": "Ask him yourself.", "next": "y0b"}, {"text": "To give you the fair token. He won it in your fire, and he can't look at it.", "next": "y0b", "need": ["flag:token_tam", "!have:fair_token"]}]}, "y0b": {"who": "noor", "mood": "neutral", "say": "Then he can hear this through the door. I open at four. Bakers use the alley. If he wants to knock, he knows the hour. Now. Your answer.", "options": [{"text": "(Answer her.)", "next": "y1", "act": ["flag:alley_told", "rep:tam:+10"]}]}, "y1": {"who": "noor", "mood": "thinking", "say": "Well. You've thought. What should the Oven be when I can't?", "options": [{"text": "First: this is yours. Tam won it in your fire, and he can't look at it.", "next": "y_token", "need": ["have:fair_token", "flag:token_tam", "!flag:token_given"]}, {"text": "The Town Oven, again. Market days, in the square: the whole town's dough, one fire. And it needs your brother.", "next": "y_table", "need": ["flag:tam_waiting", "flag:noor_knows", "flag:oven_shared", "!flag:jar_home"]}, {"text": "Yours and mine. Both names on the door.", "next": "y_partner", "need": ["rep:noor:40"]}, {"text": "Yours, still. Your name. My hands.", "next": "y_keeper"}, {"text": "I want my own name. A stall, my own bread, and a cutting of the Mother, if you'll give me one.", "next": "y_own", "need": ["done:own_stall:*", "!flag:mother_lost", "flag:noor_knows"]}, {"text": "I want my own name. A stall, my own bread, and a cutting of the Mother, if you'll give me one.", "next": "y_own2", "need": ["done:own_stall:*", "!flag:mother_lost", "!flag:noor_knows"]}, {"text": "Tam has offered me his counter. I'm taking it.", "next": "y_crumb", "need": ["flag:tam_offer"]}]}, "y_table": {"who": "noor", "mood": "neutral", "dir": "She is quiet for a long time. Then she goes to the side door herself, and opens it.", "say": "You. In. You're letting the heat out. Six years I've been cold with that door shut. Sit down. This one has an idea, and it's the kind you would have had, which is the only thing against it.", "options": [{"text": "(Lay token forty-one on the bench between them.)", "next": "y_table2", "need": ["have:fair_token"]}, {"text": "(Tell them about the Town Oven.)", "next": "y_table2"}]}, "y_table2": {"who": "tam", "mood": "happy", "say": "One fire, the whole town's dough, market days in the square. A token on every loaf so nobody goes home with the wrong one. That's it. That's what I was trying to say six years ago, with worse words.", "options": [{"text": "Noor?", "next": "y_table3"}]}, "y_table3": {"who": "noor", "mood": "happy", "say": "It is not six counters in six towns. It's one oven. But yes. You run the queue; you were always good with a queue. I feed the Mother. {player} bakes. The name over the door stays as it is. We add a line underneath.", "options": [{"text": "What does the line say?", "next": "y_table4"}]}, "y_table4": {"who": "noor", "mood": "happy", "say": "“Bring your own dough.” Vera gets the first loaf. Go and tell Eli he needs a longer rope.", "options": [{"text": "(Go and tell Eli.)", "next": null, "act": ["end:long_table"]}]}, "y_home": {"who": "noor", "mood": "sad", "dir": "You have barely said that her brother is in the alley when she has the side door open. Tam comes in with the jar held in both hands, the way you would carry a bird. MUM, in marker, gone brown. Nobody says anything. Noor takes it, opens it, and smells it.", "say": "Same sour. Same stubborn. Six years in that place, and you fed her every day. Sit down, you fool. You're letting the heat out.", "options": [{"text": "There's one thing more. The Town Oven, on market days, in the square.", "next": "y_table2", "need": ["flag:oven_shared"], "act": ["unflag:mother_lost", "flag:mother_joined", "flag:noor_knows"]}, {"text": "(Leave them to it. Put the kettle on. For tea.)", "next": null, "act": ["unflag:mother_lost", "end:homecoming"]}]}, "y_home_known": {"who": "noor", "mood": "sad", "dir": "You have barely said that her brother is in the alley when she has the side door open. Tam comes in with the jar held in both hands, the way you would carry a bird. Noor takes it, opens it, and smells it.", "say": "Twice. She has come to my door twice now, and the first time she was boiled in my own kitchen. Same sour. Same stubborn. Sit down, you fool. You're letting the heat out.", "options": [{"text": "There's one thing more. The Town Oven, on market days, in the square.", "next": "y_table2", "need": ["flag:oven_shared"], "act": ["unflag:mother_lost", "flag:mother_joined", "flag:noor_knows"]}, {"text": "(Leave them to it. Put the kettle on. For tea.)", "next": null, "act": ["unflag:mother_lost", "end:homecoming"]}]}, "y_token": {"who": "noor", "mood": "thinking", "say": "He sent it by another hand. Of course he did. It can hang by the oven, where it was won. Tell him it's there. He'll know what that means.", "options": [{"text": "(Answer her question.)", "next": "y1", "act": ["take:fair_token", "flag:token_given", "rep:tam:+5", "rep:noor:+5"]}]}, "y_partner": {"who": "noor", "mood": "happy", "say": "Both names. That door has had one name on it for thirty-four years, and it never once looked lonely until you said that. Underneath mine. Same size. Smaller would be false and larger would be cheek.", "options": [{"text": "Same size.", "next": null, "act": ["end:partner"]}]}, "y_keeper": {"who": "noor", "mood": "neutral", "say": "My name, your hands. My mother and I did it the other way about, her last years: my name on the door, and her hands on the Mother. It works. It's lonelier than it looks, the name part. You'll see.", "options": [{"text": "Four o'clock, then.", "next": null, "act": ["end:keeper"]}]}, "y_own": {"who": "noor", "mood": "thinking", "say": "Your own name. I was twenty-four when mine went on that door, and it has owned me ever since. Fetch a jar. Third one in the world. Feed her at midnight and at five, and if I ever hear you've used the kettle, I'll come and take her back.", "options": [{"text": "Midnight and five. Never the kettle.", "next": null, "act": ["give:mother_cutting", "end:own_name"]}]}, "y_own2": {"who": "noor", "mood": "thinking", "say": "Your own name. I was twenty-four when mine went on that door, and it has owned me ever since. Fetch a jar. Second one in the world, so far as I know. Feed her at midnight and at five, and if I ever hear you've used the kettle, I'll come and take her back.", "options": [{"text": "Midnight and five. Never the kettle.", "next": null, "act": ["give:mother_cutting", "end:own_name"]}]}, "y_crumb": {"who": "noor", "mood": "neutral", "say": "The mall. Well. It's honest work, and he pays on time. Leave the proofing room key on the bench. Keep the side door one. Somebody in that mall should know what a door is for.", "options": [{"text": "(Leave the key on the bench.)", "next": null, "act": ["end:crumb"]}]}}}], "endings": [{"id": "long_table", "title": "The Long Table", "log": "On market days the Town Oven burns again in the square: the whole town's dough, one fire, a brass token on every loaf. Tam runs the queue. Noor feeds the Mother. You bake.", "pay": 5000, "rep": {"noor": 25, "tam": 25, "vera": 20, "jai": 10, "eli": 10}, "flags": ["end_long_table"], "ripples": ["Vera eats the first loaf from the Town Oven in fifty-eight years. Her verdict is one word. Nobody will tell you what it was; you have to be there.", "The sign over the door gains one line: “Bring your own dough.”", "A new repeatable market-day activity opens in your town: bring dough, mark it with a token, bake together."], "unlocks": "Rank: Master Baker. The Town Oven on market days. A share of its takings."}, {"id": "homecoming", "title": "Homecoming", "log": "The Mother came home in a jam jar, carried in both hands. The shop opens at seven on real sourdough again.", "pay": 3500, "rep": {"noor": 20, "tam": 25}, "flags": ["end_homecoming", "mother_joined", "noor_knows"], "ripples": ["The culture that died the night the power went is alive on Baker Street again, by way of a mall fridge.", "Tam has a key now. He uses the alley, at four, like a baker.", "Vera tastes Saturday's loaf and sends down a note: “She's back. Rounder.”"], "unlocks": "Rank: Master Baker. The Stone Oven is yours to run, with both of them behind you."}, {"id": "partner", "title": "Both names", "log": "The signwriter came the next morning. Your name is under Noor's, in the same size.", "pay": 4000, "rep": {"noor": 20}, "flags": ["end_partner"], "ripples": ["You take a share of the Oven's daily takings from now on.", "If Tam was told he could knock, he does, eventually. That is a story for a later career."], "unlocks": "Rank: Master Baker. Co-owner of the Stone Oven."}, {"id": "keeper", "title": "Her name, your hands", "log": "The Oven goes on as it always has. Noor keeps the count. You feed the town.", "pay": 3000, "rep": {"noor": 10}, "flags": ["end_keeper"], "ripples": ["The town never notices the change, which is the highest compliment the Oven knows.", "The name on the door is still hers. On some mornings that is exactly as lonely as she said."], "unlocks": "Rank: Master Baker. Head baker's wage."}, {"id": "own_name", "title": "A jar of your own", "log": "You left with Noor's blessing and a cutting of the Mother. It sits in a jar on a stall with your own name above it.", "pay": 2000, "rep": {"noor": 5}, "flags": ["end_own_name"], "ripples": ["Your market stall can sell sourdough made from the Mother.", "Pip, if they stayed, becomes Noor's hands. She says “good” to them once, out loud. Pip tells everybody."], "unlocks": "Rank: Master Baker, under your own name. A bakery stall on market days."}, {"id": "crumb", "title": "The warm counter", "log": "Head baker at Crumb & Co. Sixty brix a day, a nine o'clock start, music in the ceiling.", "pay": 6000, "rep": {"noor": -30, "tam": 15}, "take": ["proofing_room_key"], "flags": ["end_crumb"], "ripples": ["The best wage in the career, and the only ending where you sleep until eight.", "The Stone Oven's lights still go on at four. You can hear the barrow from your bed, if you're awake.", "The side door key still works. Noor never asks for it back."], "unlocks": "Rank: Master Baker at Crumb & Co. The highest daily wage."}]}, {"id": "lunch_mei", "group": "romance", "act": "M1", "title": "Twenty Minutes", "rank": "Courting Mei: lunch", "giver": "mei", "next": "dinner_mei", "needs": ["done:four_oclock_door:hired_clean|hired_wary", "rep:mei:25"], "hook": "Once Mei's regard for you reaches 25, a new reply appears on the morning round: “Do you ever get a lunch break?”", "summary": "Mei gets twenty minutes between the noon tram and the twenty past, and spends them eating a crust over the sink. Everybody in Old Town tells Mei things. Nobody has ever asked her one.", "theme": "Do you talk, or do you ask?", "start": "ask", "stages": [{"id": "ask", "title": "The morning round", "kind": "talk", "with": "mei", "goal": "Talk to Mei at the Tram Café", "log": "The Tram Café's twelve loaves, same as every morning. Mei is counting them twice, fast.", "start": "a1", "starts": [{"need": ["again:lunch_mei"], "node": "a_again"}, {"need": ["flag:end_crumb"], "node": "a1_gone"}, {"need": ["flag:end_own_name"], "node": "a1_gone"}], "nodes": {"a1": {"who": "mei", "mood": "happy", "say": "Twelve, warm, on time. You're getting dull, you know. I've nothing left to tell Noor about you.", "options": [{"text": "Do you ever get a lunch break?", "next": "a2"}, {"text": "(Just the delivery today.)", "next": null}]}, "a_again": {"who": "mei", "mood": "happy", "say": "There you are. And you've the look of somebody who wants another go at lunch.", "options": [{"text": "I do. I talked about myself for twenty minutes. Let me try again.", "next": "a_again2"}, {"text": "(Not today.)", "next": null}]}, "a_again2": {"who": "mei", "mood": "happy", "say": "You did. I timed it. Tomorrow, five past twelve, the fountain rim. Bring bread, and bring a question this time.", "options": [{"text": "Five past twelve.", "next": null, "act": ["stage:basket"]}]}, "a1_gone": {"who": "mei", "mood": "happy", "say": "You! I still count twelve every morning and look for your face behind the barrow. You're getting hard to gossip about, now you don't come by.", "options": [{"text": "Do you ever get a lunch break?", "next": "a2"}, {"text": "(Just passing.)", "next": null}]}, "a2": {"who": "mei", "mood": "surprised", "say": "A lunch break. Me? I get twenty minutes between the noon tram and the twenty past, and I spend them eating a crust over the sink. Why?", "options": [{"text": "Spend them with me. I'll bring the bread.", "next": "a3"}, {"text": "Because you've asked me a hundred questions since I came to town, and I've never asked you one.", "next": "a3b", "act": ["rep:mei:+3"]}, {"text": "No reason.", "next": "a_no"}]}, "a_no": {"who": "mei", "mood": "neutral", "say": "Oh. That's the first boring thing you've ever said to me. Shame. I'd have said yes.", "options": [{"text": "(Go. Kick yourself as far as Baker Street.)", "next": null}]}, "a3": {"who": "mei", "mood": "thinking", "say": "You're asking me to lunch. With twenty minutes and a tram timetable. That's either very sweet or very badly planned.", "options": [{"text": "Both, probably.", "next": "a4"}]}, "a3b": {"who": "mei", "mood": "surprised", "say": "A hundred? You counted? Nobody counts. All right. Now I want to know what you'd ask.", "options": [{"text": "Have lunch with me and find out.", "next": "a4"}]}, "a4": {"who": "mei", "mood": "happy", "say": "Tomorrow. Five past twelve, the fountain rim. If you're late I'll have eaten your half and told the whole tram about it.", "options": [{"text": "Five past twelve.", "next": null, "act": ["stage:basket"]}]}}}, {"id": "basket", "title": "The first loaf", "kind": "moment", "goal": "Decide what goes in the basket", "log": "Lunch with Mei at five past twelve. You are a baker. The bread is the easy part, or ought to be.", "start": "c1", "nodes": {"c1": {"who": "scene", "say": "Before first light, and for once the first loaf you bake today is not for a customer. What goes in the basket?", "options": [{"text": "A wall loaf, still warm, and good butter. Nothing to hide behind.", "next": null, "act": ["flag:lunch_plain", "stage:fountain"]}, {"text": "Something fancy. A filled roll, tied up like a present.", "next": null, "act": ["flag:lunch_fancy", "stage:fountain"]}, {"text": "Find out what she actually likes. Ask at the café's back door.", "next": "c2"}]}, "c2": {"who": "scene", "say": "The Tram Café's cook doesn't look up from the stove. “Mei? Cheese and pickle. On the end crust, the bit nobody orders. Five years she's eaten the ends so the customers get the middles.” You cut both ends off the best loaf of the morning.", "options": [{"text": "(Wrap them. Five past twelve.)", "next": null, "act": ["flag:lunch_ends", "stage:fountain"]}]}}}, {"id": "fountain", "title": "The fountain rim", "kind": "talk", "with": "mei", "goal": "Meet Mei at the fountain at five past twelve", "log": "Five past twelve, the fountain on Market Square. She has twenty minutes.", "scene": "Mei is already on the fountain rim with her apron off. She looks oddly unarmed without a counter in front of her.", "start": "f1", "starts": [{"need": ["flag:lunch_ends"], "node": "f_ends"}, {"need": ["flag:lunch_fancy"], "node": "f_fancy"}], "nodes": {"f1": {"who": "mei", "mood": "happy", "say": "You came! And it's still warm; I can smell it from here. I've carried warm bread to other people for five years. It's a different thing, being handed it on a fountain.", "options": [{"text": "This one's yours.", "next": "f2"}]}, "f_fancy": {"who": "mei", "mood": "happy", "say": "Oh, it's got a ribbon. It's far too pretty to eat. I'm going to eat it immediately.", "options": [{"text": "That's what it's for.", "next": "f2"}]}, "f_ends": {"who": "mei", "mood": "surprised", "say": "Cheese and pickle. On the end crust. Who told you? No. I know who told you. You asked. You went and asked somebody what I like.", "options": [{"text": "It seemed quicker than guessing.", "next": "f2", "act": ["rep:mei:+8"]}]}, "f2": {"who": "mei", "mood": "thinking", "say": "Right. Twenty minutes, and I've a hundred things to tell you. There's a rumour about the linden on Linden Street, for a start.", "options": [{"text": "Tell me the rumour.", "next": "f_talk"}, {"text": "Not the rumour. You. Where would you go, if the café could spare you for a day?", "next": "f_ask"}, {"text": "Let me tell you about my week first.", "next": "f_me"}]}, "f_talk": {"who": "mei", "mood": "happy", "say": "The council wants it down. A bench instead, if you can believe it. And Hari's been buying compost by the barrow, at night, so you tell me what that means. Oh. That's the twenty past. I talked the whole time, didn't I?", "options": [{"text": "I like listening to you.", "next": "f_talk2"}]}, "f_talk2": {"who": "mei", "mood": "happy", "say": "Everybody does. That's the job. Still. It was a good twenty minutes. Same time next week, and bring the same bread.", "options": [{"text": "Next week.", "next": null, "act": ["end:nice_enough"]}]}, "f_me": {"who": "mei", "mood": "neutral", "say": "Mm. Yes. Go on. No, I am listening. That's the twenty past. I have to run. It was a lovely loaf, truly.", "options": [{"text": "(Watch her go. You never asked her a thing.)", "next": null, "act": ["end:just_lunch"]}]}, "f_ask": {"who": "mei", "mood": "surprised", "say": "Where would I go. Nobody asks me that. People tell me where they've been. I sell coffee to the whole line, both directions, and I have never once ridden it past Market Square.", "options": [{"text": "Never? Where does it go?", "next": "f_ask2"}]}, "f_ask2": {"who": "mei", "mood": "thinking", "say": "The end of the line. It says so on the front. I've read it eleven thousand times and I don't know what's there. A depot, probably. I'd like it to be a field.", "options": [{"text": "Then we'll go and see. Your next evening off.", "next": "f_ask3", "act": ["flag:promised_line"]}, {"text": "It's a depot, Mei. It's always a depot.", "next": "f_depot"}]}, "f_depot": {"who": "mei", "mood": "happy", "say": "It's definitely a depot. Don't tell me, though. Let me have the field a bit longer. That's my tram. Same time next week?", "options": [{"text": "Next week.", "next": null, "act": ["end:went_well"]}]}, "f_ask3": {"who": "mei", "mood": "happy", "say": "You'd ride a tram to a depot with me. That is the most romantic thing anyone has said in this square, and I've overheard four proposals from behind that counter. That's the twenty past. Don't walk me back. I want to think about a field.", "options": [{"text": "(Stay on the fountain rim a while.)", "next": null, "act": ["end:went_well"]}]}}}], "endings": [{"id": "went_well", "title": "She was asked", "log": "You asked Mei a question and listened to the answer. By the twenty past she had told nobody. Mei, telling nobody.", "pay": 0, "rep": {"mei": 20}, "flags": ["courting_mei"], "ripples": ["You are courting Mei. For once, she has told nobody.", "Her regard should now reach 45, which opens dinner.", "If you promised her the end of the line, she has told half the café you'll forget."], "unlocks": "Courting Mei. Dinner opens at regard 45."}, {"id": "nice_enough", "title": "A good twenty minutes", "log": "Mei talked for twenty minutes and you listened. She had a lovely time, and learned nothing about what you think of her.", "pay": 0, "rep": {"mei": 10}, "flags": ["courting_mei"], "ripples": ["You are courting Mei, more or less. Her regard may not yet reach 45; shifts at the café make up the difference.", "In the next quest she says what she noticed about this lunch."], "unlocks": "Courting Mei. Dinner opens at regard 45."}, {"id": "just_lunch", "retake": true, "title": "Just lunch", "log": "You told Mei about your week. She was kind about it. It was a lovely loaf.", "pay": 0, "rep": {"mei": 0}, "flags": [], "ripples": ["Nothing is closed. You can ask her again next week."], "unlocks": "Nothing yet."}]}, {"id": "dinner_mei", "group": "romance", "act": "M2", "title": "The End of the Line", "rank": "Courting Mei: dinner", "giver": "mei", "next": "question_mei", "needs": ["done:lunch_mei:went_well|nice_enough", "rep:mei:45"], "hook": "Once Mei's regard reaches 45, she tells you, and then everyone else, that she has a whole evening off tomorrow.", "summary": "Mei's first whole evening off since the tram was last painted. Dinner, and then the last tram out to the end of the line, which she has read on the front of eleven thousand trams and never seen. On the way she tells you the one piece of news she has told nobody.", "theme": "Can the one who looks after everybody let herself be looked after?", "start": "evening", "stages": [{"id": "evening", "title": "A whole evening", "kind": "talk", "with": "mei", "goal": "Talk to Mei at the Tram Café", "log": "Mei has tomorrow evening off. A whole one. She wants to know where you are taking her.", "start": "p1", "starts": [{"need": ["again:dinner_mei"], "node": "p_again"}], "nodes": {"p_again": {"who": "mei", "mood": "happy", "say": "You left me with thirty tables and took the bus home. I have decided to find it funny. I've another evening off. Where are you taking me this time?", "options": [{"text": "The end of the line. I promised.", "next": "p_line", "need": ["flag:promised_line"]}, {"text": "The food hall at Northgate. Somebody else carries the plates for once.", "next": "p_hall"}, {"text": "Where would you like to go?", "next": "p_choose", "need": ["done:lunch_mei:went_well"], "act": ["rep:mei:+5"]}, {"text": "Where would you like to go?", "next": "p_choose2", "need": ["done:lunch_mei:nice_enough"], "act": ["rep:mei:+5"]}]}, "p1": {"who": "mei", "mood": "happy", "say": "Tomorrow. I've got tomorrow evening off. A whole one. I've not had a whole evening since the tram was last painted. Where are you taking me?", "options": [{"text": "The end of the line. I promised.", "next": "p_line", "need": ["flag:promised_line"]}, {"text": "The food hall at Northgate. Somebody else carries the plates for once.", "next": "p_hall"}, {"text": "Where would you like to go?", "next": "p_choose", "need": ["done:lunch_mei:went_well"], "act": ["rep:mei:+5"]}, {"text": "Where would you like to go?", "next": "p_choose2", "need": ["done:lunch_mei:nice_enough"], "act": ["rep:mei:+5"]}]}, "p_line": {"who": "mei", "mood": "happy", "say": "You remembered. I've told half the café you'd forget. Bring supper in a basket. We'll take the last tram out and see what's there.", "options": [{"text": "Supper and the last tram.", "next": null, "act": ["flag:dinner_line", "stage:tram"]}]}, "p_choose": {"who": "mei", "mood": "surprised", "say": "You're doing it again. Asking. I'll never get used to it. The end of the line. Bring supper in a basket; we'll take the last tram out.", "options": [{"text": "Supper and the last tram.", "next": null, "act": ["flag:dinner_line", "stage:tram"]}]}, "p_choose2": {"who": "mei", "mood": "surprised", "say": "Where would I like to go. You're asking me. You didn't, at lunch; I noticed. The end of the line. It says so on the front of every tram I've ever served, and I've never seen what's there. I'd like it to be a field. Bring supper in a basket.", "options": [{"text": "Supper and the last tram.", "next": null, "act": ["flag:dinner_line", "stage:tram"]}]}, "p_hall": {"who": "mei", "mood": "thinking", "say": "Northgate. With the lights, and the music in the ceiling. I've never eaten anywhere I didn't know who washed the cups. All right. Go on, then. Impress me.", "options": [{"text": "Seven o'clock.", "next": null, "act": ["stage:hall"]}]}}}, {"id": "hall", "title": "Thirty tables, one waiter", "kind": "talk", "with": "mei", "optional": true, "goal": "Dinner at the Northgate Mall food hall, seven o'clock", "log": "The food hall at Northgate Mall. Seven o'clock. Somebody else is supposed to carry the plates tonight.", "scene": "Thirty tables, one waiter, and a tray rack nobody has cleared since six. Mei sits with her hands in her lap for almost a full minute.", "start": "h1", "nodes": {"h1": {"who": "mei", "mood": "thinking", "say": "He's on his own. That boy. Thirty tables, and he's stacking the cups wrong; they'll go over. I'll only be a second.", "options": [{"text": "Sit down, Mei. You're off tonight. Let somebody bring you something.", "next": "h_sit"}, {"text": "Come on, then. I'll take the trays, you take the tables.", "next": "h_help"}, {"text": "We came here to eat. Can't you leave it alone for one evening?", "next": "h_sulk"}]}, "h_sit": {"who": "mei", "mood": "sad", "say": "I don't know how. That's the stupid part. When somebody else carries the plates, I feel as if I've stolen something.", "options": [{"text": "You've carried enough for the whole line. Sit. I'll watch the cups for you.", "next": "h_sit2"}]}, "h_sit2": {"who": "mei", "mood": "happy", "dir": "She sits. It takes her until the soup to stop watching the waiter, and until the bread to say so.", "say": "This is nice. Being the table. I didn't know it was nice. Don't tell the café.", "options": [{"text": "There's still a last tram.", "next": null, "act": ["rep:mei:+8", "flag:mei_sat", "stage:tram"]}]}, "h_help": {"who": "mei", "mood": "happy", "say": "You'd clear tables on an evening out? You're as bad as I am. Right. Trays to the rack, cups in stacks, and smile; they tip better.", "options": [{"text": "(Clear thirty tables. Eat standing up, laughing.)", "next": "h_help2"}]}, "h_help2": {"who": "mei", "mood": "happy", "say": "Best dinner I've ever had, and I had it leaning on a tray rack. The boy gave us a free pudding. Come on. There's still a last tram.", "options": [{"text": "The last tram.", "next": null, "act": ["rep:mei:+5", "stage:tram"]}]}, "h_sulk": {"who": "mei", "mood": "angry", "say": "No. I can't. That's who you asked out. I'll be two minutes, and you can decide whether you still want to be here when I'm back.", "options": [{"text": "I'm sorry. Go on. I'll keep your soup warm.", "next": "h_sorry"}, {"text": "(Leave her to it. Take the bus home alone.)", "next": null, "act": ["end:long_way_home"]}]}, "h_sorry": {"who": "mei", "mood": "neutral", "say": "Apology accepted. Mostly. The soup's cold, and that's on you. There's a last tram, if you still want it.", "options": [{"text": "I still want it.", "next": null, "act": ["rep:mei:-5", "flag:sulked", "stage:tram"]}]}}}, {"id": "tram", "title": "The last tram out", "kind": "talk", "with": "mei", "goal": "Ride the last tram out with Mei", "log": "The last tram out of Market Square. It says END OF THE LINE on the front.", "scene": "The tram is nearly empty. The town goes by backwards in the window. Mei has both hands round the rail and is reading every stop aloud as if it were news.", "start": "t1", "starts": [{"need": ["done:lunch_mei:nice_enough", "!flag:dinner_line"], "node": "t1_wish"}], "nodes": {"t1": {"who": "mei", "mood": "happy", "say": "That was the last stop I know. One stop past it, and I'm a tourist!", "options": [{"text": "What's it like, being a tourist?", "next": "t2"}]}, "t1_wish": {"who": "mei", "mood": "happy", "say": "That was the last stop I know. One stop past it, and I'm a tourist! It says END OF THE LINE on the front of every tram I have ever served, and I've never seen what's there. A depot, probably. I'd like it to be a field.", "options": [{"text": "What's it like, being a tourist?", "next": "t2"}]}, "t2": {"who": "mei", "mood": "thinking", "say": "Quiet. Nobody out here knows I'm the one who knows everything. Can I tell you a thing? A real one. Not news.", "options": [{"text": "Tell me.", "next": "t3", "need": ["done:lunch_mei:went_well"]}, {"text": "Tell me.", "next": "t3b", "need": ["done:lunch_mei:nice_enough", "!flag:dinner_line"]}, {"text": "Tell me.", "next": "t3c", "need": ["done:lunch_mei:nice_enough", "flag:dinner_line"]}]}, "t3": {"who": "mei", "mood": "sad", "say": "Everybody tells me things. All day, the whole line. And nobody asks me anything, because I'm the one behind the counter, and a counter doesn't have a life. You asked. I've been cross with you about it all week, because I didn't know what to do with it.", "options": [{"text": "What's the real thing, then?", "next": "t4"}]}, "t3b": {"who": "mei", "mood": "sad", "say": "Everybody tells me things. All day, the whole line. And nobody asks me anything. You didn't either, at lunch. I talked for twenty minutes and you let me. I noticed. I'm saying so because I'd like you to ask me something now.", "options": [{"text": "What's the real thing, then?", "next": "t4"}]}, "t3c": {"who": "mei", "mood": "sad", "say": "Everybody tells me things. All day, the whole line. And nobody asks me anything. You did, yesterday. Late, but you did. I've been cross with you about it since, because I didn't know what to do with it.", "options": [{"text": "What's the real thing, then?", "next": "t4"}]}, "t4": {"who": "mei", "mood": "thinking", "say": "Old Bram's selling up. The café. He's offered me the lease first, and Linden Bank will lend on it. I've told four hundred people their own business this week, and not one of them mine. I can run a counter. I don't know if I can own one.", "options": [{"text": "Take it. You've run that café for five years. He only held the keys.", "next": "t_take", "act": ["flag:mei_takes_cafe"]}, {"text": "Do the sums first. I'll sit with you while you do them.", "next": "t_sums"}, {"text": "What do you want, Mei?", "next": "t_want", "act": ["rep:mei:+5"]}]}, "t_take": {"who": "mei", "mood": "happy", "say": "He did only hold the keys. Oh, I'm going to say that to his face. Kindly. All right. I'll take it. I've said it to a person now. It's real.", "options": [{"text": "(The tram slows. End of the line.)", "next": null, "act": ["stage:field"]}]}, "t_sums": {"who": "mei", "mood": "happy", "say": "You'd sit there while I do sums. That's worse than the tram. That's nearly a proposal. Don't panic. I said nearly.", "options": [{"text": "(The tram slows. End of the line.)", "next": null, "act": ["stage:field"]}]}, "t_want": {"who": "mei", "mood": "happy", "say": "The café. I want the café. I've wanted it since I learned the till. There. You asked, and I've said it to a person, and now it's real.", "options": [{"text": "(The tram slows. End of the line.)", "next": null, "act": ["flag:mei_takes_cafe", "stage:field"]}]}}}, {"id": "field", "title": "What's there", "kind": "talk", "with": "mei", "goal": "Get off at the end of the line", "log": "The end of the line. The last tram back leaves in a quarter of an hour.", "scene": "The end of the line is a depot: a row of dark trams, ticking as they cool. And behind the depot fence, a field running down to the brook, with the whole of Old Town lit up beyond it.", "start": "e1", "nodes": {"e1": {"who": "mei", "mood": "surprised", "say": "It's a depot. And a field. It's both. I didn't know it was allowed to be both.", "options": [{"text": "Supper's in the basket.", "next": "e_supper", "need": ["flag:dinner_line", "flag:lunch_ends"]}, {"text": "Supper's in the basket.", "next": "e_supper2", "need": ["flag:dinner_line", "!flag:lunch_ends"]}, {"text": "Worth the ride?", "next": "e_worth"}]}, "e_supper": {"who": "mei", "mood": "happy", "say": "Cheese and pickle, on the ends. On the fence of a tram depot. I am going to describe this to so many people.", "options": [{"text": "All of it?", "next": "e2"}]}, "e_supper2": {"who": "mei", "mood": "happy", "say": "Bread and cheese, on the fence of a tram depot. I am going to describe this to so many people.", "options": [{"text": "All of it?", "next": "e2"}]}, "e_worth": {"who": "mei", "mood": "happy", "say": "Worth every stop. I am going to describe this to so many people.", "options": [{"text": "All of it?", "next": "e2"}]}, "e2": {"who": "mei", "mood": "thinking", "dir": "She is quiet for a whole minute, which you have never once seen.", "say": "No. Not this bit. That's how you'll know it mattered. Everything else I tell. This I'm keeping.", "options": [{"text": "(Take her hand.)", "next": "e3"}, {"text": "Then I'll keep it too.", "next": "e3"}]}, "e3": {"who": "mei", "mood": "happy", "say": "Right. The last tram back's in four minutes, and tomorrow the whole town will know we're walking out, because I'll have told them myself. I'd rather they heard it right.", "options": [{"text": "Tell them at five past twelve. I'll bring the bread.", "next": null, "need": ["!flag:sulked"], "act": ["end:the_field"]}, {"text": "Tell them at five past twelve. I'll bring the bread.", "next": null, "need": ["flag:sulked"], "act": ["end:good_evening"]}]}}}], "endings": [{"id": "the_field", "title": "A depot and a field", "log": "Mei saw the end of the line. She told the whole town about the evening, except for one minute of it, which she kept.", "pay": 0, "rep": {"mei": 25}, "flags": ["mei_steady"], "ripples": ["By morning the town knows, from Mei herself. Olu has opinions. Noor says “Hm”, the high one.", "Her regard is now near or past the 75 the question needs. Any gap is made up with shifts at the café.", "If she is taking the café, she is about to become your equal on the square: a counter of her own beside your oven."], "unlocks": "Walking out with Mei. The question opens at regard 75."}, {"id": "good_evening", "title": "A good evening, mostly", "log": "The soup was cold and that was on you. The field was still a field.", "pay": 0, "rep": {"mei": 12}, "flags": ["mei_steady"], "ripples": ["You are still walking out. Her regard is some way short of the 75 the question needs; it has to be made up the slow way.", "She tells the story of the cold soup. Often. With affection, by the third telling."], "unlocks": "Walking out with Mei. The question opens at regard 75."}, {"id": "long_way_home", "retake": true, "title": "The bus home", "log": "You took the bus home alone. Mei cleared thirty tables and came back with the waiter's thanks.", "pay": 0, "rep": {"mei": -12}, "flags": [], "ripples": ["She does not tell this one. You can ask for another evening when her regard has recovered."], "unlocks": "Nothing. The evening can be asked for again."}]}, {"id": "question_mei", "group": "romance", "act": "M3", "title": "A Door of Our Own", "rank": "Courting Mei: the question", "giver": "mei", "next": "the_wedding", "needs": ["done:dinner_mei:the_field|good_evening", "rep:mei:75"], "hook": "Once Mei's regard reaches 75. You walk into the Tram Café at closing with a face on.", "summary": "Mei says yes before you have finished asking, and then says not yet. She has lived her whole life behind thin walls, and she watched her mother marry on love and a Tuesday wage. She wants a door that is theirs, and something put by. Then you may ask again.", "theme": "Love is the easy part. Can you keep a roof over it?", "start": "ask", "stages": [{"id": "ask", "title": "A face on", "kind": "talk", "with": "mei", "goal": "Talk to Mei at the Tram Café at closing time", "log": "Closing time at the Tram Café. Mei is stacking chairs. You have something to ask her.", "start": "q1", "starts": [{"need": ["again:question_mei", "home:owned", "money:15000"], "node": "q_ready_again"}, {"need": ["home:owned", "money:15000"], "node": "q_already"}, {"need": ["again:question_mei"], "node": "q_again"}], "nodes": {"q_again": {"who": "mei", "mood": "thinking", "say": "You've a face on again. The same face. Is it the same question?", "options": [{"text": "The same question. And this time I'll hear you out.", "next": "q_again2", "need": ["!home:owned", "!money:15000"]}, {"text": "The same question. And this time I'll hear you out.", "next": "q_again2h", "need": ["home:owned", "!money:15000"]}, {"text": "The same question. And this time I'll hear you out.", "next": "q_again2m", "nee
