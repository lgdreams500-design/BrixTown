; bright as Blender's), out of doors with the sun on the horizon, at night out of doors and at night in a room.
; NightHaze: the distance at night. NightLux, NightColour, NightFrom: the night's faint light from high up (x east,
; y south, z up); NightSky: how much of it the air gives back, which is the night sky's blue and its fill in the streets.
