 for(let r=0;r*26<gy-H*.12;r++)for(let c=-1;c*58<W;c++){const xx=c*58+(r%2)*29,yy=H*.12+r*26,t=((c*7+r*13)%5)/5;

function options(){const page=document.getElementById("page");
 page.innerHTML='<h1>Markers over heads: four options</h1><p class="s">Dusk, the hardest light. In each: a resident with a new quest (left), the person your quest says to see, close enough to talk (middle), a café keeper far off (right, dimmer: nothing new there).</p>';
 const row=document.createElement("div");row.className="row";page.appendChild(row);

  lantern:["B · Little lantern","An iron lantern lit from inside, the sign as a shadow on its glass; the type’s colour on its band."],
  sign:["C · Hanging sign","A small painted board on chains, as on the shop fronts: the type’s colour, a cream sign, a lamp lighting it."],

  ["behind a wall",(x,y)=>{el("circle",{cx:x,cy:y,r:18,fill:"none",stroke:"#efe4cc","stroke-opacity":.45,"stroke-width":2,"stroke-dasharray":"4 4"},sv);icon(sv,"talk",x,y,19,"#efe4cc",2.4).setAttribute("opacity",.45);}],
  ["new: bright, pulses",(x,y)=>token(sv,sv,x,y,18,"letter","offer")],
  ["under way: steady",(x,y)=>token(sv,sv,x,y,18,"talk","active")],

  ["off screen: edge arrow",(x,y)=>{el("path",{d:`M${x+26} ${y}l-12 -12v24z`,fill:"#e0964e"},sv);token(sv,sv,x-6,y,14,"letter","offer");}]];
